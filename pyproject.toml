[project]
name = "bankassist"
version = "0.1.0"
description = "Olink Bank Assist — white-label AI banking assistant for Ethiopian banks (Phase 1 MVP)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "httpx>=0.27",
    "pydantic>=2.7",
    # sqlalchemy alone has no Postgres driver; without this, setting
    # BANKASSIST_DATABASE_URL to a postgresql:// URL fails at engine-creation
    # time with ModuleNotFoundError. SQLAlchemy's plain "postgresql://" scheme
    # defaults to psycopg2 specifically — this is that driver, binary wheel so
    # no build toolchain/libpq-dev needed in the Docker image.
    "psycopg2-binary>=2.9",
    # Argon2id for admin passwords. Chosen over bcrypt because it is
    # memory-hard: a GPU or ASIC attacking a stolen hash gains far less than it
    # does against bcrypt's CPU-bound work. Parameters follow the OWASP
    # minimum (19 MiB, t=2, p=1) rather than the library defaults, which ask
    # for 64 MiB — enough that a burst of concurrent logins on a 512 MiB
    # Cloud Run instance would start competing for memory with the app.
    "argon2-cffi>=23.1",
    # Vertex AI is called over plain REST, but its auth is not: Application
    # Default Credentials resolves the Cloud Run runtime service account via
    # the metadata server (and a key file or gcloud creds locally), which
    # means no API key to store or rotate. Hand-rolling that would need RSA
    # JWT signing and a crypto dependency anyway — this is the smaller,
    # standard primitive, not a vendor SDK.
    "google-auth>=2.30",
    # Starlette needs this for `request.form()`, and the SMS webhook needs
    # that: aggregators split roughly evenly between form-encoded and JSON
    # callbacks, and which one a vendor uses is not ours to choose. Without
    # it the form half 500s at runtime — an assertion inside Starlette, not
    # an import error, so it surfaces on the first real inbound SMS rather
    # than at startup.
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
    "mypy>=1.10",
    # Builds review/Olink_Bank_Assist_language_review.xlsx, the workbook the
    # translators actually work in. Declared so CI can rebuild it and assert
    # the committed binary still matches the strings it claims to carry — an
    # undeclared import makes that test skip silently, which is worse than
    # not having written it.
    "openpyxl>=3.1",
    # Reads the variable-font axes out of the vendored woff2 files. Declared
    # for the same reason openpyxl is: the test that needs it would otherwise
    # skip silently, and the thing it guards is invisible without it.
    #
    # What it guards: Inter must ship with its OPTICAL-SIZE axis. The first
    # build of the fonts shipped the weight-only file, which has no `opsz`,
    # so the 46px sign-in headline rendered in Inter's text cut instead of
    # its display cut — looser and softer, and visibly not the Inter anyone
    # recognises. Nothing about that is detectable from a filename, a byte
    # count, or the CSS; only the font's own `fvar` table says it.
    #
    # brotli is not used directly — fontTools needs it to decompress woff2.
    "fonttools>=4.50",
    "brotli>=1.1",
]

[tool.setuptools]
packages = ["bankassist"]

[tool.setuptools.package-data]
bankassist = ["static/*", "*.json"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.ruff.lint.flake8-bugbear]
# Depends()/Header() in defaults is the canonical FastAPI dependency idiom.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Header"]

[tool.mypy]
python_version = "3.11"
strict = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
