name: Deploy to Cloud Run

# Runs only after CI (quality + docker jobs) has passed on main — never
# deploys code that hasn't been verified, even if someone bypasses PR review.
on:
  workflow_run:
    workflows: ["CI"]
    branches: [main]
    types: [completed]
  workflow_dispatch: {} # manual "Run workflow" button for a one-off redeploy

env:
  REGION: us-east1
  SERVICE: bankassist
  REPO: bankassist

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # only needed if/when this switches to Workload Identity Federation
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build and push image
        run: |
          IMAGE="${{ env.REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.REPO }}/${{ env.SERVICE }}"
          docker build -t "$IMAGE:${{ github.sha }}" -t "$IMAGE:latest" .
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Deployed environments always migrate (CLAUDE.md doctrine) — this is
      # the actual migration trigger; the container itself only runs
      # uvicorn. Idempotent: alembic no-ops on an up-to-date schema, and
      # every seed_*.py skips banks that already exist, so this is safe to
      # run on every single deploy, including ones that touch no schema or
      # content at all.
      - name: Run database migrations and seed tenants
        run: |
          pip install .
          # A failed `gcloud secrets versions access` here must stop the
          # job immediately — bash's `set -e` does NOT propagate a failing
          # command substitution through a plain assignment, so without
          # this explicit check a missing/misnamed secret silently leaves
          # BANKASSIST_DATABASE_URL empty and fails much later with a
          # confusing SQLAlchemy URL-parse error instead of a clear one.
          DB_URL="$(gcloud secrets versions access latest --secret=bankassist-database-url --project=${{ secrets.GCP_PROJECT_ID }})" \
            || { echo "::error::Failed to fetch bankassist-database-url from Secret Manager — check it exists and the deployer service account has secretAccessor on it."; exit 1; }
          # Strip a leading UTF-8 BOM and any whitespace a secret-writing
          # tool may have introduced. Windows PowerShell 5.1's
          # `Out-File -Encoding utf8` silently prepends a BOM, which isn't
          # whitespace and survives a plain trim — SQLAlchemy then fails
          # with a generic "Could not parse SQLAlchemy URL from given URL
          # string" that doesn't hint at the real cause.
          export BANKASSIST_DATABASE_URL="$(printf '%s' "$DB_URL" | sed '1s/^\xef\xbb\xbf//' | tr -d '[:space:]')"
          python -m alembic upgrade head
          python -m bankassist.seed
          python -m bankassist.seed_cbe
          python -m bankassist.seed_dashen
          python -m bankassist.seed_awash

      # Explicitly set the *runtime* identity too. Without --service-account
      # here, Cloud Run defaults a new revision to the project's generic
      # Compute Engine default service account, which was never granted
      # secretAccessor — deploys succeeded but the revision itself failed to
      # start with "Permission denied on secret ... for Revision service
      # account NNN-compute@developer.gserviceaccount.com". Reusing
      # bankassist-deployer (already has secretAccessor + serviceAccountUser)
      # fixes this with zero new manual gcloud commands. Known tradeoff:
      # this SA is now both the CI deployer and the runtime identity, more
      # privilege than the running service strictly needs — fine for now,
      # worth splitting into a dedicated minimal runtime SA later.
      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${{ env.SERVICE }} \
            --project "${{ secrets.GCP_PROJECT_ID }}" \
            --image "${{ env.REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.REPO }}/${{ env.SERVICE }}:${{ github.sha }}" \
            --region "${{ env.REGION }}" \
            --port 8000 \
            --allow-unauthenticated \
            --min-instances 0 \
            --max-instances 3 \
            --memory 512Mi \
            --service-account "bankassist-deployer@${{ secrets.GCP_PROJECT_ID }}.iam.gserviceaccount.com" \
            --set-secrets "BANKASSIST_DATABASE_URL=bankassist-database-url:latest" \
            --quiet

      # Cloud Run's URL isn't known until after the service exists, so this
      # self-discovers it instead of requiring a CLOUD_RUN_HOSTNAME secret
      # to be set up front — one less manual bootstrapping step, and it
      # stays correct even if the service is ever recreated under the
      # same name.
      - name: Point APP_BASE_URL at the live Cloud Run URL
        run: |
          URL="$(gcloud run services describe ${{ env.SERVICE }} --project ${{ secrets.GCP_PROJECT_ID }} --region ${{ env.REGION }} --format='value(status.url)')"
          gcloud run services update ${{ env.SERVICE }} \
            --project "${{ secrets.GCP_PROJECT_ID }}" \
            --region "${{ env.REGION }}" \
            --set-env-vars "APP_BASE_URL=${URL}" \
            --quiet
          echo "Deployed: $URL"
