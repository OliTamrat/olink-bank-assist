name: Deploy to Cloud Run

# Runs only after CI (quality + docker jobs) has passed on main — never
# deploys code that hasn't been verified, even if someone bypasses PR review.
on:
  workflow_run:
    workflows: ["CI"]
    branches: [main]
    types: [completed]
  workflow_dispatch: {} # manual "Run workflow" button for a one-off redeploy

# Cloud Run uses optimistic concurrency on the service resource, so two
# deploys in flight at once make the loser abort with
# "Conflict for resource 'bankassist': version X was specified but current
# version is Y". Merging two PRs seconds apart did exactly that: both fired a
# deploy of the same commit, the first won, the second failed — a red X on a
# deployment that had actually succeeded.
#
# Queue instead of cancelling. A deploy is mid-flight against a live service
# and a database; interrupting one is worse than waiting for it. The newest
# queued run still wins, so the final state is always the latest commit.
concurrency:
  group: deploy-cloud-run
  cancel-in-progress: false

env:
  REGION: us-east1
  SERVICE: bankassist
  REPO: bankassist

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # only needed if/when this switches to Workload Identity Federation
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      # Attempt, retry once, then check what we actually ended up with.
      #
      # This step resolves "latest" against an upstream endpoint and downloads
      # the SDK, so it is a network fetch in the critical path of every deploy.
      # It returned `unexpected HTTP response: 404` on the run for ff96962 and
      # took the whole deploy down with it — nothing was built, migrated or
      # released, which is the safe way to fail but still a failure caused
      # entirely outside this repository.
      #
      # `continue-on-error` on both attempts is not a way to ignore the
      # problem: the verify step below is the real gate. GitHub's Ubuntu runner
      # images ship the Google Cloud CLI preinstalled, so a total outage of
      # this action no longer blocks a release — and if gcloud genuinely is not
      # on PATH, `gcloud --version` fails the job immediately with an obvious
      # message rather than something cryptic three steps later.
      - id: gcloud_setup
        uses: google-github-actions/setup-gcloud@v2
        continue-on-error: true

      - id: gcloud_setup_retry
        if: steps.gcloud_setup.outcome == 'failure'
        uses: google-github-actions/setup-gcloud@v2
        continue-on-error: true

      - name: Verify gcloud is available
        run: |
          if ! command -v gcloud >/dev/null; then
            echo "::error::gcloud is not on PATH. setup-gcloud failed (outcome: ${{ steps.gcloud_setup.outcome }}, retry: ${{ steps.gcloud_setup_retry.outcome }}) and the runner image did not provide it."
            exit 1
          fi
          gcloud --version

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build and push image
        run: |
          IMAGE="${{ env.REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.REPO }}/${{ env.SERVICE }}"
          docker build -t "$IMAGE:${{ github.sha }}" -t "$IMAGE:latest" .
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Deployed environments always migrate (CLAUDE.md doctrine) — this is
      # the actual migration trigger; the container itself only runs
      # uvicorn. Idempotent: alembic no-ops on an up-to-date schema, and
      # every seed_*.py skips banks that already exist, so this is safe to
      # run on every single deploy, including ones that touch no schema or
      # content at all.
      - name: Run database migrations and seed tenants
        run: |
          pip install .
          # A failed `gcloud secrets versions access` here must stop the
          # job immediately — bash's `set -e` does NOT propagate a failing
          # command substitution through a plain assignment, so without
          # this explicit check a missing/misnamed secret silently leaves
          # BANKASSIST_DATABASE_URL empty and fails much later with a
          # confusing SQLAlchemy URL-parse error instead of a clear one.
          DB_URL="$(gcloud secrets versions access latest --secret=bankassist-database-url --project=${{ secrets.GCP_PROJECT_ID }})" \
            || { echo "::error::Failed to fetch bankassist-database-url from Secret Manager — check it exists and the deployer service account has secretAccessor on it."; exit 1; }
          # Strip a leading UTF-8 BOM and any whitespace a secret-writing
          # tool may have introduced. Windows PowerShell 5.1's
          # `Out-File -Encoding utf8` silently prepends a BOM, which isn't
          # whitespace and survives a plain trim — SQLAlchemy then fails
          # with a generic "Could not parse SQLAlchemy URL from given URL
          # string" that doesn't hint at the real cause.
          export BANKASSIST_DATABASE_URL="$(printf '%s' "$DB_URL" | sed '1s/^\xef\xbb\xbf//' | tr -d '[:space:]')"
          # Bracket the upgrade with the revision it is at. `upgrade head` is
          # a no-op on an up-to-date schema and says so identically either
          # way, so without these two lines the deploy log cannot tell you
          # whether production's schema actually changed on this push.
          #
          # These used to read `echo "Schema before: $(… | tail -1)"`, and on
          # 2026-08-26 that hid a REAL SIXTEEN-MINUTE DATABASE OUTAGE. The
          # first connection hung and then failed, and the line printed:
          #
          #   Schema before: (Background on this error at: https://sqlalche.me/e/20/e3q8)
          #
          # — the last line of a Python traceback, which is a URL footer and
          # names nothing. Two faults compounded: a command substitution
          # inside `echo` makes `set -e` blind to the failure (the same quirk
          # this file already guards against for the secret fetch above), and
          # `tail -1` of a traceback throws away every line that says what
          # broke. The step "succeeded", the deploy carried on, and the outage
          # was invisible until somebody went looking for why a step was slow.
          #
          # Not fatal, deliberately: the `upgrade head` on the next line makes
          # its own connection and fails loudly if the database is still gone,
          # and a transient blip should not fail a deploy that then works. The
          # requirement is that it be SEEN, not that it stop the world.
          #
          # The elapsed time is printed for the same reason. Sixteen minutes
          # and two seconds are the same log line without it, and the duration
          # was the only clue that anything had happened at all.
          # The function PRINTS its own label and is called directly — never
          # as `echo "Schema before: $(schema_at)"`. A substitution would
          # capture the `::warning::` annotation and the traceback into the
          # echoed string, so the annotation would never reach Actions and the
          # error would be back inside one line. That is this same trap for
          # the third time in these seven lines; it is not a subtle one to
          # fall into, only a subtle one to notice.
          # The assignment is the `if` CONDITION, not a statement of its own.
          # This step runs under `bash -e`, where a bare `out="$(cmd)"` whose
          # substitution fails takes the exit status of the substitution and
          # kills the script on the spot — so a `rc=$?` on the next line never
          # runs and nothing is reported at all. (Confirmed by running this
          # against a refused connection: no output, exit 1.) A command used
          # as a condition is exempt, which is what makes the else branch
          # reachable.
          schema_at() {
            local out start=$SECONDS
            if out="$(python -m alembic current 2>&1)"; then
              printf '%s %s (%ss)\n' "$1" "$(printf '%s' "$out" | tail -1)" "$((SECONDS - start))"
            else
              echo "::warning::Could not read the schema revision — the database did not answer after $((SECONDS - start))s. Continuing; the upgrade below makes its own connection and will fail loudly if it is still unreachable."
              printf '%s\n' "$out" | tail -5
              echo "$1 UNREACHABLE after $((SECONDS - start))s"
            fi
          }
          schema_at "Schema before:"
          python -m alembic upgrade head
          schema_at "Schema after: "
          python -m bankassist.seed
          python -m bankassist.seed_cbe
          python -m bankassist.seed_dashen
          python -m bankassist.seed_awash

      # Explicitly set the *runtime* identity too. Without --service-account
      # here, Cloud Run defaults a new revision to the project's generic
      # Compute Engine default service account, which was never granted
      # secretAccessor — deploys succeeded but the revision itself failed to
      # start with "Permission denied on secret ... for Revision service
      # account NNN-compute@developer.gserviceaccount.com". Reusing
      # bankassist-deployer (already has secretAccessor + serviceAccountUser)
      # fixes this with zero new manual gcloud commands. Known tradeoff:
      # this SA is now both the CI deployer and the runtime identity, more
      # privilege than the running service strictly needs — fine for now,
      # worth splitting into a dedicated minimal runtime SA later.
      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${{ env.SERVICE }} \
            --project "${{ secrets.GCP_PROJECT_ID }}" \
            --image "${{ env.REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.REPO }}/${{ env.SERVICE }}:${{ github.sha }}" \
            --region "${{ env.REGION }}" \
            --port 8000 \
            --allow-unauthenticated \
            --min-instances 0 \
            --max-instances 3 \
            --memory 512Mi \
            --service-account "bankassist-deployer@${{ secrets.GCP_PROJECT_ID }}.iam.gserviceaccount.com" \
            --set-secrets "BANKASSIST_DATABASE_URL=bankassist-database-url:latest,LIVEKIT_API_KEY=bankassist-livekit-api-key:latest,LIVEKIT_API_SECRET=bankassist-livekit-api-secret:latest" \
            --set-env-vars "GOOGLE_GENAI_USE_VERTEXAI=1,GOOGLE_CLOUD_PROJECT=${{ secrets.GCP_PROJECT_ID }},VERTEX_LOCATION=us-central1,BANKASSIST_GIT_SHA=${{ github.sha }},LIVEKIT_URL=wss://olink-bank-assist-vfutbbvq.livekit.cloud" \
            --quiet

      # Cloud Run's URL isn't known until after the service exists, so this
      # self-discovers it instead of requiring a CLOUD_RUN_HOSTNAME secret
      # to be set up front — one less manual bootstrapping step, and it
      # stays correct even if the service is ever recreated under the
      # same name.
      - name: Point APP_BASE_URL at the live Cloud Run URL
        run: |
          URL="$(gcloud run services describe ${{ env.SERVICE }} --project ${{ secrets.GCP_PROJECT_ID }} --region ${{ env.REGION }} --format='value(status.url)')"
          # --update-env-vars MERGES; --set-env-vars REPLACES the whole
          # environment. This step runs after the deploy that sets the Vertex
          # variables, so using --set here would silently delete them and
          # drop the service back to extractive answers with no error.
          gcloud run services update ${{ env.SERVICE }} \
            --project "${{ secrets.GCP_PROJECT_ID }}" \
            --region "${{ env.REGION }}" \
            --update-env-vars "APP_BASE_URL=${URL}" \
            --quiet
          echo "Deployed: $URL"
          gcloud run services describe ${{ env.SERVICE }} \
            --project "${{ secrets.GCP_PROJECT_ID }}" --region "${{ env.REGION }}" \
            --format='value(spec.template.spec.containers[0].env)'
