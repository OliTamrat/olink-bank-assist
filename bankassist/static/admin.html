function icon(name, size) {
  return '<svg width="' + (size || 17) + '" height="' + (size || 17) + '" viewBox="0 0 24 24"' +
    ' fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"' +
    ' stroke-linejoin="round">' + (ICONS[name] || "") + "</svg>";
}

var state = {
  slug: localStorage.getItem("ba_slug") || "",
  token: "",          // break-glass only; never persisted (see signInWithToken)
  me: null,           // { email, role, permissions[] } — null on the token path
  page: null,
  days: 30,
  hstatus: "open",
  openHandoffs: null,
  channels: [],       // the catalogue, fetched once — drives the rail sub-nav
  channel: null,      // which channel's page is open, if any
  railOpen: localStorage.getItem("ba_chan_open") !== "0",
  loadedAt: null      // when the open page last fetched, for the topbar stamp
};

/* ------------------------------------------------------------- plumbing */
function $(id) { return document.getElementById(id); }
function esc(s) { var d = document.createElement("div"); d.textContent = s == null ? "" : s; return d.innerHTML; }
/* Confirmations, as a card rather than as text in the furniture.
 *
 * Same signature as the status line it replaces, so all fifty-three call
 * sites keep working unchanged and none of them had to be touched to get a
 * better confirmation. The optional second argument is what lets a failure
 * look like a failure: twenty-one of those sites pass an error message, and
 * until now a failed publish and a successful one produced identical grey
 * text.
 *
 * Everything auto-dismisses. Nothing here is important enough to make
 * somebody click it away, and a confirmation that demands dismissal is one
 * people learn to dismiss without reading. Errors get the full ten seconds
 * because they are the ones worth finishing; routine confirmations get six.
 */
var TOAST_MS = { bad: 10000, ok: 6000, info: 6000 };
// Inline rather than through the nav's icon() helper: these are 16px glyphs
// for a card, not 18px sidebar icons, and routing them through a function
// built for another purpose is how the two drift apart.
var TOAST_ICON = {
  ok:  '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>',
  bad: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6L6 18M6 6l12 12"/></svg>',
  info:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg>'
};
var TOAST_MAX = 3;

function setStatus(text, kind) {
  var host = $("toasts");
  if (!host) return;
  // The old contract: an empty message cleared the line. go() calls this on
  // every page change, and a stale confirmation following somebody to another
  // screen is exactly what it was clearing.
  if (!text) { host.innerHTML = ""; return; }

  var cls = kind === "error" || kind === "bad" ? "bad"
          : kind === "success" || kind === "ok" ? "ok" : "info";

  var card = document.createElement("div");
  card.className = "toast " + cls;
  // Errors interrupt; confirmations wait their turn. A screen reader
  // announcing "Saved" over what somebody is typing is the same rudeness as
  // a modal.
  card.setAttribute("role", cls === "bad" ? "alert" : "status");
  card.innerHTML =
    '<span class="ico">' + TOAST_ICON[cls] + "</span>" +
    '<span class="body">' + esc(text) + "</span>" +
    '<button type="button" class="x" aria-label="' + esc(A("close", "Close")) + '">&times;</button>';

  host.appendChild(card);
  // Oldest first, so a burst of saves does not push the newest off screen.
  while (host.children.length > TOAST_MAX) host.removeChild(host.firstChild);

  var timer = setTimeout(function () { dismissToast(card); }, TOAST_MS[cls] || 6000);
  card.querySelector(".x").onclick = function () {
    clearTimeout(timer);
    dismissToast(card);
  };
}

function dismissToast(card) {
  if (!card.parentNode) return;
  card.className += " out";
  // Matches the animation; removed on a timer rather than animationend so a
  // browser with animations disabled still cleans up.
  setTimeout(function () {
    if (card.parentNode) card.parentNode.removeChild(card);
  }, 200);
}

function api(path, opts) {
  opts = opts || {};
  opts.credentials = "same-origin";           // carries the session cookie
  if (state.token) {
    opts.headers = opts.headers || {};
    opts.headers["X-Admin-Token"] = state.token;
  }
  return fetch("/admin/api/" + encodeURIComponent(state.slug) + path, opts).then(function (r) {
    if (r.status === 401) { signedOut("Your session has ended. Please sign in again."); throw new Error("Signed out"); }
    if (r.status === 403) { throw new Error("You do not have permission to do that."); }
    // FastAPI errors are {"detail": "..."} — surface the sentence, not the
    // envelope. This showed up on the teller's verification bar, where a
    // refusal names exactly which check is missing and the teller reads it
    // mid-call with a customer waiting; wrapping that one useful sentence in
    // JSON punctuation is the worst place to make someone parse a payload.
    // Falls back to the raw body, so a non-JSON error (a proxy's HTML 502)
    // still says something rather than nothing.
    if (!r.ok) {
      return r.text().then(function (t) {
        var msg = t;
        try {
          var parsed = JSON.parse(t);
          if (parsed && typeof parsed.detail === "string") msg = parsed.detail;
        } catch (e) { /* not JSON — keep the body */ }
        throw new Error(msg || ("HTTP " + r.status));
      });
    }
    return r.status === 204 ? null : r.json();
  });
}

/* The tenant's own colour, on the sign-in screen as well as inside. Public
   endpoint, so it works before anyone has authenticated. */
function applyBrand(slug) {
  if (!slug) return Promise.resolve(null);
  return fetch("/banks/" + encodeURIComponent(slug) + "/public").then(function (r) {
    return r.ok ? r.json() : null;
  }).then(function (b) {
    if (!b) return null;
    if (b.primary_color) document.documentElement.style.setProperty("--brand", b.primary_color);
    var clean = (b.name || slug).replace(/[^A-Za-zሀ-፿ ]/g, "").trim();
    // "CBE" is already a mark — first-letter-of-each-word would show "C".
    var initials = /^[A-Z]{2,4}$/.test(clean) ? clean
      : clean.split(/\s+/).filter(Boolean).slice(0, 2)
          .map(function (w) { return w[0]; }).join("").toUpperCase();
    [$("gate-mark"), $("side-mark")].forEach(function (el) {
      if (b.logo_url) {
        // Rendered rather than described: a bank's mark is the first thing it
        // looks for, and initials on a coloured tile read as a placeholder.
        //
        // With a fallback, because this is a remote image on someone else's
        // host. If it 404s, moves, or is blocked, a broken-image icon in the
        // brand slot looks like the product is broken; the initials do not.
        // The widget already did this and the panel did not.
        el.innerHTML = "";
        el.classList.add("haslogo");
        var img = document.createElement("img");
        img.alt = b.name || slug;
        img.onerror = function () {
          el.classList.remove("haslogo");
          el.textContent = initials || "BA";
        };
        // Measured, not guessed. A bank sends either a compact mark or a full
        // lockup under the same field, and the two need different layouts —
        // but only the image itself knows which it is. Set on the container
        // so the CSS can also drop the wordmark beside a logo that already
        // contains one.
        img.onload = function () {
          if (!img.naturalHeight) return;
          var wide = img.naturalWidth / img.naturalHeight >= 2;
          var host = el.closest(".side-brand") || el;
          host.setAttribute("data-logo", wide ? "wide" : "mark");
        };
        img.src = b.logo_url;
        el.appendChild(img);
      } else {
        el.textContent = initials || "BA";
        el.classList.remove("haslogo");
      }
    });
    $("side-name").textContent = b.name || slug;
    // Long names ellipsize in a 236px rail — "Commercial Bank ..." — so the
    // full one stays reachable on hover rather than simply being lost.
    $("side-name").title = b.name || slug;
    $("gate-title").textContent = "Sign in";
    $("gate-sub").textContent = b.name ? b.name + " — assistant administration" : "Olink Bank Assist";
    return b;
  }).catch(function () { return null; });
}

/* ---------------------------------------------------------------- auth */
function gateError(msg) {
  var el = $("gate-err");
  if (!msg) { el.classList.add("hidden"); return; }
  el.textContent = msg; el.classList.remove("hidden");
}

function signInWithPassword() {
  var slug = $("slug").value.trim();
  var email = $("email").value.trim();
  var pw = $("password").value;
  if (!slug || !email || !pw) { gateError("Bank, email and password are all required."); return; }
  gateError("");
  $("signin-btn").disabled = true;
  fetch("/admin/api/" + encodeURIComponent(slug) + "/login", {
    method: "POST", credentials: "same-origin",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ email: email, password: pw })
  }).then(function (r) {
    if (r.status === 429) throw new Error("Too many attempts. Please wait a moment.");
    // One message for every cause, matching the server, which answers an
    // unknown email and a wrong password identically so the screen cannot be
    // used to find out who has an account here.
    if (!r.ok) throw new Error("That email and password did not match.");
    return r.json();
  }).then(function (me) {
    state.slug = slug; state.token = ""; state.me = me;
    localStorage.setItem("ba_slug", slug);
    $("password").value = "";
    enterApp();
  }).catch(function (e) { gateError(e.message); })
    .then(function () { $("signin-btn").disabled = false; });
}

function signInWithToken() {
  var slug = $("slug").value.trim();
  var token = $("token").value.trim();
  if (!slug || !token) { gateError("Bank and token are both required."); return; }
  gateError("");
  state.slug = slug; state.token = token; state.me = null;
  localStorage.setItem("ba_slug", slug);
  // Deliberately NOT stored. The previous panel kept the tenant's admin token
  // in localStorage, where any script on the page could read it and where it
  // outlived the tab. It now lives in memory for this tab only — which is also
  // the honest cost of a break-glass credential, and the reason to sign in
  // with a password instead.
  api("/analytics?days=1").then(function () {
    enterApp();
  }).catch(function () {
    state.token = "";
    gateError("That token was not accepted for this bank.");
  });
}

function signedOut(msg) {
  // Before anything else: stop beating. A heartbeat that outlives the session
  // would keep 401ing every thirty seconds forever, and on the expired-session
  // path it would re-enter signedOut() from a timer nobody can see.
  stopDuty();
  state.token = ""; state.me = null; state.page = null;
  $("shell").classList.add("hidden");
  $("gate").classList.remove("hidden");
  gateError(msg || "");
}

function signOut() {
  fetch("/admin/api/" + encodeURIComponent(state.slug) + "/logout",
    { method: "POST", credentials: "same-origin" })
    .catch(function () {})
    .then(function () { signedOut("You are signed out."); });
}

function can(perm) {
  // The break-glass token holds everything, exactly as the server treats it.
  if (!state.me) return true;
  return (state.me.permissions || []).indexOf(perm) > -1;
}

function enterApp() {
  $("gate").classList.add("hidden");
  $("shell").classList.remove("hidden");
  applyBrand(state.slug);

  if (state.me) {
    $("who-name").textContent = state.me.display_name || state.me.email;
    $("who-role").textContent = state.me.role || "";
    var src = state.me.display_name || state.me.email || "?";
    $("who-avatar").textContent = src.replace(/[^A-Za-z]/g, "").slice(0, 2).toUpperCase() || "?";
  } else {
    $("who-name").textContent = "Admin token";
    $("who-role").textContent = "break-glass access";
    $("who-avatar").textContent = "•";
  }
  renderNav();

  var landing = landingPage();
  if (!landing) { $("main").innerHTML = '<div class="empty">This account has no permissions yet. Ask an administrator.</div>'; return; }
  go(landing);
  refreshBadge();
  loadChannelNav();
  startDuty();
}

/* ------------------------------------------------------------------ on duty
 *
 * Whether a customer is offered a live banker used to depend on a teller
 * keeping the Live queue page open, because the heartbeat lived inside that
 * page's poll. Opening Reports took the bank off the air, and nothing said so.
 * That is a product-level switch hidden inside a browser tab.
 *
 * Presence is now a declaration with a heartbeat behind it, running from the
 * shell on every page. Two states, both explicit:
 *
 *   ON  — heartbeat every HEARTBEAT_MS; customers see the Connect button.
 *   OFF — cleared server-side immediately; the button goes away.
 *
 * The choice is remembered per browser so a reload does not silently put
 * somebody back on the air, and it is confirmed against the server on sign-in
 * so a second device shows the truth rather than its own default.
 */
var DUTY_KEY = "ba_on_duty";
var HEARTBEAT_MS = 30000;   // corrected from the server's own heartbeat_seconds
var dutyTimer = null;
var dutyOn = false;

function dutyStored() {
  // Default ON for anyone who can serve. Signing in to the console IS turning
  // up for work, and the alternative default has a failure mode we have
  // already lived through: everybody appears offline, no button appears
  // anywhere, and nothing on screen explains why. Off is one click away and
  // is remembered.
  try {
    return localStorage.getItem(DUTY_KEY) !== "0";
  } catch (e) {
    return true;   // private mode, or storage denied. Being on is the useful one.
  }
}

function beat() {
  // Fire-and-forget. A dropped beat costs at most a slice of the staleness
  // window, and surfacing a red banner for one failed background request
  // would train people to ignore banners.
  api("/teller/presence", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ on_duty: dutyOn })
  })
    .then(function (r) {
      if (r && r.heartbeat_seconds) {
        // The server owns the interval; it is the half that has to match the
        // staleness window. If they ever disagree, the server wins.
        var ms = r.heartbeat_seconds * 1000;
        if (ms !== HEARTBEAT_MS) { HEARTBEAT_MS = ms; scheduleBeat(); }
      }
    })
    .catch(function () {});
}

function scheduleBeat() {
  if (dutyTimer) { clearInterval(dutyTimer); dutyTimer = null; }
  if (dutyOn) dutyTimer = setInterval(beat, HEARTBEAT_MS);
}

function paintDuty() {
  var b = $("duty");
  b.setAttribute("aria-pressed", dutyOn ? "true" : "false");
  $("duty-text").textContent = dutyOn ? A("on_duty") : A("off_duty");
  b.title = dutyOn
    ? A("customers_can_reach_teller")
    : A("customers_reach_colleague");
}

function setDuty(on) {
  dutyOn = on;
  try { localStorage.setItem(DUTY_KEY, on ? "1" : "0"); } catch (e) {}
  paintDuty();
  beat();          // immediately, in both directions — going off duty must
  scheduleBeat();  // take effect now, not at the next tick.
  // The Live queue strip states whether customers can reach anyone, which has
  // just changed. Repaint it rather than leave a stale sentence up.
  if (state.page === "teller") loadTellerQueue();
}

function startDuty() {
  if (!can("teller.serve")) return;   // stays hidden for everyone else
  var b = $("duty");
  b.hidden = false;
  b.onclick = function () { setDuty(!dutyOn); };
  dutyOn = dutyStored();
  paintDuty();
  beat();
  scheduleBeat();
}

function stopDuty() {
  if (dutyTimer) { clearInterval(dutyTimer); dutyTimer = null; }
  dutyOn = false;
  $("duty").hidden = true;
}

/* Where this person starts.
 *
 * Keyed on the job, not on nav order. Both built-in roles can read analytics,
 * so "first page they are allowed to open" put an operator on a wall of
 * numbers they cannot act on while eight escalations waited one click away —
 * which is what this did until it was watched rather than reasoned about.
 *
 * Someone who can change what the assistant says, wire up an integration or
 * add a colleague is running the thing, and lands on the overview. Everyone
 * else who works the queue lands in the queue. A narrowed custom role that
 * matches neither still falls through to whatever it can actually open, so
 * nobody arrives at a blank screen.
 */
var MANAGEMENT = ["documents.write", "integrations.manage", "users.manage"];

function landingPage() {
  var manages = MANAGEMENT.some(can);
  var order = manages
    ? ["dashboard", "handoffs"]
    : ["handoffs", "dashboard"];
  var allowed = PAGES.filter(function (p) { return can(p.perm); });
  for (var i = 0; i < order.length; i++) {
    var hit = allowed.filter(function (p) { return p.id === order[i]; })[0];
    if (hit) return hit.id;
  }
  return allowed.length ? allowed[0].id : null;
}

// Wired once at load. The node lives in the page shell and outlives any
// sign-in, so binding it per session would stack handlers.
loadAdminStrings().then(function () {
  renderNav();
  paintAdminChrome();
});

(function wireAdminLanguage() {
  var sel = document.getElementById("adminLang");
  if (!sel) return;
  sel.value = adminLang;
  sel.addEventListener("change", function () { setAdminLanguage(sel.value); });
})();

// Everything in the shell that is not a page's own content. Re-run whenever
// the language changes, so the chrome follows the picker rather than only
// what loads next.
function paintAdminChrome() {
  var m = {
    lblConversation: "conversation", lblApproved: "approved_answers",
    "queue-lbl": "queue", "signout-label": "sign_out"
  };
  Object.keys(m).forEach(function (id) {
    var n = document.getElementById(id);
    if (n) n.textContent = A(m[id]);
  });
  var t = {
    cMic: "mute", cCam: "camera", cHang: "end_session", adminLang: "search",
    "queue-btn": "open_escalation_queue", "theme-toggle": "switch_dark_light"
  };
  Object.keys(t).forEach(function (id) {
    var n = document.getElementById(id);
    if (n && id !== "adminLang") n.title = A(t[id]);
  });
  // A hover title a screen reader never speaks is half the job. Both of these
  // carry an aria-label as well, and it has to follow the language with it.
  ["queue-btn", "theme-toggle"].forEach(function (id) {
    var n = document.getElementById(id);
    if (n && n.getAttribute("aria-label")) n.setAttribute("aria-label", A(t[id]));
  });
  var room = document.getElementById("callroom");
  if (room) room.setAttribute("aria-label", A("live_session"));
  var send = document.getElementById("callSend");
  if (send) send.textContent = A("send");
  // The rail toggle says what it will DO, so its label flips with the state
  // as well as with the language.
  var rail = document.getElementById("rail-label");
  if (rail) {
    rail.textContent = A(
      document.documentElement.getAttribute("data-rail") === "mini" ? "expand" : "collapse");
  }
  var railBtn = document.getElementById("rail-toggle");
  if (railBtn) railBtn.title = A("collapse_or_expand");
  var say = document.getElementById("callSay");
  if (say) say.placeholder = A("message_customer");
  var ans = document.getElementById("ansQ");
  if (ans) ans.placeholder = A("search_approved_answers");
  var freeze = document.getElementById("callFreeze");
  if (freeze) {
    var span = freeze.querySelector("span") || freeze;
    if (span !== freeze) span.textContent = A("freeze_frame");
  }
  paintDuty();
}

function renderNav() {
  $("nav").innerHTML = PAGES.filter(function (p) { return can(p.perm); }).map(function (p) {
    var item = '<button class="navitem" id="nav-' + p.id + '" data-page="' + p.id + '">' +
      icon(p.id) + '<span class="label">' + esc(A(p.key, p.label)) + "</span>" +
      (p.badge ? '<span class="badge hidden" id="badge-' + p.id + '"></span>' : "") +
      "</button>";
    // Only Channels nests today, and only once its catalogue has arrived —
    // rendering an empty drawer before the fetch resolves would flash a
    // disclosure arrow that opens onto nothing.
    if (!p.kids || !state.channels.length) return item;
    return '<div class="navrow">' + item +
      '<button class="disclose" id="disclose-' + p.id + '" aria-expanded="' +
      (state.railOpen ? "true" : "false") + '" aria-controls="sub-' + p.id +
      '" aria-label="' + esc(A("show_hide_channels")) + '">' + icon("chevron", 14) + "</button></div>" +
      '<div class="subnav" id="sub-' + p.id + '"' + (state.railOpen ? "" : " hidden") + ">" +
      state.channels.map(function (c) {
        return '<button class="subitem' + (c.status === "live" ? "" : " idle") +
          '" data-channel="' + esc(c.key) + '">' +
          '<span class="dot" style="background:' +
          seriesColor(CHANNEL_SLOT[c.key]) + '"></span>' +
          '<span class="label">' + esc(c.name) + "</span></button>";
      }).join("") + "</div>";
  }).join("");

  Array.prototype.forEach.call($("nav").querySelectorAll(".navitem"), function (b) {
    b.onclick = function () {
      // The parent opens the overview, never a channel left selected from last
      // time — clicking "Channels" and landing on Viber would be a surprise.
      if (b.getAttribute("data-page") === "channels") state.channel = null;
      go(b.getAttribute("data-page"));
    };
  });
  Array.prototype.forEach.call($("nav").querySelectorAll(".subitem"), function (b) {
    b.onclick = function () {
      state.channel = b.getAttribute("data-channel");
      go("channels");
    };
  });
  var d = $("disclose-channels");
  if (d) d.onclick = function () {
    state.railOpen = !state.railOpen;
    localStorage.setItem("ba_chan_open", state.railOpen ? "1" : "0");
    d.setAttribute("aria-expanded", state.railOpen ? "true" : "false");
    $("sub-channels").hidden = !state.railOpen;
  };
  markNav();
}

/* Which rail entries read as current. Split out of go() because the sub-nav is
   re-rendered whenever the catalogue changes, and the highlight has to survive
   that without a second navigation. */
function markNav() {
  Array.prototype.forEach.call($("nav").querySelectorAll(".navitem"), function (b) {
    b.classList.toggle("on", b.getAttribute("data-page") === state.page);
  });
  Array.prototype.forEach.call($("nav").querySelectorAll(".subitem"), function (b) {
    b.classList.toggle("on",
      state.page === "channels" && b.getAttribute("data-channel") === state.channel);
  });
}

/* The catalogue, fetched once at sign-in so the rail can list channels.
   Failure is silent on purpose: the rail simply does not nest, and every
   channel is still reachable from the Channels page itself. */
function loadChannelNav() {
  if (!can("integrations.manage")) return;
  api("/integrations").then(function (cfg) {
    state.channels = cfg.channels || [];
    renderNav();
  }).catch(function () {});
}

function go(id) {
  var page = PAGES.filter(function (p) { return p.id === id; })[0];
  if (!page || !can(page.perm)) return;
  state.page = id;
  markNav();
  var chan = state.page === "channels" && state.channel
    ? channelByKey(state.channel) : null;
  // A(), not page.label — the sidebar entry was translated and the heading
  // beside it was not, so an Amharic panel read "ዳሽቦርድ" in the rail and
  // "Dashboard" in the topbar. A channel keeps its own name: that is the
  // bank's word for it, not ours to translate.
  $("page-title").textContent = chan ? chan.name : A(page.key, page.label);
  $("main").innerHTML = '<div class="empty">' + esc(A("loading")) + "</div>";
  setStatus("");
  state.loadedAt = Date.now();
  renderStamp();
  page.load();
}

function channelByKey(key) {
  return state.channels.filter(function (c) { return c.key === key; })[0] || null;
}

/* How old the numbers on screen are.
 *
 * Rounded to the minute and only shown once a minute has passed: a counter
 * ticking "3s ago … 4s ago" is motion with no information in it, and it draws
 * the eye away from the figures it is describing. */
function renderStamp() {
  var el = $("stamp");
  if (!el) return;
  if (!state.loadedAt) { el.textContent = ""; return; }
  var mins = Math.floor((Date.now() - state.loadedAt) / 60000);
  el.textContent = mins < 1 ? A("up_to_date")
    : (mins < 60 ? A("updated_m_ago", null, { n: mins })
                 : A("updated_h_ago", null, { n: Math.floor(mins / 60) }));
}

/* The queue count on the rail, so waiting work is visible from any page. */
function refreshBadge() {
  if (!can("handoffs.read")) return;
  api("/handoffs?status=open").then(function (rows) {
    state.openHandoffs = rows.length;
    var el = $("badge-handoffs");
    if (el) {
      el.textContent = rows.length;
      el.classList.toggle("hidden", rows.length === 0);
    }
    // The same number in the topbar, which survives the rail being collapsed
    // and is on screen while an operator is working inside a conversation.
    var q = $("queue-btn");
    if (!q) return;
    q.classList.remove("hidden");
    q.classList.toggle("hot", rows.length > 0);
    $("queue-count").textContent = rows.length;
    q.setAttribute("aria-label",
      rows.length ? rows.length + " escalations waiting — open the queue"
                  : "Escalation queue — nothing waiting");
  }).catch(function () {});
}

/* ------------------------------------------------------------ dashboard */
/* The set the SERVER computes every rate over (agent.SUBSTANTIVE). Charted
   against a different set, the bars would be drawn over a denominator that
   does not contain them — percentages wrong rather than merely incomplete.
   Used by both the chart and the CSV export, so there is one copy to drift. */
var SUBSTANTIVE = ["account_blocked", "answered", "comparison", "complaint",
                   "general_guidance", "human_request", "unanswered"];

function pct(x) { return x == null ? "—" : Math.round(x * 1000) / 10 + "%"; }
function num(n) { return (n == null ? 0 : n).toLocaleString(); }

/* now vs then, stated in the words of the comparison rather than as a bare
   arrow. Returns "" when there is no previous window, which is the honest
   answer for an all-time view or a tenant's first month. */
function delta(now, then, asRate) {
  if (then == null || now == null) return "";
  if (asRate) {
    var pts = Math.round((now - then) * 1000) / 10;
    if (Math.abs(pts) < 0.1) return '<span class="delta flat">no change on previous period</span>';
    return '<span class="delta ' + (pts > 0 ? "up" : "down") + '">' +
      (pts > 0 ? "▲ " : "▼ ") + Math.abs(pts) + " pts vs previous period</span>";
  }
  if (!then) return "";
  var chg = Math.round(((now - then) / then) * 1000) / 10;
  if (Math.abs(chg) < 0.1) return '<span class="delta flat">no change on previous period</span>';
  return '<span class="delta ' + (chg > 0 ? "up" : "down") + '">' +
    (chg > 0 ? "▲ " : "▼ ") + Math.abs(chg) + "% vs previous period</span>";
}

function kpi(label, value, sub, isNone, iconName, deltaHtml, drill) {
  return '<div class="kpi' + (drill ? " drill" : "") + '"' +
    (drill ? ' data-drill="' + drill + '" role="button" tabindex="0"' : "") + ">" +
    '<div class="txt"><div class="k">' + esc(label) + "</div>" +
    '<div class="v' + (isNone ? " none" : "") + '">' + value + "</div>" +
    (sub ? '<div class="sub">' + esc(sub) + "</div>" : "") +
    (deltaHtml || "") + "</div>" +
    '<div class="ico" aria-hidden="true">' + icon(iconName || "dashboard", 17) + "</div>" +
    "</div>";
}

function bars(rows, total, labeller) {
  if (!rows.length) return '<div class="empty">Nothing yet.</div>';
  // Wrapped so the group can centre itself in a card the row has stretched.
  // Left flush to the top, a short list in a tall card reads as an unfinished
  // panel rather than a deliberate one.
  return '<div class="barwrap">' + rows.map(function (r) {
    var pair = labeller(r);
    var share = total ? r.count / total : 0;
    // pair[2] is a destination. Rows with nothing behind them — a language
    // nobody has used — stay inert rather than opening an empty list.
    var drill = pair[2] && r.count ? pair[2] : null;
    return '<div class="bar' + (drill ? " drill" : "") + '"' +
      (drill ? ' data-drill="' + drill + '" role="button" tabindex="0"' : "") + ">" +
      "<span>" + esc(pair[0]) + "</span>" +
      '<span class="track"><span class="fill' + (pair[1] ? " " + pair[1] : "") +
      '" style="width:' + (share * 100).toFixed(1) + '%"></span></span>' +
      '<span class="n">' + r.count + "</span></div>";
  }).join("") + "</div>";
}

/* --------------------------------------------------- series colour by entity
 *
 * A slot per language and per channel, fixed in code. Two reasons it is a map
 * and not `palette[index]`:
 *
 * 1. Colour must follow the ENTITY, not its rank. Sorted-by-volume indexing
 *    means Amharic is blue today and orange on the day English overtakes it,
 *    and a reader who has learned the chart is then quietly misled by it.
 * 2. The same colour then means the same thing in the donut, the share bar and
 *    the channel list, because all three ask this one function.
 *
 * Slots run 1..8 in the documented order; the maps are deliberately small
 * enough to read. Anything unmapped falls back to neutral rather than picking
 * a colour at random — an unknown series is better grey than miscoloured.
 */
var LANG_SLOT = { en: 1, am: 2, om: 3, ti: 4, so: 5 };
var CHANNEL_SLOT = {
  web: 1, telegram: 2, whatsapp: 3, messenger: 4,
  instagram: 5, viber: 6, sms: 7
};
function seriesColor(slot) {
  return slot ? "var(--series-" + slot + ")" : "var(--faint)";
}

/* A donut of shares.
 *
 * Draws ONLY when at least two categories carry traffic. Below that a ring is
 * a picture of nothing — a full circle labelled 100% takes a card's worth of
 * space to say what one sentence says better — so one category degrades to
 * that sentence and none degrades to an empty state. The coverage list still
 * renders underneath in every case, because "Tigrinya: 0" is a fact worth
 * showing: it is the difference between unused and unsupported.
 *
 * `rows` are {label, count, slot, drill}. Order controls slice order; `slot`
 * controls colour, so the two can never drift.
 */
function donut(rows, opts) {
  opts = opts || {};
  var total = rows.reduce(function (t, r) { return t + r.count; }, 0);
  var live = rows.filter(function (r) { return r.count; });

  // Two ways a slice can be clickable, kept independent on purpose. `drill`
  // navigates to another page (Languages, Channels); `topicIdx` — added for
  // Most Asked — expands a detail panel in place instead, because leaving
  // the page just to read one question back defeats the point of putting it
  // on the dashboard at all. Callers only ever set one or the other, so
  // there's nothing to arbitrate between them.
  function clickAttr(row) {
    if (row.drill) return ' data-drill="' + row.drill + '"';
    if (row.topicIdx != null) return ' data-topic-idx="' + row.topicIdx + '"';
    return "";
  }
  function isClickable(row) { return !!(row.drill || row.topicIdx != null); }

  function coverage() {
    return '<div class="legend">' + rows.map(function (row) {
      var clickable = isClickable(row);
      return "<" + (clickable ? "button" : "div") + ' class="row' +
        (clickable ? " clickable" : "") + (row.count ? "" : " zero") + '"' +
        clickAttr(row) + (clickable ? ' type="button"' : "") + ">" +
        '<span class="sw" style="background:' +
        (row.count ? seriesColor(row.slot) : "var(--line)") +
        '"></span><span class="lbl">' + esc(row.label) + "</span>" +
        '<span class="val">' + row.count +
        (total ? " · " + Math.round((row.count / total) * 100) + "%" : "") + "</span>" +
        "</" + (clickable ? "button" : "div") + ">";
    }).join("") + "</div>";
  }

  if (!total) {
    return '<div class="empty">' + esc(opts.empty || "Nothing recorded yet in this window.") +
      "</div>" + coverage();
  }
  if (live.length === 1) {
    /* The stat-tile case: one value, stated. Not a one-slice pie.
     *
     * ONE template rather than "All " + n + unit + verb + label. A sentence
     * built from fragments only reads correctly in a language that puts them
     * in the English order, and three of the five here do not — Amharic,
     * Tigrinya and Somali all place the verb differently. Escaping the
     * template first is safe because esc() leaves braces alone, so the
     * placeholders survive and the two values can be bolded wherever the
     * translator chose to put them. */
    var one = total === 1;
    var line = esc((one && opts.onelineOne) || opts.oneline ||
                   "All {n} {unit} were in {label}.")
      .split("{n}").join("<b>" + num(total) + "</b>")
      .split("{unit}").join(esc((one && opts.unitOne) || opts.unit || "conversations"))
      .split("{label}").join("<b>" + esc(live[0].label) + "</b>");
    return '<div class="oneline">' + line + "</div>" + coverage();
  }

  var size = 132, r = 52, cx = size / 2, cy = size / 2, thick = 20;
  // Two slices in adjacent hues that physically touch read as one shape with a
  // seam. A hairline of surface between them is what makes a boundary a
  // boundary, and it is doing accessibility work as well as cosmetic: the
  // closest pair in this palette is the pair most likely to end up adjacent.
  var GAP = 0.045;                        // radians — about 2px at this radius
  var angle = -Math.PI / 2;
  var arcs = rows.map(function (row) {
    if (!row.count) return "";
    var sweep = (row.count / total) * Math.PI * 2;
    var from = angle, to = angle + sweep;
    angle = to;
    // A sliver narrower than the gap would be eaten by it. Better a slightly
    // tight slice than a 1% slice that disappears altogether.
    if (sweep > GAP * 2.5) { from += GAP / 2; to -= GAP / 2; }
    var x1 = cx + r * Math.cos(from), y1 = cy + r * Math.sin(from);
    var x2 = cx + r * Math.cos(to), y2 = cy + r * Math.sin(to);
    return '<path d="M' + x1.toFixed(2) + " " + y1.toFixed(2) +
      " A" + r + " " + r + " 0 " + (to - from > Math.PI ? 1 : 0) + " 1 " +
      x2.toFixed(2) + " " + y2.toFixed(2) + '" fill="none" stroke="' +
      seriesColor(row.slot) +
      '" stroke-width="' + thick + '" stroke-linecap="butt"' +
      (isClickable(row) ? ' class="clickable"' + clickAttr(row) : "") +
      "><title>" + esc(row.label + ": " + row.count) + "</title></path>";
  }).join("");

  return '<div class="donutwrap"><svg class="donut" width="' + size + '" height="' + size +
    '" viewBox="0 0 ' + size + " " + size + '" role="img" aria-label="' +
    esc(opts.label || "breakdown") + '">' + arcs +
    '<text class="hole" x="' + cx + '" y="' + (cy + 2) + '" text-anchor="middle">' +
    num(total) + "</text>" +
    '<text class="holesub" x="' + cx + '" y="' + (cy + 15) + '" text-anchor="middle">' +
    esc((opts.unit || "TOTAL").toUpperCase()) + "</text></svg>" +
    coverage() + "</div>";
}

/* Most Asked, as a donut instead of a list that grows with every new
 * distinct question. `top_topics` arrives sorted already (server caps it at
 * MAX_TOP_TOPICS = 15) — this only decides how many get their own wedge.
 * Six is the ceiling: past that a slice reads as a sliver, not a fact.
 * Everything past six folds into one "N other questions" wedge rather than
 * being dropped, because a bank asking "did we miss anything" deserves an
 * honest count, not a top-6 list that quietly discards the tail.
 *
 * Returns {rows, detail} — `rows` go straight into donut(); `detail` is
 * stashed on state and read back by index when a wedge or legend row is
 * clicked, since donut() only knows how to draw a slice, not what a slice
 * means.
 */
var TOPIC_DONUT_MAX = 6;
function topicDonutData(topics) {
  var head = topics.slice(0, TOPIC_DONUT_MAX);
  var rest = topics.slice(TOPIC_DONUT_MAX);
  var detail = head.map(function (t) {
    return { example: t.example, count: t.count, outcomes: t.outcomes || {} };
  });
  var rows = head.map(function (t, i) {
    return { label: t.example, count: t.count, slot: (i % 8) + 1, topicIdx: i };
  });
  if (rest.length) {
    var restCount = rest.reduce(function (s, t) { return s + t.count; }, 0);
    rows.push({
      label: A("n_other_questions", null, { n: rest.length }),
      count: restCount, slot: (head.length % 8) + 1, topicIdx: head.length
    });
    detail.push({ isOther: true, items: rest });
  }
  return { rows: rows, detail: detail };
}

/* The detail card for one wedge — the question, what happened to it, and
 * (only when it actually has a miss and the viewer can act on it) a way to
 * follow up, so the panel that started with "what are people asking" ends
 * with "here is exactly what to do about it" instead of a dead end. */
function topicDetailCard(item) {
  if (item.isOther) {
    return '<div class="topicdetail">' +
      '<h3>' + esc(A("n_other_questions", null, { n: item.items.length })) + "</h3>" +
      item.items.map(function (t) {
        return '<div class="topic"><span class="n">' + t.count + "</span><span>" +
          esc(t.example) + "</span></div>";
      }).join("") + "</div>";
  }
  var outcomes = item.outcomes || {};
  var rows = Object.keys(outcomes).map(function (outcome) {
    var cls = outcome === "unanswered" ? "bad"
      : (["human_request", "complaint", "account_blocked"].indexOf(outcome) > -1 ? "warn" : "");
    return '<div class="topic' + (cls ? " " + cls : "") + '"><span class="n">' +
      outcomes[outcome] + "</span><span>" +
      esc(A("outcome_" + outcome, OUTCOME_LABEL[outcome] || outcome)) + "</span></div>";
  }).join("");
  var canFollowUp = outcomes.unanswered && can("gaps.read");
  return '<div class="topicdetail">' +
    '<h3>' + esc(A("what_happened_when_asked")) + "</h3>" +
    '<div class="qtext">“' + esc(item.example) + '”</div>' +
    rows +
    (canFollowUp
      ? '<button class="btn ghost sm" data-drill="gaps">' + esc(A("view_in_content_gaps")) + "</button>"
      : "") + "</div>";
}

/* The click side of donut()'s topicIdx hook, scoped to one panel at a time
 * (`containerId`) so two donuts on the same page — Most Asked, Languages —
 * each expand their own detail card without reading each other's data or
 * fighting over a shared "which row is open" flag. `getDetail()` returns the
 * array to index into; `render` turns one entry into the card's HTML. */
function wireDetailPanel(containerId, boxId, getDetail, render) {
  var container = $(containerId);
  if (!container) return;
  var openIdx = null;
  Array.prototype.forEach.call(container.querySelectorAll("[data-topic-idx]"), function (el) {
    function toggle() {
      var idx = parseInt(el.getAttribute("data-topic-idx"), 10);
      var box = $(boxId);
      if (!box) return;
      if (openIdx === idx) { box.innerHTML = ""; openIdx = null; return; }
      box.innerHTML = render(getDetail()[idx]);
      openIdx = idx;
      wireDrills();
      box.scrollIntoView({ block: "nearest", behavior: "smooth" });
    }
    el.onclick = toggle;
    el.onkeydown = function (e) {
      if (e.key === "Enter" || e.key === " ") { e.preventDefault(); toggle(); }
    };
  });
}

/* The Languages panel's detail card — what happened when someone asked in
 * this language, plus a "View Conversations" button (the same drill the
 * panel used to fire directly on click, now a secondary action inside the
 * card instead of the click's only behaviour). No question text here, unlike
 * topicDetailCard: a language isn't one question, so there's nothing to
 * quote. */
function languageDetailCard(item) {
  var outcomes = item.outcomes || {};
  var keys = Object.keys(outcomes);
  var rows = keys.map(function (outcome) {
    var cls = outcome === "unanswered" ? "bad"
      : (["human_request", "complaint", "account_blocked"].indexOf(outcome) > -1 ? "warn" : "");
    return '<div class="topic' + (cls ? " " + cls : "") + '"><span class="n">' +
      outcomes[outcome] + "</span><span>" +
      esc(A("outcome_" + outcome, OUTCOME_LABEL[outcome] || outcome)) + "</span></div>";
  }).join("");
  var canView = item.count && can("conversations.read");
  return '<div class="topicdetail">' +
    '<h3>' + esc(item.name) + "</h3>" +
    (keys.length ? rows : '<div class="note">' + esc(A("nothing_asked_yet")) + "</div>") +
    (canView
      ? '<button class="btn ghost sm" data-drill="convos:language=' + item.language + '">' +
        esc(A("view_conversations")) + "</button>"
      : "") + "</div>";
}

/* The channel panel: the catalogue, with traffic folded in.
 *
 * Deliberately not a donut. A share chart can only describe channels that
 * already have customers on them, and the fact a bank is buying on is the one
 * such a chart structurally cannot express — that WhatsApp is a business
 * decision away, not a missing feature. So every channel is a row: the live
 * ones carry their volume and open the conversations behind it, and the rest
 * carry what it would take to switch them on.
 *
 * The share bar above only appears at two or more live channels, for the same
 * reason the donut does.
 */
var CHANNEL_PILL = {
  // Live but quiet is not the same as never switched on, and "planned" is not
  // a promise — it is "the adapter is small, the account paperwork is not".
  live: ["on", "channel_live", "Live"],
  available: ["next", "channel_ready", "Ready to connect"],
  planned: ["", "channel_needs_setup", "Needs setup"]
};
function channelPanel(rows, opts) {
  opts = opts || {};
  var total = rows.reduce(function (t, r) { return t + r.count; }, 0);
  var live = rows.filter(function (r) { return r.count; });

  var head = "";
  if (!total) {
    head = '<div class="empty">' + esc(A("no_conversations_window")) + "</div>";
  } else if (live.length === 1) {
    // One template rather than four fragments — see donut() for why.
    head = '<div class="oneline">' +
      esc(total === 1
        ? A("channel_all_from_one", "The single conversation came from {label}.")
        : A("channel_all_from", "All {n} conversations came from {label}."))
        .split("{n}").join("<b>" + num(total) + "</b>")
        .split("{label}").join("<b>" + esc(live[0].name) + "</b>") +
      "</div>";
  } else {
    head = '<div class="sharebar" role="img" aria-label="' + esc(A("share_by_channel")) + '">' +
      live.map(function (row) {
        return '<span style="flex:' + row.count + ";background:" +
          seriesColor(CHANNEL_SLOT[row.channel]) + '" title="' +
          esc(row.name + ": " + row.count) + '"></span>';
      }).join("") + "</div>";
  }

  return head + '<div class="chanlist">' + rows.map(function (row) {
    var pill = CHANNEL_PILL[row.status] || ["", null, row.status];
    // A channel with traffic opens that traffic; one without opens the page
    // where it gets switched on. "Needs setup" as a label with nowhere to go
    // is the reader being told about a job and not shown where to do it.
    var drill = row.count
      ? (opts.canRead ? "convos:channel=" + row.channel : null)
      : (opts.canSetup ? "settings" : null);
    var tag = drill ? "button" : "div";
    return "<" + tag + ' class="chan' + (row.count ? "" : " idle") +
      (drill ? " clickable" : "") + '"' +
      (drill ? ' data-drill="' + drill + '" type="button"' : "") + ">" +
      '<span class="dot" style="background:' +
      seriesColor(CHANNEL_SLOT[row.channel]) + '"></span>' +
      '<span class="cname">' + esc(row.name) + "</span>" +
      (row.count
        ? '<span class="n">' + num(row.count) + "</span>"
        : '<span class="pill' + (pill[0] ? " " + pill[0] : "") + '">' +
          esc(A(pill[1], pill[2])) + "</span>") +
      "</" + tag + ">";
  }).join("") + "</div>";
}

/* A real series from the analytics endpoint, with empty days present as zero.
   Drawn as inline SVG: no chart library, no CDN, and it prints. */
function sparkArea(daily) {
  if (!daily || daily.length < 2) return '<div class="empty">Not enough days yet to draw a trend.</div>';
  var w = 640, h = 224, padL = 34, padB = 22, padT = 10;
  var max = Math.max.apply(null, daily.map(function (d) { return d.conversations; }));
  var top = Math.max(max, 1);
  var iw = w - padL - 8, ih = h - padB - padT;
  var pts = daily.map(function (d, i) {
    var x = padL + (daily.length === 1 ? iw / 2 : (i / (daily.length - 1)) * iw);
    var y = padT + ih - (d.conversations / top) * ih;
    return [x, y];
  });
  var line = pts.map(function (p, i) { return (i ? "L" : "M") + p[0].toFixed(1) + " " + p[1].toFixed(1); }).join(" ");
  var area = line + " L" + pts[pts.length - 1][0].toFixed(1) + " " + (padT + ih) +
             " L" + pts[0][0].toFixed(1) + " " + (padT + ih) + " Z";
  var ticks = [0, 0.5, 1].map(function (f) {
    var y = padT + ih - f * ih;
    return '<line class="gl" x1="' + padL + '" y1="' + y.toFixed(1) + '" x2="' + (w - 8) + '" y2="' + y.toFixed(1) + '"/>' +
      '<text x="' + (padL - 6) + '" y="' + (y + 3).toFixed(1) + '" text-anchor="end">' + Math.round(f * top) + "</text>";
  }).join("");
  function dayLabel(iso) { return iso.slice(5).replace("-", "/"); }
  // The first and last labels are anchored to the ends of the plot, not
  // centred on their points. Centred, half of each sits outside the viewBox
  // and is clipped — the final label rendered as "08/0", which reads as a
  // date rather than as a truncation, so it is the kind of wrong that gets
  // believed. Only visible by looking at it; no assertion would have caught it.
  var idx = [0, Math.floor(daily.length / 2), daily.length - 1]
    .filter(function (v, i, a) { return a.indexOf(v) === i; });
  var labels = idx.map(function (i) {
    var anchor = i === 0 ? "start" : (i === daily.length - 1 ? "end" : "middle");
    return '<text x="' + pts[i][0].toFixed(1) + '" y="' + (h - 6) + '" text-anchor="' + anchor + '">' +
      dayLabel(daily[i].date) + "</text>";
  }).join("");
  // No preserveAspectRatio="none". Stretching the viewBox to fill the panel
  // also stretches the glyphs and the stroke, which looks like a rendering
  // fault rather than a design. Scaling uniformly costs a few pixels of side
  // margin at unusual widths and keeps the type honest.
  return '<div class="chartwrap"><svg class="chart" viewBox="0 0 ' + w + " " + h +
    '" role="img" aria-label="Conversations per day">' +
    '<defs><linearGradient id="brandfade" x1="0" x2="0" y1="0" y2="1">' +
    '<stop offset="0%" stop-color="var(--brand)" stop-opacity="0.22"/>' +
    '<stop offset="100%" stop-color="var(--brand)" stop-opacity="0"/></linearGradient></defs>' +
    ticks + '<path class="area" d="' + area + '"/><path class="line" d="' + line + '"/>' +
    labels + "</svg></div>";
}

/* How each outcome is written for a bank. Every key here is emitted by the
   agent and every outcome the agent emits appears here — tests/test_admin_labels.py
   fails on either gap, because an unlabelled outcome renders to a bank as its
   raw internal key. */
function greeting() {
  var h = new Date().getHours();
  return h < 12 ? A("good_morning") : (h < 17 ? A("good_afternoon") : A("good_evening"));
}

/* Hover readout on the trend line. The chart is drawn in viewBox units and
   scaled by CSS, so the pointer's page position has to be mapped back through
   the rendered box rather than assumed to match — otherwise the tooltip
   tracks correctly only at one window width. */
function wireChartTip(daily) {
  var svg = document.querySelector(".chart");
  if (!svg || !daily || daily.length < 2) return;
  var wrap = svg.parentNode;   // the .chartwrap the chart renders inside
  var tip = document.createElement("div");
  tip.className = "tip";
  wrap.style.position = "relative";
  wrap.appendChild(tip);

  svg.addEventListener("mousemove", function (ev) {
    var box = svg.getBoundingClientRect();
    var frac = (ev.clientX - box.left) / box.width;
    var i = Math.round(frac * (daily.length - 1));
    if (i < 0) i = 0;
    if (i > daily.length - 1) i = daily.length - 1;
    var d = daily[i];
    tip.innerHTML = '<div class="d">' + esc(new Date(d.date + "T00:00:00").toDateString()) +
      "</div><strong>" + esc(A(d.conversations === 1 ? "one_conversation" : "n_conversations",
        null, { n: d.conversations })) + "</strong>";
    tip.style.left = ((i / (daily.length - 1)) * box.width) + "px";
    tip.style.top = (box.height * 0.5) + "px";
    tip.classList.add("on");
  });
  svg.addEventListener("mouseleave", function () { tip.classList.remove("on"); });
}
