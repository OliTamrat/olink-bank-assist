<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bank Assist — Admin</title>
<style>
/* ---------------------------------------------------------------- tokens
   The brand hue is the tenant's own primary_color, injected at runtime from
   /banks/{slug}/public, exactly as the widget does it. Every accent below is
   derived from --brand with color-mix, so CBE opens a green panel and Awash an
   orange one without a second stylesheet. Hard-coding a house violet here — as
   every dashboard this was modelled on does — would have made the panel look
   like our product installed at their bank rather than like their product. */
:root {
  /* Dark by default. The panel is looked at all day by someone working a
     queue, and this is the palette the rest of the Olink products use.
     Light is a real alternative rather than an afterthought — some banks
     will print from the screen and some offices are very bright — so every
     colour below is a token and the light theme only redefines these. */
  --brand: #0f766e;
  --bg: #0a0c12;
  --surface: #12141d;
  --surface-2: #171a25;
  --side: #06070d;
  --side-2: #171a25;
  --line: #2c3242;
  --ink: #f3f5f9;
  --body: #dee4f0;
  --muted: #a6b0c4;
  --faint: #8590a6;
  --side-text: #aab4c8;
  --ok: #4ade80;
  --warn: #fbbf24;
  --bad: #f87171;
  --ok-bg: #10281a;
  --warn-bg: #2b2110;
  --bad-bg: #2c1618;
  --shadow: 0 1px 3px rgba(0, 0, 0, .55);
  --radius: 14px;

  /* --- series palette -------------------------------------------------
     Chart colour is an ENCODING, not decoration, and that is why these are
     not derived from --brand like everything else on this page.

     The first version of the donut shaded every slice from the tenant's own
     hue toward the surface, on the reasoning that a white-label product
     should not paint a bank's dashboard in colours that are not theirs.
     That reasoning was wrong, and the live CBE panel showed why: a one-hue
     ramp encodes MAGNITUDE, and language and channel encode IDENTITY. The
     result was a ring of near-identical purples that no reader could take a
     share off, with the small slices mixed so far toward a near-black
     surface that they were effectively invisible.

     A tenant's brand hex also cannot be held to the gates that make a
     categorical palette safe — a colour-blind reader has to separate the
     slices, and someone will print this page. So identity gets a fixed,
     validated palette and the brand keeps everything it was already doing:
     the rail, the buttons, the focus rings, and every SINGLE-series chart
     on the page (the trend line, the bar tracks), where one hue is the
     correct choice and the brand is free to be it.

     Values are the documented default categorical order, validated against
     THIS page's surfaces rather than assumed:
       light on #ffffff — CVD ΔE 9.1, normal-vision ΔE 19.6, all PASS
       dark  on #12141d — CVD ΔE 8.4, normal-vision ΔE 19.3, all PASS
     Light mode warns on <3:1 fill contrast for three slots, which obliges a
     relief channel: every slice ships a visible legend row with its name and
     count. Do not remove those labels to save space — they are load-bearing
     for accessibility, not ornament.

     Slots are assigned BY ENTITY (see LANG_SLOT / CHANNEL_SLOT), never by
     rank, so Amharic does not change colour on the day it overtakes English. */
  --series-1: #3987e5;
  --series-2: #d95926;
  --series-3: #199e70;
  --series-4: #c98500;
  --series-5: #d55181;
  --series-6: #008300;
  --series-7: #9085e9;
  --series-8: #e66767;
}
:root[data-theme="light"] {
  --bg: #e8ecf4;
  --surface: #ffffff;
  --surface-2: #f9fafc;
  --side: #131a2b;
  --side-2: #1c2439;
  --line: #ccd4e2;
  --ink: #0f1729;
  --body: #293346;
  --muted: #57627a;
  --faint: #6f7a90;
  --side-text: #aeb7c9;
  --ok: #15803d;
  --warn: #b45309;
  --bad: #b91c1c;
  --ok-bg: #eafaf0;
  --warn-bg: #fdf5e6;
  --bad-bg: #fdeeee;
  /* The same eight hues stepped for a white surface — not an automatic
     lightening of the dark set. Validated separately; see the note above. */
  --series-1: #2a78d6;
  --series-2: #eb6834;
  --series-3: #1baf7a;
  --series-4: #eda100;
  --series-5: #e87ba4;
  --series-6: #008300;
  --series-7: #4a3aa7;
  --series-8: #e34948;
  --shadow: 0 1px 3px rgba(16, 24, 40, .09), 0 1px 2px rgba(16, 24, 40, .05);
}
* { box-sizing: border-box; margin: 0; }
body {
  font-family: "Noto Sans Ethiopic", "Segoe UI", system-ui, -apple-system, sans-serif;
  background: var(--bg); color: var(--ink);
  min-height: 100vh; font-size: 14px; line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
a { color: var(--brand); }
button { font-family: inherit; }

/* ---------------------------------------------------------------- sign in */
.gate { min-height: 100vh; display: grid; place-items: center; padding: 24px; }
.gate-card {
  width: 100%; max-width: 400px; background: var(--surface);
  border: 1px solid var(--line); border-radius: 16px; padding: 28px;
  box-shadow: 0 12px 40px rgba(16, 24, 40, .08);
}
.gate-mark {
  width: 42px; height: 42px; border-radius: 11px; background: var(--brand);
  display: grid; place-items: center; color: #fff; font-weight: 700; font-size: 17px;
  margin-bottom: 16px;
}
.gate h1 { font-size: 19px; margin-bottom: 4px; }
.gate .sub { color: var(--muted); font-size: 13px; margin-bottom: 20px; }
label { display: block; font-size: 12.5px; font-weight: 600; color: var(--body); margin-bottom: 6px; }
.field { margin-bottom: 14px; }
input, select, textarea {
  width: 100%; background: var(--surface); border: 1px solid var(--line);
  color: var(--ink); border-radius: 9px; padding: 10px 12px; font-size: 14px;
  font-family: inherit;
}
input:focus, select:focus, textarea:focus {
  outline: none; border-color: var(--brand);
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--brand) 16%, transparent);
}
textarea { min-height: 170px; resize: vertical; }
.btn {
  background: var(--brand); border: none; color: #fff; border-radius: 9px;
  padding: 10px 16px; font-size: 13.5px; font-weight: 600; cursor: pointer;
}
.btn:hover { filter: brightness(1.07); }
.btn[disabled] { opacity: .55; cursor: not-allowed; filter: none; }
.btn.wide { width: 100%; }
.btn.sm { padding: 7px 12px; font-size: 12.5px; }
.btn.ghost { background: transparent; color: var(--body); border: 1px solid var(--line); }
.btn.ghost:hover { background: var(--bg); filter: none; }
.btn.danger { background: var(--bad); }
.linky {
  background: none; border: none; color: var(--brand); cursor: pointer;
  font-size: 12.5px; padding: 0; text-decoration: underline;
}
.err {
  background: var(--bad-bg); color: var(--bad); border-radius: 9px;
  padding: 9px 12px; font-size: 13px; margin-bottom: 14px;
}
.hidden { display: none !important; }

/* ---------------------------------------------------------------- shell */
.shell { display: grid; grid-template-columns: var(--rail) 1fr; min-height: 100vh;
  transition: grid-template-columns .16s ease;
  /* The rail is sticky and one viewport tall, so on a long page the grid
     column beneath it showed the page background — a dark bar that stopped
     halfway down. Painting the stripe on the container keeps it whole at any
     scroll position without making the rail itself scroll. */
  background: linear-gradient(to right, var(--side) 0 var(--rail), var(--bg) var(--rail)); }
/* Collapsed keeps the icons and the queue badge — a rail that hides how many
   escalations are waiting has given up the reason it is always on screen. */
:root { --rail: 236px; }
:root[data-rail="mini"] { --rail: 62px; }
[data-rail="mini"] .side-name, [data-rail="mini"] .side-sub,
[data-rail="mini"] .navitem .label, [data-rail="mini"] .who .n,
[data-rail="mini"] .who .r { display: none; }
[data-rail="mini"] .side { padding: 16px 8px; align-items: center; }
[data-rail="mini"] .side-brand { padding: 4px 0 18px; justify-content: center; }
[data-rail="mini"] .navitem { justify-content: center; padding: 10px 0; }
[data-rail="mini"] .who { justify-content: center; padding: 4px 0 10px; }
[data-rail="mini"] .badge {
  position: absolute; transform: translate(12px, -12px);
  padding: 0 5px; min-width: 17px; font-size: 10px;
}
[data-rail="mini"] .navitem { position: relative; }
.railtoggle {
  background: none; border: none; color: var(--side-text); cursor: pointer;
  padding: 7px 10px; border-radius: 9px; width: 100%; text-align: left;
  display: flex; align-items: center; gap: 10px; font-size: 13.5px;
}
.railtoggle:hover { background: var(--side-2); color: #fff; }
[data-rail="mini"] .railtoggle { justify-content: center; padding: 10px 0; }
[data-rail="mini"] .railtoggle .label { display: none; }

/* On duty / off duty. Sits in the sidebar, on every page, because that is
   what it now means — presence follows the person around the console instead
   of living on one screen they have to keep open. */
.dutytoggle {
  background: var(--side-2); border: 1px solid transparent; color: var(--side-text);
  cursor: pointer; padding: 9px 11px; border-radius: 10px; width: 100%;
  display: flex; align-items: center; gap: 10px; font-size: 13.5px;
  margin-bottom: 8px; text-align: left;
}
.dutytoggle:hover { border-color: rgba(255, 255, 255, 0.18); color: #fff; }
.dutytoggle .lamp {
  width: 9px; height: 9px; border-radius: 50%; flex: none;
  background: var(--faint); box-shadow: none;
}
/* Lit, and visibly so. This is the one indicator that says a customer can
   reach you; a grey-on-grey dot for "off" and a slightly different grey for
   "on" would be a state nobody reads at a glance. */
.dutytoggle[aria-pressed="true"] { color: #fff; }
.dutytoggle[aria-pressed="true"] .lamp {
  background: var(--ok); box-shadow: 0 0 0 3px rgba(34, 168, 105, 0.22);
}
[data-rail="mini"] .dutytoggle { justify-content: center; padding: 10px 0; }
[data-rail="mini"] .dutytoggle .label { display: none; }
.side {
  background: var(--side); color: var(--side-text);
  display: flex; flex-direction: column; padding: 16px 12px;
  position: sticky; top: 0; height: 100vh;
}
.side-brand { display: flex; gap: 10px; align-items: center; padding: 4px 8px 18px; }
.side-mark {
  width: 32px; height: 32px; border-radius: 9px; background: var(--brand);
  display: grid; place-items: center; color: #fff; font-weight: 700; font-size: 13px;
  flex: none; overflow: hidden;
}
/* When a bank supplies a logo it replaces the initials tile rather than
   sitting beside it. White behind it because most bank logos are drawn for
   paper — gold or navy line-work disappears on a dark tile.

   THE TILE STOPS BEING A SQUARE once there is a logo in it. Banks supply two
   different things under the word "logo": a compact mark, and a lockup — the
   mark plus the wordmark, three or four times wider than it is tall. Forcing
   a lockup into a 32px square and letting object-fit letterbox it produced
   exactly what CBE's live panel showed: a thin strip of artwork with a white
   bar above and below it, framing the logo's own background colour. The
   contain was doing its job; the container was the wrong shape.

   So the container takes its width from the image at a fixed height. The
   white plate then hugs the artwork exactly — invisible behind an opaque
   image, and still a readable ground behind a transparent one. */
/* No padding. A logo with its own background — CBE's sits on purple — turns
   any inset into a visible white frame around the artwork, which is the same
   complaint as the letterboxing in a different shape. Zero inset means the
   plate is exactly the image: nothing to see behind an opaque logo, and still
   a full white ground behind a transparent one. */
/* Sized by a max-width AND a max-height on the IMAGE, with the container
   hugging whatever that comes to.

   Not `height: 100%` on the image: the tile is a grid container whose row is
   content-sized, so a percentage height has nothing to resolve against, falls
   back to auto, and the image renders at its intrinsic size clipped by
   overflow — which is how a square logo came out as a wide sliver.

   Not `object-fit` inside a fixed box either: that reintroduces the
   letterboxing, just on the other axis. Two maxima with auto dimensions let
   the browser scale to fit both, so the box IS the artwork. */
/* The white ground lives on the IMAGE, not on the tile behind it.

 Painting it on the container stacks two rounded shapes: the background
 antialiases white-to-transparent around the corner while the clipped
 image antialiases artwork-to-transparent, and wherever the image's alpha
 is below 1 the white shows through as a hairline arc. One element
 painting both the ground and the content clips once and has no seam.

 The ground still does its job — invisible behind an opaque logo, a full
 white field behind a transparent one drawn for paper. */
/* The white ground is INSET by 1px behind the image, not painted on the
   same box.

   A rounded box that paints white and then draws the logo over it composites
   twice at every partially-covered corner pixel — the result is white*a*(1-a),
   a visible hairline arc that peaks at 25% white. Isolated by probe: the
   artifact needs the background and the radius together, and drops either one
   and it vanishes. Since neither is expendable, the ground moves off the
   image's own edge instead. An opaque logo hides it completely; a
   transparent one drawn for paper still gets a full white field. */
.side-mark.haslogo, .gate-mark.haslogo {
  position: relative; background: none; display: block; padding: 0; border: 0;
  width: auto; height: auto; max-width: 150px; overflow: visible;
}
.side-mark.haslogo::before, .gate-mark.haslogo::before {
  content: ""; position: absolute; inset: 1px; background: #fff; border-radius: 5px;
}
.side-mark.haslogo img, .gate-mark.haslogo img {
  position: relative; display: block; width: auto; height: auto;
  max-width: 150px; max-height: 30px; border-radius: 6px;
}
/* A lockup is the brand block, not an item in a row beside one. Stacking it
   gives the artwork the rail's full width instead of whatever is left over. */
.side-brand[data-logo="wide"] {
  flex-direction: column; align-items: flex-start; gap: 7px;
}
.side-brand[data-logo="wide"] .side-mark.haslogo,
.side-brand[data-logo="wide"] .side-mark.haslogo img { max-width: 100%; }
.side-brand[data-logo="wide"] .side-mark.haslogo img { max-height: 34px; }
/* A lockup already carries the bank's name. Printing it again beside the
   image is the same word twice, and on a 240px rail it is the thing that
   pushes the logo down to a stamp. Applied only when the image measures wide
   — a compact mark still needs the name next to it. */
.side-brand[data-logo="wide"] .side-name { display: none; }
/* Collapsed to icons there is no width to give a lockup, so it goes back to
   fitting the icon column rather than overflowing it. */
[data-rail="mini"] .side-mark.haslogo,
[data-rail="mini"] .side-mark.haslogo img { max-width: 40px; }
[data-rail="mini"] .side-mark.haslogo img { max-height: 40px; }
[data-rail="mini"] .side-brand[data-logo="wide"] { align-items: center; }
.side-name { font-size: 13.5px; font-weight: 600; color: #fff; line-height: 1.25;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.side-sub { font-size: 11px; color: #6f7b93; }
.navitem {
  display: flex; align-items: center; gap: 10px; width: 100%;
  background: none; border: none; color: var(--side-text);
  padding: 9px 10px; border-radius: 9px; font-size: 13.5px; cursor: pointer;
  text-align: left; margin-bottom: 2px;
}
.navitem:hover { background: var(--side-2); color: #fff; }
.navitem.on { background: var(--brand); color: #fff; font-weight: 600; }
.navitem svg { flex: none; opacity: .9; }
.navitem .label { flex: 1; }
/* Borrowed from the conversational-builder reference: a count on the rail so
   waiting work is visible without navigating to it. The escalation queue is
   the one thing here that is time-sensitive. */
.badge {
  background: var(--bad); color: #fff; font-size: 11px; font-weight: 700;
  border-radius: 99px; padding: 1px 7px; min-width: 20px; text-align: center;
}
.navitem.on .badge { background: rgba(255,255,255,.24); }

/* ------------------------------------------------------------ sub-nav
   One rail entry per channel, nested under Channels. The rail is where an
   operator's mental map of the product lives, so a channel that exists needs
   to be visible there — not folded inside a Settings tab where you only find
   it if you already knew to look.

   The disclosure arrow is a separate control from the label: clicking
   "Channels" should open Channels, not merely toggle a drawer. Conflating the
   two is the classic sidebar trap where a parent becomes un-clickable. */
.navrow { display: flex; align-items: center; gap: 2px; }
.navrow .navitem { margin-bottom: 0; }
.disclose {
  background: none; border: none; color: var(--side-text); cursor: pointer;
  padding: 8px 5px; border-radius: 8px; line-height: 0; flex: none;
}
.disclose:hover { background: var(--side-2); color: #fff; }
.disclose svg { transition: transform .15s; }
.disclose[aria-expanded="true"] svg { transform: rotate(90deg); }
.subnav { margin: 2px 0 4px 13px; padding-left: 11px; border-left: 1px solid var(--side-2); }
.subnav[hidden] { display: none; }
.subitem {
  display: flex; align-items: center; gap: 8px; width: 100%;
  background: none; border: none; color: var(--side-text);
  padding: 6px 9px; border-radius: 8px; font-size: 12.5px; cursor: pointer;
  text-align: left; font-family: inherit;
}
.subitem:hover { background: var(--side-2); color: #fff; }
.subitem.on { background: var(--side-2); color: #fff; font-weight: 600; }
.subitem .label { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
/* The channel's own series colour, so the rail, the dashboard panel and the
   donut all say "Telegram" with the same swatch. Hollow when it is not live —
   the same language the dashboard list uses. */
.subitem .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
.subitem.idle .dot { background: none !important; border: 1.5px solid #6f7b93; }
/* Collapsed to icons there is no room to nest anything, and a sub-list with no
   labels is a column of unexplained dots. */
[data-rail="mini"] .subnav, [data-rail="mini"] .disclose { display: none; }

.side-foot { margin-top: auto; border-top: 1px solid var(--side-2); padding-top: 12px; }
.who { display: flex; gap: 9px; align-items: center; padding: 4px 8px 10px; }
.avatar {
  width: 30px; height: 30px; border-radius: 50%; flex: none;
  background: var(--side-2); color: #fff; display: grid; place-items: center;
  font-size: 11.5px; font-weight: 700;
}
.who .n { font-size: 12.5px; color: #fff; overflow: hidden;
  text-overflow: ellipsis; white-space: nowrap; }
.who .r { font-size: 11px; color: #6f7b93; text-transform: capitalize; }

.content { min-width: 0; }
.topbar {
  background: var(--surface); border-bottom: 1px solid var(--line);
  padding: 14px 24px; display: flex; align-items: center; gap: 14px;
  flex-wrap: wrap; position: sticky; top: 0; z-index: 5;
}
.topbar h2 { font-size: 17px; }
.topbar .spacer { flex: 1; }
#status { font-size: 12.5px; color: var(--muted); }

/* ----------------------------------------------------------- topbar tools
   Two controls, each answering a question the page could not answer before.

   "Updated 6m ago" — a dashboard gets left open on a second monitor all day,
   and every number on it silently ages. Without a timestamp there is no way to
   tell a quiet morning from a stale tab, and that is the failure mode where
   someone acts on numbers from yesterday.

   The queue button — the rail badge disappears when the rail is collapsed, and
   it is invisible on the pages an operator actually works from. The one
   time-sensitive thing in this product should be reachable from anywhere. */
.tools { display: flex; align-items: center; gap: 8px; }
.stamp {
  font-size: 12px; color: var(--faint); font-variant-numeric: tabular-nums;
  white-space: nowrap;
}
.qbtn {
  display: flex; align-items: center; gap: 7px; background: none; cursor: pointer;
  border: 1px solid var(--line); color: var(--muted); border-radius: 9px;
  padding: 6px 11px; font-size: 12.5px; font-family: inherit;
}
.qbtn:hover { border-color: var(--brand); color: var(--brand); }
.qbtn .cnt {
  font-weight: 700; font-variant-numeric: tabular-nums; color: var(--ink);
}
/* Waiting work is not a neutral fact. An empty queue stays quiet; a queue with
   somebody in it wears the warning colour, so the state is readable without
   reading the number. */
.qbtn.hot { border-color: color-mix(in srgb, var(--warn) 55%, var(--line));
  color: var(--warn); }
.qbtn.hot .cnt { color: var(--warn); }
.spin { animation: spin .7s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (max-width: 720px) { .stamp, .qbtn .lbl { display: none; } }
main { padding: 20px 24px 40px; }

/* ------------------------------------------------------- welcome banner
   From the reference dashboard, minus its mascot and its wave emoji. The
   gradient is derived from the tenant's own hue, so it reads as their panel
   and not as ours. */
.hello {
  background: linear-gradient(120deg,
    color-mix(in srgb, var(--brand) 26%, var(--surface)),
    var(--surface) 72%);
  border: 1px solid var(--line); border-radius: var(--radius);
  padding: 20px 22px; margin-bottom: 16px;
  display: flex; align-items: center; gap: 18px; flex-wrap: wrap;
}
.hello h2 { font-size: 20px; letter-spacing: -.01em; }
.hello p { color: var(--muted); font-size: 13.5px; margin-top: 3px; }
.hello .right { margin-left: auto; text-align: right; }
.hello .big { font-size: 26px; font-weight: 650; font-variant-numeric: tabular-nums; }
.hello .cap { font-size: 11.5px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }

/* ---------------------------------------------------------------- cards */
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(198px, 1fr));
  gap: 14px; margin-bottom: 18px; }
.kpi { background: var(--surface); border: 1px solid var(--line);
  border-radius: var(--radius); padding: 15px 16px; box-shadow: var(--shadow); }
.kpi { display: flex; gap: 12px; align-items: flex-start; }
/* The delta sits on the card's bottom edge rather than under whatever height
   the text above happened to take, so the four read as one row of cards. */
.kpi .txt { flex: 1; min-width: 0; display: flex; flex-direction: column; height: 100%; }
.kpi .delta { margin-top: auto; padding-top: 8px; }
/* The circular tinted icon from the reference. Purely decorative, so it is
   aria-hidden — a screen reader announcing "chart icon" before every number
   would be noise. */
.kpi .ico {
  width: 34px; height: 34px; border-radius: 10px; flex: none;
  display: grid; place-items: center;
  background: color-mix(in srgb, var(--brand) 16%, transparent);
  color: var(--brand);
}
/* Two lines' worth of room whether or not the label needs it, so the four
   numbers sit on one line across the row. Without it, "Answered from your own
   content" wraps and drops its value below the other three, which reads as a
   misalignment rather than as a longer label. */
.kpi .k { font-size: 12.5px; color: var(--muted); line-height: 1.35; height: 2.7em; }
/* Anything that opens the rows behind it says so on hover. Only figures with
   a genuine destination are made clickable — a card that looks interactive
   and goes nowhere is worse than one that plainly does not. */
.drill { cursor: pointer; transition: border-color .12s, transform .12s; }
.drill:hover { border-color: color-mix(in srgb, var(--brand) 55%, var(--line)); }
.kpi.drill:hover { transform: translateY(-1px); }
.drill .k::after, .bar.drill span:first-child::after,
.topic.drill span:last-child::after { content: " ›"; color: var(--faint); }
.bar.drill:hover span:first-child, .topic.drill:hover span:last-child { color: var(--brand); }
/* A delta is only drawn when there is a named previous window to compare
   with. An arrow with no stated baseline is decoration that reads as
   evidence. */
.delta { font-size: 11.5px; font-weight: 600; margin-top: 6px; display: inline-block; }
.delta.up { color: var(--ok); }
.delta.down { color: var(--bad); }
.delta.flat { color: var(--faint); font-weight: 500; }
.kpi .v { font-size: 27px; font-weight: 650; margin-top: 5px; letter-spacing: -.02em;
  font-variant-numeric: tabular-nums; }
/* A metric with no denominator renders as an em dash, never as 0%. The
   analytics endpoint returns null on purpose when nothing has been asked yet,
   and "0%" would report a failure that has not happened. */
.kpi .v.none { color: var(--faint); font-weight: 400; font-size: 22px; }
.kpi .sub { font-size: 11.5px; color: var(--faint); margin-top: 5px; }
.panel { background: var(--surface); border: 1px solid var(--line);
  border-radius: var(--radius); padding: 16px; margin-bottom: 14px;
  box-shadow: var(--shadow); }
.panel > h3 { font-size: 11.5px; text-transform: uppercase; letter-spacing: .07em;
  color: var(--muted); margin-bottom: 12px; }
.grid2 { display: grid; grid-template-columns: 1.6fr 1fr; gap: 14px; align-items: start; }

/* Explicit rows, not two independent columns.
 *
 * The first version stacked panels in a 1.6fr / 1fr split and let each column
 * end wherever its contents ran out. Measured, that produced eight panels
 * between 118px and 466px tall whose edges never lined up across the gutter —
 * which is exactly what "unarranged" looks like, and no amount of adjusting
 * individual card padding would have fixed it.
 *
 * Rows fix it structurally: grid stretches every cell in a row to the tallest,
 * so each row has one top edge and one bottom edge. Panels are then PAIRED BY
 * WEIGHT rather than by topic — the two short ones share a column beside the
 * chart, the two mid-sized ones sit together — so the stretching is a few
 * pixels rather than a card of mostly empty space.
 */
.row { display: grid; gap: 14px; margin-bottom: 14px; align-items: stretch; }
.row-main { grid-template-columns: 2fr 1fr; }
.row-half { grid-template-columns: 1fr 1fr; }
.row > .panel, .stack > .panel { margin-bottom: 0; }
.stack { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
/* The last panel in a stack absorbs any slack, so the column ends flush with
   its neighbour instead of leaving a gap under the final card. */
.stack > .panel:last-child { flex: 1; }
.row > .panel { min-width: 0; display: flex; flex-direction: column; }
/* A bar group takes the slack in a stretched card and centres in it, so the
   card looks sized rather than merely tall. */
.barwrap { flex: 1; display: flex; flex-direction: column; justify-content: center; }
.topicwrap { flex: 1; }
.chartwrap { flex: 1; display: flex; flex-direction: column; justify-content: center; }

@media (max-width: 1100px) {
  .row-main, .row-half { grid-template-columns: 1fr; }
}
@media (max-width: 980px) { .grid2 { grid-template-columns: 1fr; } .shell { grid-template-columns: 1fr; }
  .side { position: static; height: auto; } }

/* ---------------------------------------------------------------- chart */
.chart { width: 100%; display: block; }
.chart .line { fill: none; stroke: var(--brand); stroke-width: 2; }
.chart .area { fill: url(#brandfade); }
.chart .gl { stroke: var(--line); stroke-width: 1; }
.chart text { font-size: 10px; fill: var(--faint); }
.chart .dot { fill: var(--brand); }
.chart .hit { fill: transparent; }
.chartwrap { position: relative; }
/* Hover readout, as in the reference. Real values off the same series the
   line is drawn from — there is no second source to disagree with. */
.tip {
  position: absolute; pointer-events: none; opacity: 0; transition: opacity .12s;
  background: var(--surface-2); border: 1px solid var(--line); border-radius: 9px;
  padding: 7px 10px; font-size: 12px; color: var(--ink); box-shadow: var(--shadow);
  white-space: nowrap; transform: translate(-50%, -120%); z-index: 3;
}
.tip .d { color: var(--muted); font-size: 11px; }
.tip.on { opacity: 1; }

/* --------------------------------------------------------------- donut */
.donutwrap { display: flex; gap: 18px; align-items: center; flex: 1; flex-wrap: wrap; }
.donut { flex: none; }
.donut .hole { font-size: 19px; font-weight: 650; fill: var(--ink); }
.donut .holesub { font-size: 8px; fill: var(--muted); letter-spacing: .06em; }
.donut path { transition: opacity .12s; cursor: default; }
.donut path.clickable { cursor: pointer; }
.donut path:hover { opacity: .82; }
.legend { flex: 1; min-width: 140px; }
.legend .row {
  display: flex; align-items: center; gap: 9px; padding: 4px 0; font-size: 13px;
  color: var(--body); background: none; border: none; width: 100%; text-align: left;
  font-family: inherit;
}
.legend .row.clickable { cursor: pointer; }
.legend .row.clickable:hover { color: var(--brand); }
.legend .sw { width: 10px; height: 10px; border-radius: 3px; flex: none; }
.legend .lbl { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.legend .val { color: var(--muted); font-variant-numeric: tabular-nums; }
.legend .row.zero .lbl, .legend .row.zero .val { color: var(--faint); }

/* ------------------------------------------------------------- channels */
/* Not a share chart. A donut of one channel is a circle that says 100%, and
   worse, a breakdown drawn from traffic alone cannot say the thing a bank
   most wants to know — that WhatsApp is not connected yet. So the catalogue
   is the spine: every channel is listed, the ones carrying customers show
   their volume, and the rest say what it would take to switch them on. */
.chanlist { display: flex; flex-direction: column; }
.chan {
  display: grid; grid-template-columns: 10px 1fr auto; gap: 10px;
  align-items: center; padding: 8px 0; border-bottom: 1px solid var(--line);
  background: none; border-left: 0; border-right: 0; border-top: 0; width: 100%;
  text-align: left; font-family: inherit; font-size: 13px; color: var(--body);
}
.chan:last-child { border-bottom: none; }
.chan.clickable { cursor: pointer; }
.chan.clickable:hover .cname { color: var(--brand); }
.chan .dot { width: 10px; height: 10px; border-radius: 3px; }
/* A channel with no traffic keeps its identity colour but wears it hollow —
   recognisable when it does light up, without competing for attention now. */
.chan.idle .dot, .dot.hollow { background: none !important; border: 1.5px solid var(--faint); }
.cname { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
/* The dashboard panel is a tight list where a truncated name is fine. The
   Channels page carries each channel's one-line explanation as well, so there
   the row wraps and aligns to the top rather than ellipsising it away. */
.chanlist.rich .chan {
  align-items: start; padding: 13px 0;
  grid-template-columns: 10px 1fr auto auto; gap: 10px 14px;
}
.chanlist.rich .chan .dot { margin-top: 5px; }
.chanlist.rich .cname { white-space: normal; overflow: visible; }
.chanlist.rich .cname .meta { margin-top: 3px; }
.chan .n { font-variant-numeric: tabular-nums; color: var(--ink); font-weight: 600; }
.chan .pill {
  font-size: 10.5px; letter-spacing: .04em; text-transform: uppercase;
  padding: 2px 7px; border-radius: 99px; border: 1px solid var(--line);
  color: var(--faint); white-space: nowrap;
}
/* Live and merely-connectable must not look alike: one is a channel sitting
   quiet, the other is work nobody has done yet. */
.chan.q { grid-template-columns: 10px 1fr auto auto; }
.chan.q .n { min-width: 62px; text-align: right; }
.chan .pill.on { color: var(--ok); border-color: color-mix(in srgb, var(--ok) 45%, var(--line)); }
.chan .pill.next { color: var(--brand); border-color: color-mix(in srgb, var(--brand) 45%, var(--line)); }

/* A slim part-to-whole bar, shown ONLY when two or more channels carry
   traffic. With one it would be a full-width block conveying nothing. The
   2px gaps are the spacer rule — touching fills read as one segment. */
.sharebar { display: flex; gap: 2px; height: 8px; margin-bottom: 12px; }
.sharebar span { border-radius: 2px; min-width: 3px; }

/* What replaces a chart when there is only one thing to show: say it. */
.oneline { font-size: 13px; color: var(--body); line-height: 1.5; margin-bottom: 12px; }
.oneline b { color: var(--ink); font-weight: 650; }

/* --------------------------------------------------------- activity feed */
/* Capped and scrolled rather than allowed to run. A feed is unbounded by
   nature, so left alone it sets the height of the whole right-hand column and
   drags the layout out of balance with whatever is beside it. */
.feedscroll { max-height: 208px; overflow-y: auto; }
.feedscroll::-webkit-scrollbar { width: 8px; }
.feedscroll::-webkit-scrollbar-thumb {
  background: var(--line); border-radius: 99px;
}
.feedscroll::-webkit-scrollbar-track { background: transparent; }
.feed { display: flex; gap: 11px; padding: 9px 0; border-bottom: 1px solid var(--line); }
.feed:last-child { border-bottom: none; }
.feed .tile {
  width: 30px; height: 30px; border-radius: 9px; flex: none; display: grid;
  place-items: center; background: color-mix(in srgb, var(--brand) 15%, transparent);
  color: var(--brand);
}
.feed .tile.token { background: var(--warn-bg); color: var(--warn); }
.feed .what { font-size: 13px; color: var(--body); }
.feed .who { font-size: 11.5px; color: var(--faint); margin-top: 1px; }

/* --------------------------------------------------------- chat preview */
.preview { padding: 0; overflow: hidden; }
.preview h3 { padding: 16px 16px 0; }
.preview .frame {
  width: 100%; height: 360px; border: none; display: block;
  border-top: 1px solid var(--line); margin-top: 12px; background: var(--surface);
}
.preview .cap { padding: 10px 16px; font-size: 11.5px; color: var(--faint);
  border-top: 1px solid var(--line); }

/* ---------------------------------------------------------------- bars */
.bar { display: grid; grid-template-columns: 170px 1fr 46px; gap: 12px;
  align-items: center; margin: 8px 0; font-size: 13px; color: var(--body); }
.bar .track { background: var(--bg); border: 1px solid var(--line);
  border-radius: 5px; height: 9px; overflow: hidden; }
/* display:block matters — a span is inline, so width is ignored and every bar
   renders as an empty track. */
.bar .fill { display: block; background: var(--brand); height: 100%; }
.bar .fill.warn { background: var(--warn); }
.bar .fill.bad { background: var(--bad); }
.bar .n { text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; }
.topic { display: grid; grid-template-columns: 44px 1fr; gap: 12px;
  align-items: baseline; margin: 8px 0; font-size: 13px; color: var(--body); }
.topic .n { text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; }

/* ---------------------------------------------------------------- tables */
table { width: 100%; border-collapse: collapse; }
th { text-align: left; font-size: 11px; text-transform: uppercase;
  letter-spacing: .06em; color: var(--muted); font-weight: 600;
  padding: 0 10px 9px; border-bottom: 1px solid var(--line); }
td { padding: 11px 10px; border-bottom: 1px solid var(--line);
  font-size: 13.5px; color: var(--body); vertical-align: top; }
tr:last-child td { border-bottom: none; }
td.title { color: var(--ink); font-weight: 550; }
.rowacts { display: flex; gap: 6px; justify-content: flex-end; }
.iconbtn { background: none; border: 1px solid var(--line); color: var(--muted);
  border-radius: 7px; padding: 5px 7px; cursor: pointer; line-height: 0; }
/* The theme switch was a muted glyph inside a near-invisible outline, on a
   near-black bar — findable only if you knew it was there. It now reads as a
   control: a filled surface, a visible edge, and a full-contrast glyph. */
#theme-toggle {
  background: var(--surface-2); border-color: var(--line); color: var(--ink);
  line-height: 1; font-size: 15px; padding: 6px 11px; border-radius: 9px;
}
#theme-toggle:hover { border-color: var(--brand); color: var(--brand); }
.iconbtn:hover { border-color: var(--brand); color: var(--brand); }
.iconbtn.danger:hover { border-color: var(--bad); color: var(--bad); }

.pill { display: inline-block; font-size: 11px; font-weight: 600; padding: 3px 9px;
  border-radius: 99px; background: var(--bg); color: var(--body); }
.pill.open { background: var(--warn-bg); color: var(--warn); }
.pill.closed { background: var(--ok-bg); color: var(--ok); }
.pill.on { background: var(--ok-bg); color: var(--ok); }
.pill.off { background: var(--bad-bg); color: var(--bad); }
/* Actionable-now, as distinct from working-already (.on) and
   blocked-on-paperwork (plain). */
.pill.next { background: color-mix(in srgb, var(--brand) 16%, transparent);
  color: var(--brand); }

.seg { display: inline-flex; background: var(--bg); border: 1px solid var(--line);
  border-radius: 9px; padding: 2px; }
.seg button { background: none; border: none; color: var(--muted);
  padding: 5px 12px; font-size: 12.5px; border-radius: 7px; cursor: pointer; }
.seg button.on { background: var(--surface); color: var(--ink); font-weight: 600;
  box-shadow: 0 1px 2px rgba(16,24,40,.08); }

.empty { color: var(--muted); font-size: 13.5px; padding: 22px 0; text-align: center; }
.note { font-size: 12px; color: var(--faint); margin-top: 12px; }
.meta { font-size: 12px; color: var(--muted); }
.tools { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 14px; }

.msgline { padding: 9px 11px; border-radius: 9px; margin-bottom: 6px;
  font-size: 13.5px; white-space: pre-wrap; }
.msgline.user { background: color-mix(in srgb, var(--brand) 9%, var(--bg)); }
.msgline.assistant { background: var(--bg); }
.contact { margin: 8px 0; font-size: 13px; }
.contact.none { color: var(--faint); font-style: italic; }
.waiting { font-size: 12px; color: var(--warn); }
.waiting.cold { color: var(--bad); }
.resolution { margin: 8px 0; font-size: 13px; color: var(--body);
  border-left: 2px solid var(--brand); padding-left: 10px; }
.resolution .when { color: var(--faint); font-size: 11.5px; }
.noteform { display: flex; gap: 8px; margin-top: 10px; }
.noteform input { flex: 1; }
/* ------------------------------------------------------------- gaps */
.gap { padding: 14px 16px; }
.gaphead { display: flex; gap: 14px; align-items: flex-start; }
.gap .rank {
  font-size: 15px; font-weight: 700; color: var(--brand); flex: none;
  min-width: 42px; padding-top: 1px; font-variant-numeric: tabular-nums;
}
.gapq { font-size: 14.5px; color: var(--ink); font-weight: 550; }
.gapmeta { display: flex; gap: 7px; align-items: center; flex-wrap: wrap; margin-top: 7px; }
.alsoasked {
  margin: 10px 0 0 56px; padding-left: 12px; border-left: 2px solid var(--line);
  font-size: 13px; color: var(--muted);
}
.gapnote {
  background: color-mix(in srgb, var(--brand) 8%, transparent);
  border: 1px solid color-mix(in srgb, var(--brand) 28%, var(--line));
  border-radius: 10px; padding: 12px 14px; margin-bottom: 14px; font-size: 13px;
}
.gapnote strong { color: var(--ink); }
.gapnote div { color: var(--body); margin-top: 5px; }

.whobtn {
  background: none; border: none; padding: 0; cursor: pointer; font-size: 13.5px;
  font-weight: 550; color: var(--ink); text-align: left; font-family: inherit;
}
.whobtn:hover { color: var(--brand); text-decoration: underline; }

.perm { display: inline-block; font-size: 11px; font-family: ui-monospace, monospace;
  background: var(--bg); border: 1px solid var(--line); border-radius: 6px;
  padding: 2px 7px; margin: 0 5px 5px 0; color: var(--body); }

/* ---------------------------------------------------------------- print
   The screen is light already, so print needs far less undoing than the old
   near-black panel did. This is the one report that leaves the building — a
   bank puts it in a board pack — so it has to read as a document. */
.printonly { display: none; }
@media print {
  @page { margin: 16mm; }
  /* Printing the dark theme is a wasted cartridge and an unreadable page.
     The report is the one artefact that leaves the building — a bank puts it
     in a board pack — so print always uses the light palette whatever is on
     screen. */
  :root {
    --bg: #fff; --surface: #fff; --surface-2: #fff; --line: #bbb;
    --ink: #111; --body: #222; --muted: #444; --faint: #555;
    --ok: #15803d; --warn: #b45309; --bad: #b91c1c;
    --ok-bg: #fff; --warn-bg: #fff; --bad-bg: #fff; --shadow: none;
  }
  body { background: #fff; }
  .hello { background: #fff !important; }
  .preview, .tip { display: none !important; }
  .side, .topbar, .noprint, .tools { display: none !important; }
  .shell { display: block; }
  .printonly { display: block; }
  .stamp { margin-bottom: 18px; border-bottom: 2px solid #111; padding-bottom: 10px; }
  .stamp h1 { font-size: 19px; margin-bottom: 4px; }
  .stamp div { font-size: 12px; color: #444; }
  main { padding: 0 !important; }
  .panel, .kpi { break-inside: avoid; page-break-inside: avoid; box-shadow: none; }
  .kpis { grid-template-columns: repeat(4, 1fr) !important; }
  .grid2 { grid-template-columns: 1fr 1fr !important; }
}

/* ------------------------------------------------------- the teller's call */
/* Full-screen, above everything including the slide-out (9999) and the
   documents modal (10000). A live customer is on the other end; nothing in
   this panel should be able to draw over them. */
.callroom {
  position: fixed; inset: 0; z-index: 10001; display: none;
  background: #06070d; color: var(--ink);
  grid-template-columns: 1fr 340px; grid-template-rows: 1fr auto;
}
.callroom.open { display: grid; }
.callroom .video { position: relative; grid-row: 1; overflow: hidden; background: #06070d; }
.callroom .video video.remote { width: 100%; height: 100%; object-fit: cover; }
.callroom .waiting {
  position: absolute; inset: 0; display: grid; place-items: center;
  text-align: center; padding: 24px;
}
.callroom .waiting .av {
  width: 88px; height: 88px; border-radius: 50%; margin: 0 auto 14px;
  background: color-mix(in srgb, var(--brand) 70%, #000);
  display: grid; place-items: center; font-size: 28px; font-weight: 600;
}
.callroom .waiting .lang {
  font-size: 15px; font-weight: 600; color: var(--ink); margin-bottom: 6px;
}
.callroom .waiting .msg { color: var(--muted); font-size: 13.5px; }
.callroom .self {
  position: absolute; right: 16px; bottom: 16px;
  width: 150px; height: 112px; border-radius: 12px; overflow: hidden;
  background: #12141d; border: 1px solid rgba(255,255,255,.14);
}
/* Mirrored: an un-mirrored self-view reads as somebody else's camera. */
.callroom .self video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
/* Reading an ID held at arm's length on a moving phone is the problem this
   solves. The still sits over the live video; the live call carries on
   underneath it, audio included. */
.callroom .frozen {
  position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain;
  background: #06070d; z-index: 3;
}
.callroom .freeze {
  position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%);
  z-index: 4; background: rgba(10,12,16,.82); color: #fff;
  border: 1px solid rgba(255,255,255,.22); border-radius: 999px;
  padding: 8px 18px; font: inherit; font-size: 12.5px; font-weight: 600;
  cursor: pointer; backdrop-filter: blur(6px);
}
.callroom .freeze:hover { background: rgba(10,12,16,.95); }

/* The working column. A teller needs the transcript and the verification
   bar in the same glance as the customer's face — putting either behind a
   tab means the ID check happens from memory. */
.callroom .work {
  grid-row: 1 / span 2; border-left: 1px solid var(--line);
  background: var(--surface); display: flex; flex-direction: column; min-height: 0;
}
.callroom .work h4 {
  font-size: 11px; letter-spacing: .06em; text-transform: uppercase;
  color: var(--faint); padding: 14px 16px 8px;
}
.callroom .transcript {
  flex: 1; overflow-y: auto; padding: 0 16px 12px;
  display: flex; flex-direction: column; gap: 8px; min-height: 0;
}
.callroom .msg2 {
  font-size: 12.5px; line-height: 1.5; padding: 8px 11px; border-radius: 10px;
  background: var(--surface-2); color: var(--body); max-width: 92%;
}
/* Alignment is "mine versus theirs", read from the TELLER's seat: the
   customer and the assistant are both the other side of this conversation
   and sit left; only what this teller typed sits right.

   The first pass had the customer on the right — the widget's convention,
   where the customer is "me" — which put the customer and the teller on the
   same side and destroyed the only cue the layout gives. Caught by looking
   at it, not by reading it. */
.callroom .msg2.user { align-self: flex-start; background: var(--brand); color: #fff; }
/* The teller's own lines, distinct from the assistant's. A bank reviewing a
   transcript has to be able to see at a glance which sentences a person
   wrote and which the AI did — that distinction is the product. */
.callroom .msg2.teller {
  align-self: flex-end; background: var(--surface-2); color: var(--ink);
  border: 1px solid color-mix(in srgb, var(--brand) 45%, var(--line));
}
.callroom .rolelbl {
  font-size: 10px; letter-spacing: .05em; text-transform: uppercase;
  color: var(--faint); margin: 2px 0 -4px;
}
.callroom .rolelbl.mine { align-self: flex-end; }
.callroom .composer2 {
  display: flex; gap: 8px; padding: 10px 16px;
  border-top: 1px solid var(--line);
}
.callroom .composer2 input {
  flex: 1; min-width: 0; margin: 0; padding: 9px 11px; font-size: 13px;
  background: var(--surface-2);
}
.callroom .composer2 button { flex: none; }

.callroom .verify { border-top: 1px solid var(--line); padding: 14px 16px; }
/* The approved-answer search. Scrolls on its own rather than pushing the
   composer off screen — a teller must always be able to type, even mid-search. */
.callroom .answers { border-top: 1px solid var(--line); padding: 14px 16px;
  display: flex; flex-direction: column; min-height: 0; flex: 1; }
.callroom .answers h4 { margin: 0 0 8px; }
.callroom .answers input[type="search"] { width: 100%; margin-bottom: 8px; }
.callroom .ansList { overflow-y: auto; min-height: 0; }
.callroom .ansItem {
  border: 1px solid var(--line); border-radius: 8px; padding: 9px 11px;
  margin-bottom: 7px; cursor: pointer; background: var(--surface);
}
.callroom .ansItem:hover { border-color: var(--brand); }
.callroom .ansItem b { display: block; font-size: 12.5px; margin-bottom: 3px; }
.callroom .ansItem span {
  display: block; font-size: 12px; line-height: 1.45; color: var(--body);
  /* Three lines is enough to recognise the answer; the teller opens the one
     they want. A wall of text here is unreadable at a glance, and a glance is
     all they have while somebody is talking to them. */
  display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical;
  overflow: hidden;
}
.callroom .ansEmpty { font-size: 12px; color: var(--muted); padding: 6px 2px; }
.callroom .verify label {
  display: flex; gap: 9px; align-items: flex-start;
  font-size: 12.5px; line-height: 1.45; color: var(--body);
  /* The global `label` rule is 600 — right for a form field's name, wrong
     for a sentence a teller reads while looking at a customer. */
  font-weight: 450;
  margin-bottom: 9px; cursor: pointer;
}
.callroom .verify label span { flex: 1; }
/* The global `input` rule sets width:100%, which a checkbox obeys — it took
   the whole row and squeezed each sentence into a narrow right-aligned
   column. Caught by rendering it, not by reading the rule. */
.callroom .verify input[type=checkbox] {
  width: auto; flex: none; margin: 2px 0 0; accent-color: var(--brand);
}
.callroom .verify input[type=text] {
  width: 100%; margin-bottom: 10px; padding: 9px 11px; border-radius: 9px;
  background: var(--surface-2); border: 1px solid var(--line);
  color: var(--ink); font-family: inherit; font-size: 13px;
}
/* The two legs of the rule, named on screen. A flat list of ticks gives the
   teller no way to know which combination the server will accept until it
   refuses one, mid-call, with a customer waiting. */
/* --------------------------------------------------------------- dense lists
 *
 * Both the escalation queue and the conversation log were a stack of panels,
 * one per row, each about 200px tall. That reads well with eight rows and
 * fails completely at a hundred a day, which is the volume the product is
 * sold for: everything is equally prominent, so nothing is, and finding the
 * one that matters means scrolling past ninety-nine that do not.
 *
 * A list is for TRIAGE — deciding what to work on. Detail is for WORKING. The
 * old cards tried to be both and were neither: every row carried a resolution
 * box nobody was going to type into, which is what made them tall.
 *
 * So: one line per row, scannable down a single column of meaning, and the
 * detail opens in place when a row is clicked. Roughly 44px instead of 200 —
 * about twenty rows on screen instead of three.
 */
.rows { border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.rows .r {
  display: flex; align-items: center; gap: 10px; padding: 10px 13px;
  border-bottom: 1px solid var(--line); cursor: pointer; background: var(--surface);
  font-size: 13px;
}
.rows .r:last-child { border-bottom: 0; }
.rows .r:hover { background: var(--surface-2); }
.rows .r.open { background: var(--surface-2); }
/* The urgency lane. A dot rather than a word: at twenty rows on screen the
   eye finds colour before it reads anything, and urgent is the only thing
   worth finding that fast. */
.rows .r .dot2 {
  width: 7px; height: 7px; border-radius: 50%; flex: none;
  background: var(--line);
}
.rows .r.hot .dot2 { background: #ef4444; box-shadow: 0 0 0 3px rgba(239,68,68,.18); }
/* The one column that says what this is. Everything else is metadata; this
   is the sentence the customer typed, and it is what makes a list scannable
   instead of a hundred identical rows. */
.rows .r .what {
  flex: 1; min-width: 0; white-space: nowrap; overflow: hidden;
  text-overflow: ellipsis; color: var(--ink);
}
.rows .r .who { color: var(--muted); font-size: 12px; flex: none; max-width: 170px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rows .r .tag {
  flex: none; font-size: 11px; color: var(--muted); background: var(--surface-2);
  border: 1px solid var(--line); border-radius: 999px; padding: 2px 8px;
  white-space: nowrap;
}
.rows .r.open .tag { background: var(--surface); }
.rows .r .age {
  flex: none; color: var(--faint); font-size: 11.5px; width: 66px;
  text-align: right; font-variant-numeric: tabular-nums;
}
.rows .r .age.cold { color: #f59e0b; }
.rows .detail {
  padding: 14px 16px 16px; border-bottom: 1px solid var(--line);
  background: var(--surface-2);
}
.rows .detail:last-child { border-bottom: 0; }
.listhead {
  display: flex; align-items: center; gap: 10px; margin: 0 0 10px;
  font-size: 12px; color: var(--faint);
}
.listhead input {
  flex: 1; max-width: 320px; padding: 7px 11px; border-radius: 9px;
  background: var(--surface-2); border: 1px solid var(--line);
  color: var(--ink); font: inherit; font-size: 12.5px;
}

/* The desk strip. An operator's first question of the morning is "is there
   anything on fire", and this is where that is answered — so a desk with
   urgent work is coloured rather than merely counted. */
.desks { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 14px; }
.desks .desk {
  background: var(--surface-2); border: 1px solid var(--line); color: var(--muted);
  border-radius: 999px; padding: 7px 13px; font: inherit; font-size: 12.5px;
  cursor: pointer; display: inline-flex; align-items: center; gap: 7px;
}
.desks .desk:hover { color: var(--ink); }
.desks .desk.on { background: var(--brand); border-color: var(--brand); color: #fff; }
.desks .desk b { font-variant-numeric: tabular-nums; font-weight: 700; }
.desks .desk.hot { border-color: var(--danger, #dc2626); }
.desks .desk .u { color: var(--danger, #dc2626); font-size: 11px; font-weight: 600; }
.desks .desk.on .u { color: #fff; }
.pill.urgent { background: rgba(220, 38, 38, .15); color: #ef4444; }
.pill.desk { background: var(--surface-2); color: var(--muted); }

.callroom .vleg {
  font-size: 10.5px; letter-spacing: .06em; text-transform: uppercase;
  color: var(--faint); margin: 10px 0 6px;
}
.callroom .vleg:first-child { margin-top: 0; }
.callroom .verified {
  font-size: 12.5px; color: var(--ok); display: flex; gap: 7px; align-items: center;
}
.callroom .scope {
  font-size: 11.5px; color: var(--faint); margin-top: 8px; line-height: 1.45;
}

.callroom .controls {
  grid-row: 2; grid-column: 1; display: flex; gap: 14px;
  justify-content: center; padding: 16px; background: #06070d;
  border-top: 1px solid var(--line);
}
.callroom .controls button {
  width: 50px; height: 50px; border-radius: 50%; border: 0; cursor: pointer;
  display: grid; place-items: center; color: #fff;
  background: rgba(255,255,255,.13);
}
.callroom .controls button svg { width: 20px; height: 20px; }
/* White for "off", not red — red reads as a dangerous control, and the
   danger here is forgetting you are muted. */
.callroom .controls button.off { background: #fff; color: #06070d; }
.callroom .controls button.hang { background: #dc2626; }

@media (max-width: 900px) {
  .callroom { grid-template-columns: 1fr; grid-template-rows: 1fr auto auto; }
  .callroom .work { grid-row: 2; grid-column: 1; border-left: 0; border-top: 1px solid var(--line); max-height: 42vh; }
  .callroom .controls { grid-row: 3; }
}
</style>
</head>
<body>

<!-- ------------------------------------------------------------ sign in -->
<div class="gate" id="gate">
  <div class="gate-card">
    <div class="gate-mark" id="gate-mark">BA</div>
    <h1 id="gate-title">Sign in</h1>
    <div class="sub" id="gate-sub">Olink Bank Assist — administration</div>
    <div class="err hidden" id="gate-err"></div>

    <div class="field">
      <label for="slug">Bank</label>
      <input id="slug" placeholder="e.g. demo" autocomplete="organization">
    </div>

    <div id="pw-mode">
      <div class="field">
        <label for="email">Email</label>
        <input id="email" type="email" autocomplete="username" placeholder="you@bank.et">
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" type="password" autocomplete="current-password">
      </div>
      <button class="btn wide" id="signin-btn">Sign in</button>
      <div style="margin-top:14px;text-align:center">
        <button class="linky" id="to-token">Use an admin token instead</button>
      </div>
    </div>

    <div id="token-mode" class="hidden">
      <div class="field">
        <label for="token">Admin token</label>
        <input id="token" type="password" autocomplete="off">
        <div class="meta" style="margin-top:6px">
          Recovery and automation access. It is not tied to a person, so
          everything done with it is recorded as <code>admin-token</code>.
        </div>
      </div>
      <button class="btn wide" id="token-btn">Continue</button>
      <div style="margin-top:14px;text-align:center">
        <button class="linky" id="to-pw">Sign in with email instead</button>
      </div>
    </div>
  </div>
</div>

<!-- -------------------------------------------------------------- shell -->
<div class="shell hidden" id="shell">
  <aside class="side">
    <div class="side-brand">
      <div class="side-mark" id="side-mark">BA</div>
      <div style="min-width:0">
        <div class="side-name" id="side-name">Bank Assist</div>
        <div class="side-sub">Assistant admin</div>
      </div>
    </div>
    <nav id="nav"></nav>
    <div class="side-foot">
      <!-- Only shown to someone who can actually take a call. Hidden entirely
           for everybody else rather than disabled: a control you may never use
           is clutter in the one part of the screen that is on every page. -->
      <button class="dutytoggle" id="duty" hidden aria-pressed="false">
        <span class="lamp" id="duty-lamp"></span>
        <span class="label" id="duty-text">On duty</span>
      </button>
      <button class="railtoggle" id="rail-toggle" title="Collapse or expand the sidebar">
        <span id="rail-glyph">‹‹</span><span class="label">Collapse</span>
      </button>
      <div class="who">
        <div class="avatar" id="who-avatar">?</div>
        <div style="min-width:0">
          <div class="n" id="who-name">—</div>
          <div class="r" id="who-role">—</div>
        </div>
      </div>
      <button class="navitem" id="signout"><span class="label">Sign out</span></button>
    </div>
  </aside>

  <div class="content">
    <div class="topbar">
      <h2 id="page-title">Dashboard</h2>
      <div class="spacer"></div>
      <span id="status"></span>
      <div class="tools">
        <span class="stamp" id="stamp" aria-live="polite"></span>
        <button class="iconbtn" id="refresh" title="Reload this page's data"
                aria-label="Reload this page's data"></button>
        <button class="qbtn hidden" id="queue-btn"
                title="Open the escalation queue">
          <span class="lbl">Queue</span><span class="cnt" id="queue-count">0</span>
        </button>
        <button class="iconbtn" id="theme-toggle" title="Switch between dark and light"
                aria-label="Switch between dark and light">
          <span id="theme-glyph">☾</span>
        </button>
      </div>
    </div>
    <main id="main"></main>
  </div>
</div>

<div class="callroom" id="callroom" role="dialog" aria-modal="true" aria-label="Live session">
  <div class="video">
    <div class="waiting" id="callWaiting">
      <div>
        <div class="av" id="callAv">·</div>
        <div class="lang" id="callLang"></div>
        <div class="msg" id="callMsg">Connecting…</div>
      </div>
    </div>
    <div class="self" id="callSelf" style="display:none"></div>
    <!-- A still lifted from the video already on screen, drawn into a canvas
         in this browser. It is never uploaded and never stored — the point is
         to read a card that is moving, not to keep a copy of it. -->
    <canvas class="frozen" id="callFrozen" style="display:none"></canvas>
    <button type="button" class="freeze" id="callFreeze" style="display:none">
      Freeze frame
    </button>
  </div>
  <div class="work">
    <h4>Conversation</h4>
    <div class="transcript" id="callTranscript"></div>
    <form class="composer2" id="callComposer">
      <input id="callSay" type="text" autocomplete="off" placeholder="Message the customer…">
      <button class="btn sm" type="submit">Send</button>
    </form>
    <div class="verify" id="callVerify"></div>
    <!-- The bank's approved wording, one search away while the teller is
         talking. No teller holds a hundred and sixty answers in their head,
         and improvising a fee or an eligibility rule is how a call becomes a
         complaint. Published only — a draft is half-written wording and
         reading it aloud is the harm draft status exists to prevent. -->
    <div class="answers" id="callAnswers">
      <h4>Approved answers</h4>
      <input id="ansQ" type="search" autocomplete="off"
             placeholder="Search the bank's approved answers…">
      <div class="ansList" id="ansList"></div>
    </div>
  </div>
  <div class="controls">
    <button type="button" id="cMic" title="Mute"></button>
    <button type="button" id="cCam" title="Camera"></button>
    <button type="button" id="cHang" class="hang" title="End session"></button>
  </div>
</div>

<script>
"use strict";

/* Which nav entries exist, what each needs, and where each person lands.
   The permission strings are the same ones require() checks server-side. This
   only decides what is OFFERED — hiding a button is a courtesy, never a
   control, and every route re-checks on the server. A tampered response can
   hide a link; it cannot grant anything. */
var PAGES = [
  { id: "dashboard", label: "Dashboard",     perm: "analytics.read",     load: loadDashboard },
  { id: "handoffs",  label: "Escalations",   perm: "handoffs.read",      load: loadHandoffs, badge: true },
  // Directly under Escalations, because it is the same work in a different
  // tense: the queue of people waiting NOW rather than the queue of people
  // to call back. A teller lives on this page all day.
  { id: "teller",    label: "Live queue",    perm: "sessions.read",      load: loadTellerQueue },
  { id: "convos",    label: "Conversations", perm: "conversations.read", load: loadConvos },
  { id: "docs",      label: "Knowledge Base",perm: "documents.read",     load: loadDocs },
  { id: "faq",       label: "Curated Answers", perm: "documents.read",   load: loadFaq },
  { id: "gaps",      label: "Content Gaps",  perm: "gaps.read",          load: loadGaps },
  { id: "audit",     label: "Audit log",     perm: "audit.read",         load: loadAudit },
  { id: "team",      label: "Team",          perm: "users.manage",       load: loadTeam },
  // Channels is its own destination rather than a tab inside Settings. Where
  // customers can reach you is a standing part of the product, not a
  // preference — and burying it meant the answer to "can we do WhatsApp" was
  // three clicks deep behind a gear icon.
  { id: "channels",  label: "Channels",      perm: "integrations.manage",load: loadChannels, kids: true },
  { id: "settings",  label: "Settings",      perm: "integrations.manage",load: loadSettings }
];

var ICONS = {
  dashboard: '<path d="M3 3h7v7H3zM14 3h7v4h-7zM14 10h7v11h-7zM3 13h7v8H3z"/>',
  handoffs:  '<path d="M21 11.5a8.4 8.4 0 0 1-9 8.4L3 21l1.1-4.6A8.4 8.4 0 1 1 21 11.5z"/>',
  convos:    '<path d="M8 10h8M8 14h5M21 12a9 9 0 1 1-3.2-6.9"/><circle cx="19" cy="5" r="2"/>',
  docs:      '<path d="M4 4h11l5 5v11H4z"/><path d="M15 4v5h5M8 13h8M8 17h5"/>',
  gaps:      '<circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5M11 8v3M11 14h.01"/>',
  audit:     '<path d="M4 4h11l5 5v11H4z"/><path d="M15 4v5h5"/><path d="M8 12l2.5 2.5L16 9"/>',
  teller:    '<path d="M15 10l5-3v10l-5-3z"/><rect x="3" y="6" width="12" height="12" rx="2"/>',
  team:      '<circle cx="9" cy="8" r="3.2"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0M17 11.2A3.2 3.2 0 1 0 17 5M18 20h3.5a5.5 5.5 0 0 0-3-4.9"/>',
  settings:  '<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-1.8-.3 1.6 1.6 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.6 1.6 0 0 0-1-1.500 1.6 1.6 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.6 1.6 0 0 0 .3-1.8 1.6 1.6 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.6 1.6 0 0 0 1.5-1 1.6 1.6 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.6 1.6 0 0 0 1.8.3H9a1.6 1.6 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.6 1.6 0 0 0 1 1.5 1.6 1.6 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.6 1.6 0 0 0-.3 1.8V9a1.6 1.6 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.6 1.6 0 0 0-1.5 1z"/>',
  channels:  '<path d="M4 6h9M4 12h16M4 18h6"/><circle cx="17" cy="6" r="2.2"/><circle cx="12" cy="18" r="2.2"/>',
  edit:      '<path d="M4 20h4L19 9a2.8 2.8 0 0 0-4-4L4 16z"/>',
  trash:     '<path d="M4 7h16M9 7V5h6v2M6 7l1 13h10l1-13"/>',
  refresh:   '<path d="M20 12a8 8 0 1 1-2.4-5.7M20 4v4h-4"/>',
  chevron:   '<path d="M9 5l7 7-7 7"/>'
};
function icon(name, size) {
  return '<svg width="' + (size || 17) + '" height="' + (size || 17) + '" viewBox="0 0 24 24"' +
    ' fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"' +
    ' stroke-linejoin="round">' + (ICONS[name] || "") + "</svg>";
}

var state = {
  slug: localStorage.getItem("ba_slug") || "",
  token: "",          // break-glass only; never persisted (see signInWithToken)
  me: null,           // { email, role, permissions[] } — null on the token path
  page: null,
  days: 30,
  hstatus: "open",
  openHandoffs: null,
  channels: [],       // the catalogue, fetched once — drives the rail sub-nav
  channel: null,      // which channel's page is open, if any
  railOpen: localStorage.getItem("ba_chan_open") !== "0",
  loadedAt: null      // when the open page last fetched, for the topbar stamp
};

/* ------------------------------------------------------------- plumbing */
function $(id) { return document.getElementById(id); }
function esc(s) { var d = document.createElement("div"); d.textContent = s == null ? "" : s; return d.innerHTML; }
function setStatus(t) { $("status").textContent = t || ""; }

function api(path, opts) {
  opts = opts || {};
  opts.credentials = "same-origin";           // carries the session cookie
  if (state.token) {
    opts.headers = opts.headers || {};
    opts.headers["X-Admin-Token"] = state.token;
  }
  return fetch("/admin/api/" + encodeURIComponent(state.slug) + path, opts).then(function (r) {
    if (r.status === 401) { signedOut("Your session has ended. Please sign in again."); throw new Error("Signed out"); }
    if (r.status === 403) { throw new Error("You do not have permission to do that."); }
    // FastAPI errors are {"detail": "..."} — surface the sentence, not the
    // envelope. This showed up on the teller's verification bar, where a
    // refusal names exactly which check is missing and the teller reads it
    // mid-call with a customer waiting; wrapping that one useful sentence in
    // JSON punctuation is the worst place to make someone parse a payload.
    // Falls back to the raw body, so a non-JSON error (a proxy's HTML 502)
    // still says something rather than nothing.
    if (!r.ok) {
      return r.text().then(function (t) {
        var msg = t;
        try {
          var parsed = JSON.parse(t);
          if (parsed && typeof parsed.detail === "string") msg = parsed.detail;
        } catch (e) { /* not JSON — keep the body */ }
        throw new Error(msg || ("HTTP " + r.status));
      });
    }
    return r.status === 204 ? null : r.json();
  });
}

/* The tenant's own colour, on the sign-in screen as well as inside. Public
   endpoint, so it works before anyone has authenticated. */
function applyBrand(slug) {
  if (!slug) return Promise.resolve(null);
  return fetch("/banks/" + encodeURIComponent(slug) + "/public").then(function (r) {
    return r.ok ? r.json() : null;
  }).then(function (b) {
    if (!b) return null;
    if (b.primary_color) document.documentElement.style.setProperty("--brand", b.primary_color);
    var clean = (b.name || slug).replace(/[^A-Za-zሀ-፿ ]/g, "").trim();
    // "CBE" is already a mark — first-letter-of-each-word would show "C".
    var initials = /^[A-Z]{2,4}$/.test(clean) ? clean
      : clean.split(/\s+/).filter(Boolean).slice(0, 2)
          .map(function (w) { return w[0]; }).join("").toUpperCase();
    [$("gate-mark"), $("side-mark")].forEach(function (el) {
      if (b.logo_url) {
        // Rendered rather than described: a bank's mark is the first thing it
        // looks for, and initials on a coloured tile read as a placeholder.
        //
        // With a fallback, because this is a remote image on someone else's
        // host. If it 404s, moves, or is blocked, a broken-image icon in the
        // brand slot looks like the product is broken; the initials do not.
        // The widget already did this and the panel did not.
        el.innerHTML = "";
        el.classList.add("haslogo");
        var img = document.createElement("img");
        img.alt = b.name || slug;
        img.onerror = function () {
          el.classList.remove("haslogo");
          el.textContent = initials || "BA";
        };
        // Measured, not guessed. A bank sends either a compact mark or a full
        // lockup under the same field, and the two need different layouts —
        // but only the image itself knows which it is. Set on the container
        // so the CSS can also drop the wordmark beside a logo that already
        // contains one.
        img.onload = function () {
          if (!img.naturalHeight) return;
          var wide = img.naturalWidth / img.naturalHeight >= 2;
          var host = el.closest(".side-brand") || el;
          host.setAttribute("data-logo", wide ? "wide" : "mark");
        };
        img.src = b.logo_url;
        el.appendChild(img);
      } else {
        el.textContent = initials || "BA";
        el.classList.remove("haslogo");
      }
    });
    $("side-name").textContent = b.name || slug;
    // Long names ellipsize in a 236px rail — "Commercial Bank ..." — so the
    // full one stays reachable on hover rather than simply being lost.
    $("side-name").title = b.name || slug;
    $("gate-title").textContent = "Sign in";
    $("gate-sub").textContent = b.name ? b.name + " — assistant administration" : "Olink Bank Assist";
    return b;
  }).catch(function () { return null; });
}

/* ---------------------------------------------------------------- auth */
function gateError(msg) {
  var el = $("gate-err");
  if (!msg) { el.classList.add("hidden"); return; }
  el.textContent = msg; el.classList.remove("hidden");
}

function signInWithPassword() {
  var slug = $("slug").value.trim();
  var email = $("email").value.trim();
  var pw = $("password").value;
  if (!slug || !email || !pw) { gateError("Bank, email and password are all required."); return; }
  gateError("");
  $("signin-btn").disabled = true;
  fetch("/admin/api/" + encodeURIComponent(slug) + "/login", {
    method: "POST", credentials: "same-origin",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ email: email, password: pw })
  }).then(function (r) {
    if (r.status === 429) throw new Error("Too many attempts. Please wait a moment.");
    // One message for every cause, matching the server, which answers an
    // unknown email and a wrong password identically so the screen cannot be
    // used to find out who has an account here.
    if (!r.ok) throw new Error("That email and password did not match.");
    return r.json();
  }).then(function (me) {
    state.slug = slug; state.token = ""; state.me = me;
    localStorage.setItem("ba_slug", slug);
    $("password").value = "";
    enterApp();
  }).catch(function (e) { gateError(e.message); })
    .then(function () { $("signin-btn").disabled = false; });
}

function signInWithToken() {
  var slug = $("slug").value.trim();
  var token = $("token").value.trim();
  if (!slug || !token) { gateError("Bank and token are both required."); return; }
  gateError("");
  state.slug = slug; state.token = token; state.me = null;
  localStorage.setItem("ba_slug", slug);
  // Deliberately NOT stored. The previous panel kept the tenant's admin token
  // in localStorage, where any script on the page could read it and where it
  // outlived the tab. It now lives in memory for this tab only — which is also
  // the honest cost of a break-glass credential, and the reason to sign in
  // with a password instead.
  api("/analytics?days=1").then(function () {
    enterApp();
  }).catch(function () {
    state.token = "";
    gateError("That token was not accepted for this bank.");
  });
}

function signedOut(msg) {
  // Before anything else: stop beating. A heartbeat that outlives the session
  // would keep 401ing every thirty seconds forever, and on the expired-session
  // path it would re-enter signedOut() from a timer nobody can see.
  stopDuty();
  state.token = ""; state.me = null; state.page = null;
  $("shell").classList.add("hidden");
  $("gate").classList.remove("hidden");
  gateError(msg || "");
}

function signOut() {
  fetch("/admin/api/" + encodeURIComponent(state.slug) + "/logout",
    { method: "POST", credentials: "same-origin" })
    .catch(function () {})
    .then(function () { signedOut("You are signed out."); });
}

function can(perm) {
  // The break-glass token holds everything, exactly as the server treats it.
  if (!state.me) return true;
  return (state.me.permissions || []).indexOf(perm) > -1;
}

function enterApp() {
  $("gate").classList.add("hidden");
  $("shell").classList.remove("hidden");
  applyBrand(state.slug);

  if (state.me) {
    $("who-name").textContent = state.me.display_name || state.me.email;
    $("who-role").textContent = state.me.role || "";
    var src = state.me.display_name || state.me.email || "?";
    $("who-avatar").textContent = src.replace(/[^A-Za-z]/g, "").slice(0, 2).toUpperCase() || "?";
  } else {
    $("who-name").textContent = "Admin token";
    $("who-role").textContent = "break-glass access";
    $("who-avatar").textContent = "•";
  }
  renderNav();

  var landing = landingPage();
  if (!landing) { $("main").innerHTML = '<div class="empty">This account has no permissions yet. Ask an administrator.</div>'; return; }
  go(landing);
  refreshBadge();
  loadChannelNav();
  startDuty();
}

/* ------------------------------------------------------------------ on duty
 *
 * Whether a customer is offered a live banker used to depend on a teller
 * keeping the Live queue page open, because the heartbeat lived inside that
 * page's poll. Opening Reports took the bank off the air, and nothing said so.
 * That is a product-level switch hidden inside a browser tab.
 *
 * Presence is now a declaration with a heartbeat behind it, running from the
 * shell on every page. Two states, both explicit:
 *
 *   ON  — heartbeat every HEARTBEAT_MS; customers see the Connect button.
 *   OFF — cleared server-side immediately; the button goes away.
 *
 * The choice is remembered per browser so a reload does not silently put
 * somebody back on the air, and it is confirmed against the server on sign-in
 * so a second device shows the truth rather than its own default.
 */
var DUTY_KEY = "ba_on_duty";
var HEARTBEAT_MS = 30000;   // corrected from the server's own heartbeat_seconds
var dutyTimer = null;
var dutyOn = false;

function dutyStored() {
  // Default ON for anyone who can serve. Signing in to the console IS turning
  // up for work, and the alternative default has a failure mode we have
  // already lived through: everybody appears offline, no button appears
  // anywhere, and nothing on screen explains why. Off is one click away and
  // is remembered.
  try {
    return localStorage.getItem(DUTY_KEY) !== "0";
  } catch (e) {
    return true;   // private mode, or storage denied. Being on is the useful one.
  }
}

function beat() {
  // Fire-and-forget. A dropped beat costs at most a slice of the staleness
  // window, and surfacing a red banner for one failed background request
  // would train people to ignore banners.
  api("/teller/presence", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ on_duty: dutyOn })
  })
    .then(function (r) {
      if (r && r.heartbeat_seconds) {
        // The server owns the interval; it is the half that has to match the
        // staleness window. If they ever disagree, the server wins.
        var ms = r.heartbeat_seconds * 1000;
        if (ms !== HEARTBEAT_MS) { HEARTBEAT_MS = ms; scheduleBeat(); }
      }
    })
    .catch(function () {});
}

function scheduleBeat() {
  if (dutyTimer) { clearInterval(dutyTimer); dutyTimer = null; }
  if (dutyOn) dutyTimer = setInterval(beat, HEARTBEAT_MS);
}

function paintDuty() {
  var b = $("duty");
  b.setAttribute("aria-pressed", dutyOn ? "true" : "false");
  $("duty-text").textContent = dutyOn ? "On duty" : "Off duty";
  b.title = dutyOn
    ? "Customers can ask to speak to you. Click to stop taking calls."
    : "Customers are not offered a live session with you. Click to start taking calls.";
}

function setDuty(on) {
  dutyOn = on;
  try { localStorage.setItem(DUTY_KEY, on ? "1" : "0"); } catch (e) {}
  paintDuty();
  beat();          // immediately, in both directions — going off duty must
  scheduleBeat();  // take effect now, not at the next tick.
  // The Live queue strip states whether customers can reach anyone, which has
  // just changed. Repaint it rather than leave a stale sentence up.
  if (state.page === "teller") loadTellerQueue();
}

function startDuty() {
  if (!can("teller.serve")) return;   // stays hidden for everyone else
  var b = $("duty");
  b.hidden = false;
  b.onclick = function () { setDuty(!dutyOn); };
  dutyOn = dutyStored();
  paintDuty();
  beat();
  scheduleBeat();
}

function stopDuty() {
  if (dutyTimer) { clearInterval(dutyTimer); dutyTimer = null; }
  dutyOn = false;
  $("duty").hidden = true;
}

/* Where this person starts.
 *
 * Keyed on the job, not on nav order. Both built-in roles can read analytics,
 * so "first page they are allowed to open" put an operator on a wall of
 * numbers they cannot act on while eight escalations waited one click away —
 * which is what this did until it was watched rather than reasoned about.
 *
 * Someone who can change what the assistant says, wire up an integration or
 * add a colleague is running the thing, and lands on the overview. Everyone
 * else who works the queue lands in the queue. A narrowed custom role that
 * matches neither still falls through to whatever it can actually open, so
 * nobody arrives at a blank screen.
 */
var MANAGEMENT = ["documents.write", "integrations.manage", "users.manage"];

function landingPage() {
  var manages = MANAGEMENT.some(can);
  var order = manages
    ? ["dashboard", "handoffs"]
    : ["handoffs", "dashboard"];
  var allowed = PAGES.filter(function (p) { return can(p.perm); });
  for (var i = 0; i < order.length; i++) {
    var hit = allowed.filter(function (p) { return p.id === order[i]; })[0];
    if (hit) return hit.id;
  }
  return allowed.length ? allowed[0].id : null;
}

function renderNav() {
  $("nav").innerHTML = PAGES.filter(function (p) { return can(p.perm); }).map(function (p) {
    var item = '<button class="navitem" id="nav-' + p.id + '" data-page="' + p.id + '">' +
      icon(p.id) + '<span class="label">' + esc(p.label) + "</span>" +
      (p.badge ? '<span class="badge hidden" id="badge-' + p.id + '"></span>' : "") +
      "</button>";
    // Only Channels nests today, and only once its catalogue has arrived —
    // rendering an empty drawer before the fetch resolves would flash a
    // disclosure arrow that opens onto nothing.
    if (!p.kids || !state.channels.length) return item;
    return '<div class="navrow">' + item +
      '<button class="disclose" id="disclose-' + p.id + '" aria-expanded="' +
      (state.railOpen ? "true" : "false") + '" aria-controls="sub-' + p.id +
      '" aria-label="Show or hide the channel list">' + icon("chevron", 14) + "</button></div>" +
      '<div class="subnav" id="sub-' + p.id + '"' + (state.railOpen ? "" : " hidden") + ">" +
      state.channels.map(function (c) {
        return '<button class="subitem' + (c.status === "live" ? "" : " idle") +
          '" data-channel="' + esc(c.key) + '">' +
          '<span class="dot" style="background:' +
          seriesColor(CHANNEL_SLOT[c.key]) + '"></span>' +
          '<span class="label">' + esc(c.name) + "</span></button>";
      }).join("") + "</div>";
  }).join("");

  Array.prototype.forEach.call($("nav").querySelectorAll(".navitem"), function (b) {
    b.onclick = function () {
      // The parent opens the overview, never a channel left selected from last
      // time — clicking "Channels" and landing on Viber would be a surprise.
      if (b.getAttribute("data-page") === "channels") state.channel = null;
      go(b.getAttribute("data-page"));
    };
  });
  Array.prototype.forEach.call($("nav").querySelectorAll(".subitem"), function (b) {
    b.onclick = function () {
      state.channel = b.getAttribute("data-channel");
      go("channels");
    };
  });
  var d = $("disclose-channels");
  if (d) d.onclick = function () {
    state.railOpen = !state.railOpen;
    localStorage.setItem("ba_chan_open", state.railOpen ? "1" : "0");
