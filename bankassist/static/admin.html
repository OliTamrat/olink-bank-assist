    d.setAttribute("aria-expanded", state.railOpen ? "true" : "false");
    $("sub-channels").hidden = !state.railOpen;
  };
  markNav();
}

/* Which rail entries read as current. Split out of go() because the sub-nav is
   re-rendered whenever the catalogue changes, and the highlight has to survive
   that without a second navigation. */
function markNav() {
  Array.prototype.forEach.call($("nav").querySelectorAll(".navitem"), function (b) {
    b.classList.toggle("on", b.getAttribute("data-page") === state.page);
  });
  Array.prototype.forEach.call($("nav").querySelectorAll(".subitem"), function (b) {
    b.classList.toggle("on",
      state.page === "channels" && b.getAttribute("data-channel") === state.channel);
  });
}

/* The catalogue, fetched once at sign-in so the rail can list channels.
   Failure is silent on purpose: the rail simply does not nest, and every
   channel is still reachable from the Channels page itself. */
function loadChannelNav() {
  if (!can("integrations.manage")) return;
  api("/integrations").then(function (cfg) {
    state.channels = cfg.channels || [];
    renderNav();
  }).catch(function () {});
}

function go(id) {
  var page = PAGES.filter(function (p) { return p.id === id; })[0];
  if (!page || !can(page.perm)) return;
  state.page = id;
  markNav();
  var chan = state.page === "channels" && state.channel
    ? channelByKey(state.channel) : null;
  $("page-title").textContent = chan ? chan.name : page.label;
  $("main").innerHTML = '<div class="empty">Loading…</div>';
  setStatus("");
  state.loadedAt = Date.now();
  renderStamp();
  page.load();
}

function channelByKey(key) {
  return state.channels.filter(function (c) { return c.key === key; })[0] || null;
}

/* How old the numbers on screen are.
 *
 * Rounded to the minute and only shown once a minute has passed: a counter
 * ticking "3s ago … 4s ago" is motion with no information in it, and it draws
 * the eye away from the figures it is describing. */
function renderStamp() {
  var el = $("stamp");
  if (!el) return;
  if (!state.loadedAt) { el.textContent = ""; return; }
  var mins = Math.floor((Date.now() - state.loadedAt) / 60000);
  el.textContent = mins < 1 ? "Up to date"
    : (mins < 60 ? "Updated " + mins + "m ago"
                 : "Updated " + Math.floor(mins / 60) + "h ago");
}

/* The queue count on the rail, so waiting work is visible from any page. */
function refreshBadge() {
  if (!can("handoffs.read")) return;
  api("/handoffs?status=open").then(function (rows) {
    state.openHandoffs = rows.length;
    var el = $("badge-handoffs");
    if (el) {
      el.textContent = rows.length;
      el.classList.toggle("hidden", rows.length === 0);
    }
    // The same number in the topbar, which survives the rail being collapsed
    // and is on screen while an operator is working inside a conversation.
    var q = $("queue-btn");
    if (!q) return;
    q.classList.remove("hidden");
    q.classList.toggle("hot", rows.length > 0);
    $("queue-count").textContent = rows.length;
    q.setAttribute("aria-label",
      rows.length ? rows.length + " escalations waiting — open the queue"
                  : "Escalation queue — nothing waiting");
  }).catch(function () {});
}

/* ------------------------------------------------------------ dashboard */
/* The set the SERVER computes every rate over (agent.SUBSTANTIVE). Charted
   against a different set, the bars would be drawn over a denominator that
   does not contain them — percentages wrong rather than merely incomplete.
   Used by both the chart and the CSV export, so there is one copy to drift. */
var SUBSTANTIVE = ["account_blocked", "answered", "comparison", "complaint",
                   "general_guidance", "human_request", "unanswered"];

function pct(x) { return x == null ? "—" : Math.round(x * 1000) / 10 + "%"; }
function num(n) { return (n == null ? 0 : n).toLocaleString(); }

/* now vs then, stated in the words of the comparison rather than as a bare
   arrow. Returns "" when there is no previous window, which is the honest
   answer for an all-time view or a tenant's first month. */
function delta(now, then, asRate) {
  if (then == null || now == null) return "";
  if (asRate) {
    var pts = Math.round((now - then) * 1000) / 10;
    if (Math.abs(pts) < 0.1) return '<span class="delta flat">no change on previous period</span>';
    return '<span class="delta ' + (pts > 0 ? "up" : "down") + '">' +
      (pts > 0 ? "▲ " : "▼ ") + Math.abs(pts) + " pts vs previous period</span>";
  }
  if (!then) return "";
  var chg = Math.round(((now - then) / then) * 1000) / 10;
  if (Math.abs(chg) < 0.1) return '<span class="delta flat">no change on previous period</span>';
  return '<span class="delta ' + (chg > 0 ? "up" : "down") + '">' +
    (chg > 0 ? "▲ " : "▼ ") + Math.abs(chg) + "% vs previous period</span>";
}

function kpi(label, value, sub, isNone, iconName, deltaHtml, drill) {
  return '<div class="kpi' + (drill ? " drill" : "") + '"' +
    (drill ? ' data-drill="' + drill + '" role="button" tabindex="0"' : "") + ">" +
    '<div class="txt"><div class="k">' + esc(label) + "</div>" +
    '<div class="v' + (isNone ? " none" : "") + '">' + value + "</div>" +
    (sub ? '<div class="sub">' + esc(sub) + "</div>" : "") +
    (deltaHtml || "") + "</div>" +
    '<div class="ico" aria-hidden="true">' + icon(iconName || "dashboard", 17) + "</div>" +
    "</div>";
}

function bars(rows, total, labeller) {
  if (!rows.length) return '<div class="empty">Nothing yet.</div>';
  // Wrapped so the group can centre itself in a card the row has stretched.
  // Left flush to the top, a short list in a tall card reads as an unfinished
  // panel rather than a deliberate one.
  return '<div class="barwrap">' + rows.map(function (r) {
    var pair = labeller(r);
    var share = total ? r.count / total : 0;
    // pair[2] is a destination. Rows with nothing behind them — a language
    // nobody has used — stay inert rather than opening an empty list.
    var drill = pair[2] && r.count ? pair[2] : null;
    return '<div class="bar' + (drill ? " drill" : "") + '"' +
      (drill ? ' data-drill="' + drill + '" role="button" tabindex="0"' : "") + ">" +
      "<span>" + esc(pair[0]) + "</span>" +
      '<span class="track"><span class="fill' + (pair[1] ? " " + pair[1] : "") +
      '" style="width:' + (share * 100).toFixed(1) + '%"></span></span>' +
      '<span class="n">' + r.count + "</span></div>";
  }).join("") + "</div>";
}

/* --------------------------------------------------- series colour by entity
 *
 * A slot per language and per channel, fixed in code. Two reasons it is a map
 * and not `palette[index]`:
 *
 * 1. Colour must follow the ENTITY, not its rank. Sorted-by-volume indexing
 *    means Amharic is blue today and orange on the day English overtakes it,
 *    and a reader who has learned the chart is then quietly misled by it.
 * 2. The same colour then means the same thing in the donut, the share bar and
 *    the channel list, because all three ask this one function.
 *
 * Slots run 1..8 in the documented order; the maps are deliberately small
 * enough to read. Anything unmapped falls back to neutral rather than picking
 * a colour at random — an unknown series is better grey than miscoloured.
 */
var LANG_SLOT = { en: 1, am: 2, om: 3, ti: 4, so: 5 };
var CHANNEL_SLOT = {
  web: 1, telegram: 2, whatsapp: 3, messenger: 4,
  instagram: 5, viber: 6, sms: 7
};
function seriesColor(slot) {
  return slot ? "var(--series-" + slot + ")" : "var(--faint)";
}

/* A donut of shares.
 *
 * Draws ONLY when at least two categories carry traffic. Below that a ring is
 * a picture of nothing — a full circle labelled 100% takes a card's worth of
 * space to say what one sentence says better — so one category degrades to
 * that sentence and none degrades to an empty state. The coverage list still
 * renders underneath in every case, because "Tigrinya: 0" is a fact worth
 * showing: it is the difference between unused and unsupported.
 *
 * `rows` are {label, count, slot, drill}. Order controls slice order; `slot`
 * controls colour, so the two can never drift.
 */
function donut(rows, opts) {
  opts = opts || {};
  var total = rows.reduce(function (t, r) { return t + r.count; }, 0);
  var live = rows.filter(function (r) { return r.count; });

  function coverage() {
    return '<div class="legend">' + rows.map(function (row) {
      return "<" + (row.drill ? "button" : "div") + ' class="row' +
        (row.drill ? " clickable" : "") + (row.count ? "" : " zero") + '"' +
        (row.drill ? ' data-drill="' + row.drill + '" type="button"' : "") + ">" +
        '<span class="sw" style="background:' +
        (row.count ? seriesColor(row.slot) : "var(--line)") +
        '"></span><span class="lbl">' + esc(row.label) + "</span>" +
        '<span class="val">' + row.count +
        (total ? " · " + Math.round((row.count / total) * 100) + "%" : "") + "</span>" +
        "</" + (row.drill ? "button" : "div") + ">";
    }).join("") + "</div>";
  }

  if (!total) {
    return '<div class="empty">' + esc(opts.empty || "Nothing recorded yet in this window.") +
      "</div>" + coverage();
  }
  if (live.length === 1) {
    // The stat-tile case: one value, stated. Not a one-slice pie.
    return '<div class="oneline">All <b>' + num(total) + "</b> " +
      esc(opts.unit || "conversations") + " " + esc(opts.verb || "were in") +
      " <b>" + esc(live[0].label) + "</b>.</div>" + coverage();
  }

  var size = 132, r = 52, cx = size / 2, cy = size / 2, thick = 20;
  // Two slices in adjacent hues that physically touch read as one shape with a
  // seam. A hairline of surface between them is what makes a boundary a
  // boundary, and it is doing accessibility work as well as cosmetic: the
  // closest pair in this palette is the pair most likely to end up adjacent.
  var GAP = 0.045;                        // radians — about 2px at this radius
  var angle = -Math.PI / 2;
  var arcs = rows.map(function (row) {
    if (!row.count) return "";
    var sweep = (row.count / total) * Math.PI * 2;
    var from = angle, to = angle + sweep;
    angle = to;
    // A sliver narrower than the gap would be eaten by it. Better a slightly
    // tight slice than a 1% slice that disappears altogether.
    if (sweep > GAP * 2.5) { from += GAP / 2; to -= GAP / 2; }
    var x1 = cx + r * Math.cos(from), y1 = cy + r * Math.sin(from);
    var x2 = cx + r * Math.cos(to), y2 = cy + r * Math.sin(to);
    return '<path d="M' + x1.toFixed(2) + " " + y1.toFixed(2) +
      " A" + r + " " + r + " 0 " + (to - from > Math.PI ? 1 : 0) + " 1 " +
      x2.toFixed(2) + " " + y2.toFixed(2) + '" fill="none" stroke="' +
      seriesColor(row.slot) +
      '" stroke-width="' + thick + '" stroke-linecap="butt"' +
      (row.drill ? ' class="clickable" data-drill="' + row.drill + '"' : "") +
      "><title>" + esc(row.label + ": " + row.count) + "</title></path>";
  }).join("");

  return '<div class="donutwrap"><svg class="donut" width="' + size + '" height="' + size +
    '" viewBox="0 0 ' + size + " " + size + '" role="img" aria-label="' +
    esc(opts.label || "breakdown") + '">' + arcs +
    '<text class="hole" x="' + cx + '" y="' + (cy + 2) + '" text-anchor="middle">' +
    num(total) + "</text>" +
    '<text class="holesub" x="' + cx + '" y="' + (cy + 15) + '" text-anchor="middle">' +
    esc((opts.unit || "TOTAL").toUpperCase()) + "</text></svg>" +
    coverage() + "</div>";
}

/* The channel panel: the catalogue, with traffic folded in.
 *
 * Deliberately not a donut. A share chart can only describe channels that
 * already have customers on them, and the fact a bank is buying on is the one
 * such a chart structurally cannot express — that WhatsApp is a business
 * decision away, not a missing feature. So every channel is a row: the live
 * ones carry their volume and open the conversations behind it, and the rest
 * carry what it would take to switch them on.
 *
 * The share bar above only appears at two or more live channels, for the same
 * reason the donut does.
 */
var CHANNEL_PILL = {
  // Live but quiet is not the same as never switched on, and "planned" is not
  // a promise — it is "the adapter is small, the account paperwork is not".
  live: ["on", "Live"],
  available: ["next", "Ready to connect"],
  planned: ["", "Needs setup"]
};
function channelPanel(rows, opts) {
  opts = opts || {};
  var total = rows.reduce(function (t, r) { return t + r.count; }, 0);
  var live = rows.filter(function (r) { return r.count; });

  var head = "";
  if (!total) {
    head = '<div class="empty">No conversations yet in this window.</div>';
  } else if (live.length === 1) {
    head = '<div class="oneline">All <b>' + num(total) +
      "</b> conversations came from <b>" + esc(live[0].name) + "</b>.</div>";
  } else {
    head = '<div class="sharebar" role="img" aria-label="Share of conversations by channel">' +
      live.map(function (row) {
        return '<span style="flex:' + row.count + ";background:" +
          seriesColor(CHANNEL_SLOT[row.channel]) + '" title="' +
          esc(row.name + ": " + row.count) + '"></span>';
      }).join("") + "</div>";
  }

  return head + '<div class="chanlist">' + rows.map(function (row) {
    var pill = CHANNEL_PILL[row.status] || ["", row.status];
    // A channel with traffic opens that traffic; one without opens the page
    // where it gets switched on. "Needs setup" as a label with nowhere to go
    // is the reader being told about a job and not shown where to do it.
    var drill = row.count
      ? (opts.canRead ? "convos:channel=" + row.channel : null)
      : (opts.canSetup ? "settings" : null);
    var tag = drill ? "button" : "div";
    return "<" + tag + ' class="chan' + (row.count ? "" : " idle") +
      (drill ? " clickable" : "") + '"' +
      (drill ? ' data-drill="' + drill + '" type="button"' : "") + ">" +
      '<span class="dot" style="background:' +
      seriesColor(CHANNEL_SLOT[row.channel]) + '"></span>' +
      '<span class="cname">' + esc(row.name) + "</span>" +
      (row.count
        ? '<span class="n">' + num(row.count) + "</span>"
        : '<span class="pill' + (pill[0] ? " " + pill[0] : "") + '">' +
          esc(pill[1]) + "</span>") +
      "</" + tag + ">";
  }).join("") + "</div>";
}

/* A real series from the analytics endpoint, with empty days present as zero.
   Drawn as inline SVG: no chart library, no CDN, and it prints. */
function sparkArea(daily) {
  if (!daily || daily.length < 2) return '<div class="empty">Not enough days yet to draw a trend.</div>';
  var w = 640, h = 224, padL = 34, padB = 22, padT = 10;
  var max = Math.max.apply(null, daily.map(function (d) { return d.conversations; }));
  var top = Math.max(max, 1);
  var iw = w - padL - 8, ih = h - padB - padT;
  var pts = daily.map(function (d, i) {
    var x = padL + (daily.length === 1 ? iw / 2 : (i / (daily.length - 1)) * iw);
    var y = padT + ih - (d.conversations / top) * ih;
    return [x, y];
  });
  var line = pts.map(function (p, i) { return (i ? "L" : "M") + p[0].toFixed(1) + " " + p[1].toFixed(1); }).join(" ");
  var area = line + " L" + pts[pts.length - 1][0].toFixed(1) + " " + (padT + ih) +
             " L" + pts[0][0].toFixed(1) + " " + (padT + ih) + " Z";
  var ticks = [0, 0.5, 1].map(function (f) {
    var y = padT + ih - f * ih;
    return '<line class="gl" x1="' + padL + '" y1="' + y.toFixed(1) + '" x2="' + (w - 8) + '" y2="' + y.toFixed(1) + '"/>' +
      '<text x="' + (padL - 6) + '" y="' + (y + 3).toFixed(1) + '" text-anchor="end">' + Math.round(f * top) + "</text>";
  }).join("");
  function dayLabel(iso) { return iso.slice(5).replace("-", "/"); }
  // The first and last labels are anchored to the ends of the plot, not
  // centred on their points. Centred, half of each sits outside the viewBox
  // and is clipped — the final label rendered as "08/0", which reads as a
  // date rather than as a truncation, so it is the kind of wrong that gets
  // believed. Only visible by looking at it; no assertion would have caught it.
  var idx = [0, Math.floor(daily.length / 2), daily.length - 1]
    .filter(function (v, i, a) { return a.indexOf(v) === i; });
  var labels = idx.map(function (i) {
    var anchor = i === 0 ? "start" : (i === daily.length - 1 ? "end" : "middle");
    return '<text x="' + pts[i][0].toFixed(1) + '" y="' + (h - 6) + '" text-anchor="' + anchor + '">' +
      dayLabel(daily[i].date) + "</text>";
  }).join("");
  // No preserveAspectRatio="none". Stretching the viewBox to fill the panel
  // also stretches the glyphs and the stroke, which looks like a rendering
  // fault rather than a design. Scaling uniformly costs a few pixels of side
  // margin at unusual widths and keeps the type honest.
  return '<div class="chartwrap"><svg class="chart" viewBox="0 0 ' + w + " " + h +
    '" role="img" aria-label="Conversations per day">' +
    '<defs><linearGradient id="brandfade" x1="0" x2="0" y1="0" y2="1">' +
    '<stop offset="0%" stop-color="var(--brand)" stop-opacity="0.22"/>' +
    '<stop offset="100%" stop-color="var(--brand)" stop-opacity="0"/></linearGradient></defs>' +
    ticks + '<path class="area" d="' + area + '"/><path class="line" d="' + line + '"/>' +
    labels + "</svg></div>";
}

/* Why an escalation was filed, written for a bank rather than for us. The
   queue rendered these raw — a card headed "human_request" — which is the
   same failure as an unlabelled outcome in a field nothing was checking.
   tests/test_admin_labels.py now pins this against agent.HANDOFF_REASONS. */
var REASON_LABEL = {
  complaint: "Complaint",
  human_requested: "Asked for a person",
  unanswered_question: "No answer in your content",
  answered_from_general_knowledge: "Answered from general knowledge"
};

/* How each outcome is written for a bank. Every key here is emitted by the
   agent and every outcome the agent emits appears here — tests/test_admin_labels.py
   fails on either gap, because an unlabelled outcome renders to a bank as its
   raw internal key. */
function greeting() {
  var h = new Date().getHours();
  return h < 12 ? "Good morning" : (h < 17 ? "Good afternoon" : "Good evening");
}

/* Hover readout on the trend line. The chart is drawn in viewBox units and
   scaled by CSS, so the pointer's page position has to be mapped back through
   the rendered box rather than assumed to match — otherwise the tooltip
   tracks correctly only at one window width. */
function wireChartTip(daily) {
  var svg = document.querySelector(".chart");
  if (!svg || !daily || daily.length < 2) return;
  var wrap = svg.parentNode;   // the .chartwrap the chart renders inside
  var tip = document.createElement("div");
  tip.className = "tip";
  wrap.style.position = "relative";
  wrap.appendChild(tip);

  svg.addEventListener("mousemove", function (ev) {
    var box = svg.getBoundingClientRect();
    var frac = (ev.clientX - box.left) / box.width;
    var i = Math.round(frac * (daily.length - 1));
    if (i < 0) i = 0;
    if (i > daily.length - 1) i = daily.length - 1;
    var d = daily[i];
    tip.innerHTML = '<div class="d">' + esc(new Date(d.date + "T00:00:00").toDateString()) +
      "</div><strong>" + d.conversations + " conversation" +
      (d.conversations === 1 ? "" : "s") + "</strong>";
    tip.style.left = ((i / (daily.length - 1)) * box.width) + "px";
    tip.style.top = (box.height * 0.5) + "px";
    tip.classList.add("on");
  });
  svg.addEventListener("mouseleave", function () { tip.classList.remove("on"); });
}

function ago(iso) {
  var mins = Math.round((Date.now() - new Date(iso).getTime()) / 60000);
  if (mins < 1) return "just now";
  if (mins < 60) return mins + " min ago";
  var hrs = Math.round(mins / 60);
  if (hrs < 24) return hrs + " h ago";
  return Math.round(hrs / 24) + " d ago";
}

};

function csvCell(v) {
  var s = v == null ? "" : String(v);
  // A leading =, +, - or @ makes a spreadsheet treat the cell as a formula.
  if (/^[=+\-@]/.test(s)) s = "'" + s;
  return '"' + s.replace(/"/g, '""') + '"';
}

function exportAnalytics() {
  var a = state.analytics;
  if (!a) return;
  var lines = [["Section", "Item", "Count", "Share"].join(",")];
  function add(section, item, count, share) { lines.push([section, item, count, share].map(csvCell).join(",")); }
  add("Summary", "Conversations", a.conversations, "");
  add("Summary", "Questions asked", a.substantive_questions, "");
  add("Summary", "Resolved without a person", a.resolved_without_a_person, pct(a.deflection_rate));
  add("Summary", "Answered from own content", a.answered_from_own_content, pct(a.own_content_rate));
  a.outcomes.forEach(function (r) {
    add("Outcomes", OUTCOME_LABEL[r.outcome] || r.outcome, r.count,
        a.substantive_questions && SUBSTANTIVE.indexOf(r.outcome) > -1
          ? pct(r.count / a.substantive_questions) : "");
  });
  a.daily.forEach(function (d) { add("Conversations per day", d.date, d.conversations, ""); });
  a.languages.forEach(function (r) { add("Languages", r.name || r.language, r.count, ""); });
  // The readable name, not the key — this file gets pasted into a deck.
  a.channels.forEach(function (r) { add("Channels", r.name || r.channel, r.count, ""); });
  a.top_topics.forEach(function (t) { add("Most asked", t.example, t.count, ""); });
  add("Escalations", "Open", a.handoffs.open, "");
  add("Escalations", "Closed", a.handoffs.closed, "");
  download(a.bank_name.replace(/\s+/g, "-").toLowerCase() + "-report.csv",
           "﻿" + lines.join("\r\n"), "text/csv;charset=utf-8");
}

function download(name, body, type) {
  var url = URL.createObjectURL(new Blob([body], { type: type }));
  var a = document.createElement("a");
  a.href = url; a.download = name; a.click();
  setTimeout(function () { URL.revokeObjectURL(url); }, 2000);
}

/* ----------------------------------------------------------- escalations */
/* Takes an ISO timestamp. There was a SECOND function called `waited` further
   down taking SECONDS, defined later at the same scope, so it silently
   replaced this one — and the escalation list, which passes a timestamp, had
   been rendering "waiting N" (the first character of "NaNh NaNm") ever since
   the teller queue was added. Caught by looking at the screen, not by reading
   the code: both call sites are correct in isolation. */
function waited(iso) {
  var mins = Math.round((Date.now() - new Date(iso).getTime()) / 60000);
  if (mins < 60) return [mins + " min", mins > 30 ? "cold" : ""];
  var hrs = Math.round(mins / 60);
  if (hrs < 48) return [hrs + " h", "cold"];
  return [Math.round(hrs / 24) + " days", "cold"];
}

function loadHandoffs() {
  var st = state.hstatus === "all" ? "" : state.hstatus;
  var desk = state.hdesk || "all";
  var qs = [];
  if (st) qs.push("status=" + st);
  if (desk !== "all") qs.push("department=" + encodeURIComponent(desk));
  // Both in one round trip. The desk strip is the thing an operator reads
  // first — "is there anything on fire" — and fetching it after the rows
  // would leave the answer to that question arriving second.
  Promise.all([
    api("/handoffs" + (qs.length ? "?" + qs.join("&") : "")),
    api("/handoffs/desks").catch(function () { return []; })
  ]).then(function (both) {
    var rows = both[0], desks = both[1];
    state.handoffRows = rows;
    state.desks = desks;
    var h = '<div class="tools"><div class="seg">' +
      [["open", "Open"], ["closed", "Closed"], ["all", "All"]].map(function (o) {
        return '<button class="' + (state.hstatus === o[0] ? "on" : "") + '" data-hs="' + o[0] + '">' + o[1] + "</button>";
      }).join("") + "</div><div style='flex:1'></div>" +
      '<button class="btn ghost sm" id="dl-handoffs">Export CSV</button></div>';

    // One row per desk, always all of them and always in the same order. A
    // strip that hid the quiet desks would reorder itself through the day, so
    // the operator who has learned where their queue sits would have to
    // re-find it every time they looked.
    if (desks.length) {
      var total = desks.reduce(function (n, d) { return n + d.open; }, 0);
      h += '<div class="desks">' +
        '<button class="desk' + (desk === "all" ? " on" : "") + '" data-desk="all">' +
          "All<b>" + total + "</b></button>" +
        desks.map(function (d) {
          return '<button class="desk' + (desk === d.department ? " on" : "") +
            (d.urgent ? " hot" : "") + '" data-desk="' + esc(d.department) + '">' +
            esc(d.label) + "<b>" + d.open + "</b>" +
            (d.urgent ? '<span class="u">' + d.urgent + " urgent</span>" : "") +
            "</button>";
        }).join("") + "</div>";
    }

    // A search box, because at a hundred a day filters are not enough: the
    // question an operator actually has is "did the man from Bahir Dar call
    // back", and no combination of status and desk answers that.
    h += '<div class="listhead">' +
      '<input id="h-q" placeholder="Search name, number or message" value="' +
      esc(state.hquery || "") + '">' +
      '<span id="h-count"></span></div>';

    var q = (state.hquery || "").toLowerCase();
    var shown = q ? rows.filter(function (hd) {
      return ((hd.detail || "") + " " + (hd.contact_name || "") + " " +
              (hd.contact_phone || "")).toLowerCase().indexOf(q) > -1;
    }) : rows;

    // One line each. The columns are read left to right as one sentence:
    // how urgent, which desk, what they said, who to call, how long they have
    // waited. Everything else — the transcript, the resolution box — opens
    // when the row is clicked, because a resolution box on every row is what
    // made the old cards 200px tall and the list unreadable.
    h += shown.length ? '<div class="rows">' + shown.map(function (hd) {
      var w = waited(hd.created_at);
      return '<div class="r' + (hd.priority === "urgent" ? " hot" : "") +
          '" data-row="' + esc(hd.id) + '">' +
        '<span class="dot2"></span>' +
        '<span class="tag">' + esc(hd.department_label || "—") + "</span>" +
        '<span class="what">' + esc(hd.detail || REASON_LABEL[hd.reason] || hd.reason) + "</span>" +
        '<span class="who">' + esc(hd.contact_name || hd.contact_phone || "no contact") + "</span>" +
        (hd.status === "open"
          ? '<span class="age ' + w[1] + '">' + esc(w[0]) + "</span>"
          : '<span class="age">closed</span>') +
        "</div>" +
        '<div class="detail" id="d-' + esc(hd.id) + '" style="display:none"></div>';
    }).join("") + "</div>"
      : '<div class="empty">Nothing in this queue.</div>';

    $("main").innerHTML = h;
    wire("[data-hs]", "hs", function (v) { state.hstatus = v; loadHandoffs(); });
    wire("[data-desk]", "desk", function (v) { state.hdesk = v; loadHandoffs(); });
    wire("[data-tx]", "tx", function (v, el) { showTranscript(v, el.getAttribute("data-hid")); });
    wire("[data-close]", "close", closeHandoff);
    wire("[data-reopen]", "reopen", reopenHandoff);
    wire("[data-row]", "row", toggleHandoffDetail);
    $("dl-handoffs").onclick = exportHandoffs;
    $("h-count").textContent = shown.length === rows.length
      ? rows.length + (rows.length === 1 ? " escalation" : " escalations")
      : shown.length + " of " + rows.length;
    var box = $("h-q");
    box.oninput = function () {
      // Re-filters what is already loaded rather than re-fetching. Typing is
      // not a reason to ask the server anything, and a request per keystroke
      // is how a search box becomes slower than scrolling.
      state.hquery = box.value;
      var at = box.selectionStart;
      loadHandoffs();
      window.setTimeout(function () {
        var b = $("h-q");
        if (b) { b.focus(); b.setSelectionRange(at, at); }
      }, 0);
    };
  }).catch(function (e) { $("main").innerHTML = '<div class="empty">' + esc(e.message) + "</div>"; });
}

/* The detail for one escalation, built when it is opened and not before.
 *
 * Everything the old card carried on every row lives here: the full message,
 * who to call, the transcript, the resolution box, the desk it can be moved
 * to. None of it is worth rendering a hundred times for the one row somebody
 * is actually going to work.
 */
function toggleHandoffDetail(id) {
  var box = $("d-" + id);
  var row = document.querySelector('[data-row="' + id + '"]');
  if (!box) return;
  if (box.style.display !== "none") {
    box.style.display = "none";
    box.innerHTML = "";
    if (row) row.classList.remove("open");
    return;
  }
  var hd = (state.handoffRows || []).filter(function (r) { return r.id === id; })[0];
  if (!hd) return;
  if (row) row.classList.add("open");
  box.style.display = "";
  box.innerHTML =
    '<div class="meta">' + esc(REASON_LABEL[hd.reason] || hd.reason) + " · " +
      new Date(hd.created_at).toLocaleString() + "</div>" +
    (hd.detail ? '<div style="margin:8px 0">' + esc(hd.detail) + "</div>" : "") +
    (hd.contact_name || hd.contact_phone
      ? '<div class="contact"><strong>' + esc(hd.contact_name || "Name not given") + "</strong>" +
        (hd.contact_phone ? ' · <a href="tel:' + esc(hd.contact_phone) + '">' +
          esc(hd.contact_phone) + "</a>" : "") + "</div>"
      : '<div class="contact none">No contact details captured.</div>') +
    (hd.resolution ? '<div class="resolution">' + esc(hd.resolution) +
      '<div class="when">closed ' +
      (hd.resolved_at ? new Date(hd.resolved_at).toLocaleString() : "") +
      "</div></div>" : "") +
    '<div class="tools" style="margin:10px 0 0">' +
      '<button class="btn ghost sm" data-tx="' + esc(hd.conversation_id) +
        '" data-hid="' + esc(hd.id) + '">View conversation</button>' +
      // Moving a desk is a select rather than a menu: eight options is a
      // glance, and the operator who noticed the row is on the wrong desk is
      // holding it right now.
      (can("handoffs.resolve")
        ? '<select class="btn ghost sm" data-move="' + esc(hd.id) + '">' +
          (state.desks || []).map(function (d) {
            return '<option value="' + esc(d.department) + '"' +
              (d.department === hd.department ? " selected" : "") + ">" +
              esc(d.label) + "</option>";
          }).join("") + "</select>"
        : "") +
      (hd.status !== "open" && can("handoffs.resolve")
        ? '<button class="btn ghost sm" data-reopen="' + esc(hd.id) + '">Reopen</button>' : "") +
    "</div>" +
    '<div id="tx-' + esc(hd.id) + '"></div>' +
    (hd.status === "open" && can("handoffs.resolve")
      ? '<div class="noteform"><input id="note-' + esc(hd.id) +
        '" placeholder="What was done about it? (optional)">' +
        '<button class="btn sm" data-close="' + esc(hd.id) +
        '">Save &amp; close</button></div>' : "");

  wire("[data-tx]", "tx", function (v, el) { showTranscript(v, el.getAttribute("data-hid")); });
  wire("[data-close]", "close", closeHandoff);
  wire("[data-reopen]", "reopen", reopenHandoff);
  var sel = box.querySelector("[data-move]");
  if (sel) {
    sel.onchange = function () {
      api("/handoffs/" + id + "/department", {
        method: "PUT", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ department: sel.value })
      }).then(function (r) {
        setStatus("Moved to " + r.department_label);
        loadHandoffs();
      }).catch(function (e) { setStatus(e.message); });
    };
  }
}

/* --------------------------------------------------------------- importing
 *
 * Every tenant is running on fifteen to twenty-three articles while a real
 * bank's website is several hundred pages, and that gap is the ceiling on
 * what the assistant can answer. The two ways in were a form that takes one
 * article at a time and a raw JSON paste, which is why the gap never closed.
 *
 * Two steps, never one. Nobody should write two hundred documents into the
 * thing that answers their customers on the strength of a URL typed into a
 * box — the first page a bank imports always brings a section they do not
 * want, and finding that out afterwards means undoing it by hand.
 */
function importForm() {
  $("doc-form").innerHTML =
    '<div class="panel"><h3>Import a page</h3>' +
    '<div class="meta" style="margin-bottom:10px">Paste the address of a page ' +
    "on your own website, or paste the page itself. You will see what would " +
    "be imported before anything is written. If the address alone brings back " +
    "nothing, open the page, expand any collapsed sections, and paste it below " +
    "— keeping the address in the box, so the article records where it came " +
    "from.</div>" +
    '<div class="field"><input id="imp-url" placeholder="https://www.yourbank.com/personal/savings"></div>' +
    '<div class="field"><textarea id="imp-html" rows="4" placeholder="…or open the page, select all (Ctrl+A), copy, and paste it here"></textarea></div>' +
    // Only needed for pasted TEXT — markup and fetched pages carry their own
    // headings. Shown always rather than conditionally, because a field that
    // appears halfway through a task is a field nobody notices.
    '<div class="field"><input id="imp-title" placeholder="Title for pasted text, e.g. Internet Banking"></div>' +
    '<div class="tools">' +
      '<select id="imp-lang">' + LANGS.map(function (l) {
        return '<option value="' + l + '">' + l + "</option>";
      }).join("") + "</select>" +
      '<select id="imp-cat">' + CATEGORIES.map(function (c) {
        return '<option value="' + c + '">' + c + "</option>";
      }).join("") + "</select>" +
      '<button class="btn" id="imp-preview">See what would be imported</button>' +
      '<button class="btn ghost" id="imp-cancel">Cancel</button>' +
    "</div><div id=\"imp-out\"></div></div>";

  $("imp-cancel").onclick = function () { $("doc-form").innerHTML = ""; };
  $("imp-preview").onclick = function () {
    var body = {
      language: $("imp-lang").value, category: $("imp-cat").value,
      title: $("imp-title").value.trim()
    };
    var url = $("imp-url").value.trim(), markup = $("imp-html").value.trim();
    // Pasted content wins, and an address alongside it becomes provenance
    // rather than something to fetch. Somebody who pasted did so BECAUSE the
    // fetch came back empty, so re-fetching would only reproduce the failure —
    // and the address they left in the box is exactly what the article needs
    // recorded against it. The API keeps the two meanings separate (`url`
    // fetches, `source_url` is recorded); only this form is being kind.
    if (markup) {
      body.html = markup;
      if (url) body.source_url = url;
    } else if (url) {
      body.url = url;
    } else { setStatus("An address or some page source, please."); return; }

    $("imp-out").innerHTML = '<div class="meta" style="margin-top:12px">Reading…</div>';
    api("/ingest/preview", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body)
    }).then(function (r) {
      if (!r.sections.length) {
        // The server's own diagnosis, which names what to do next. A generic
        // "nothing importable" leaves an operator looking at a page they can
        // see has content with no idea which of three things is wrong.
        $("imp-out").innerHTML = '<div class="empty" style="text-align:left">' +
          esc(r.note || "Nothing importable on that page.") + "</div>";
        return;
      }
      // Ticked by default, EXCEPT marketing copy.
      //
      // The common case is "yes, all of it", so everything else starts
      // ticked. Sales copy starts unticked because the cost of the two
      // mistakes is not symmetrical: an unticked page a bank wanted is one
      // click to fix, while an imported "Seize this opportunity today" sits
      // in the knowledge base competing with real answers until somebody
      // notices. Found on the second real import — an agent-recruitment page
      // that read like a customer-service article until you got to the
      // exclamation marks.
      var promo = r.sections.filter(function (s) { return s.promotional; }).length;
      $("imp-out").innerHTML =
        '<div class="meta" style="margin:14px 0 8px">' + r.sections.length +
        " section" + (r.sections.length === 1 ? "" : "s") + " found" +
        (promo ? " · " + promo + " look like marketing and start unticked" : "") +
        "</div>" +
        '<div class="rows">' + r.sections.map(function (sec, i) {
          return '<label class="r" style="cursor:pointer">' +
            '<input type="checkbox" class="imp-pick"' +
              (sec.promotional ? "" : " checked") + ' value="' + esc(sec.title) +
              '" style="width:auto;flex:none;margin:0">' +
            '<span class="what"><b>' + esc(sec.title) + "</b> — " +
              esc(sec.preview.slice(0, 90)) + "…</span>" +
            (sec.promotional ? '<span class="tag">marketing</span>' : "") +
            '<span class="tag">' + (sec.replaces ? "replaces" : "new") + "</span>" +
            '<span class="age">' + sec.chars + " ch</span></label>";
        }).join("") + "</div>" +
        '<div class="tools" style="margin-top:12px">' +
        '<button class="btn" id="imp-commit">Import the ticked sections</button></div>';

      $("imp-commit").onclick = function () {
        body.titles = Array.prototype.slice
          .call(document.querySelectorAll(".imp-pick:checked"))
          .map(function (c) { return c.value; });
        if (!body.titles.length) { setStatus("Nothing ticked."); return; }
        $("imp-commit").disabled = true;
        api("/ingest/commit", {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body)
        }).then(function (out) {
          setStatus(out.created + " added, " + out.updated + " updated");
          $("doc-form").innerHTML = "";
          loadDocs();
        }).catch(function (e) {
          $("imp-commit").disabled = false;
          setStatus(e.message);
        });
      };
    }).catch(function (e) {
      $("imp-out").innerHTML = '<div class="empty">' + esc(e.message) + "</div>";
    });
  };
}

/* ---------------------------------------------------------- curated answers
 *
 * The loop that makes the assistant cheaper and more defensible at the same
 * time. The left column is what customers keep asking; the right is what the
 * bank has approved. Moving a question from one to the other takes one click
 * and one edit, and from then on that answer is served verbatim with no model
 * call at all.
 *
 * Suggestions first, deliberately. An empty Curated Answers page with a "New
 * answer" button is a form nobody knows what to type into; the same page
 * headed by "forty people asked this" is a to-do list ordered by value.
 */
function loadFaq() {
  Promise.all([api("/faq"), api("/faq/suggestions")]).then(function (both) {
    var mine = both[0], asked = both[1];
    state.faqRows = mine;
    var pending = asked.filter(function (a) { return !a.faq_id; });

    var h = "";
    if (pending.length) {
      h += '<div class="panel"><h3>People keep asking these</h3>' +
        '<div class="meta" style="margin-bottom:10px">Answer one and it is ' +
        "served instantly from your own words — no AI in the loop, no cost.</div>" +
        '<div class="rows">' + pending.slice(0, 12).map(function (a) {
          return '<div class="r" data-draft="' + esc(a.question) +
            '" data-lang="' + esc(a.language) + '">' +
            '<span class="tag">' + esc(a.language) + "</span>" +
            '<span class="what">' + esc(a.question) + "</span>" +
            '<span class="age">' + a.asked + "&times;</span></div>";
        }).join("") + "</div></div>";
    }

    h += '<div class="panel"><div style="display:flex;align-items:center">' +
      "<h3 style='flex:1'>Approved answers</h3>" +
      (can("documents.write")
        ? '<button class="btn ghost sm" id="faq-import">Import an FAQ page</button>' +
          '<button class="btn sm" id="faq-new" style="margin-left:8px">Write one</button>'
        : "") +
      "</div><div id=\"faq-imp\"></div>" +
      (mine.length ? '<div class="rows">' + mine.map(function (f) {
        return '<div class="r" data-faq="' + esc(f.id) + '">' +
          '<span class="dot2"' + (f.status === "published"
            ? ' style="background:var(--ok)"' : "") + "></span>" +
          '<span class="tag">' + esc(f.language) + "</span>" +
          '<span class="what">' + esc(f.question) + "</span>" +
          '<span class="who">' + esc(f.status) + "</span>" +
          // Served count, which is the number that says whether writing more
          // of these is worth anybody's afternoon.
          '<span class="age">' + f.served + " served</span></div>" +
          '<div class="detail" id="f-' + esc(f.id) + '" style="display:none"></div>';
      }).join("") + "</div>"
        : '<div class="empty">Nothing approved yet.</div>') + "</div>";

    $("main").innerHTML = h;
    wire("[data-draft]", "draft", function (v, el) {
      faqForm(null, v, el.getAttribute("data-lang"));
    });
    wire("[data-faq]", "faq", function (v) {
      var row = (state.faqRows || []).filter(function (f) { return f.id === v; })[0];
      var box = $("f-" + v);
      if (box.style.display !== "none") { box.style.display = "none"; box.innerHTML = ""; return; }
      box.style.display = "";
      faqForm(row, row.question, row.language, box);
    });
    if ($("faq-new")) $("faq-new").onclick = function () { faqForm(null, "", "en"); };
    if ($("faq-import")) $("faq-import").onclick = faqImportForm;
  }).catch(function (e) { $("main").innerHTML = '<div class="empty">' + esc(e.message) + "</div>"; });
}


/* Reading a bank's own published FAQ page in.
 *
 * The bank has already done the hard part — chosen the questions that matter
 * and written the approved answer to each. Retyping forty of those is why a
 * bank with forty published answers ends up with four curated.
 *
 * Everything imported arrives as a DRAFT and says so on the button, because
 * approval with nobody's name on it is a cache with extra steps. The page
 * shown here is the bank's; the approval still has to be theirs.
 */
function faqImportForm() {
  $("faq-imp").innerHTML =
    '<div class="panel" style="margin-top:12px"><h3>Import an FAQ page</h3>' +
    '<div class="meta" style="margin-bottom:10px">Open your FAQ page, expand ' +
    "every collapsed question, select all and paste it below. Each line ending " +
    "in a question mark is read as a question and everything under it as the " +
    "answer. You will see every pair before anything is written, and they all " +
    "arrive as drafts for you to approve.</div>" +
    '<div class="field"><textarea id="fi-text" rows="6" placeholder="Paste the FAQ page here"></textarea></div>' +
    '<div class="tools">' +
      '<select id="fi-lang">' + LANGS.map(function (l) {
        return '<option value="' + l + '">' + l + "</option>";
      }).join("") + "</select>" +
      '<button class="btn" id="fi-preview">See what would be imported</button>' +
      '<button class="btn ghost" id="fi-cancel">Cancel</button>' +
    '</div><div id="fi-out"></div></div>';

  $("fi-cancel").onclick = function () { $("faq-imp").innerHTML = ""; };
  $("fi-preview").onclick = function () {
    var body = {
      text: $("fi-text").value, language: $("fi-lang").value
    };
    if (!body.text.trim()) { setStatus("Paste the page first."); return; }
    $("fi-out").innerHTML = '<div class="meta" style="margin-top:12px">Reading…</div>';
    api("/faq/import/preview", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body)
    }).then(function (r) {
      if (!r.pairs.length) {
        $("fi-out").innerHTML = '<div class="empty" style="text-align:left">' +
          esc(r.note || "No questions found.") + "</div>";
        return;
      }
      // Already-answered pairs start unticked and cannot be imported anyway —
      // shown rather than hidden, so "we already answer eight of these" is
      // visible rather than looking like the parser missed them.
      var held = r.pairs.filter(function (p) { return p.existing; }).length;
      $("fi-out").innerHTML =
        '<div class="meta" style="margin:14px 0 8px">' + r.pairs.length +
        " question" + (r.pairs.length === 1 ? "" : "s") + " found" +
        (held ? " · " + held + " you already answer, left alone" : "") +
        "</div>" +
        '<div class="rows">' + r.pairs.map(function (p) {
          return '<label class="r" style="cursor:pointer;align-items:flex-start">' +
            '<input type="checkbox" class="fi-pick"' +
              (p.existing ? " disabled" : " checked") +
              ' value="' + esc(p.question) + '" style="width:auto;flex:none;margin:2px 0 0">' +
            '<span class="what"><b>' + esc(p.question) + "</b><br>" +
              '<span class="meta">' + esc(p.answer.slice(0, 140)) +
              (p.answer.length > 140 ? "…" : "") + "</span></span>" +
            (p.existing
              ? '<span class="tag">already ' + esc(p.existing) + "</span>" : "") +
            '<span class="age">' + p.chars + " ch</span></label>";
        }).join("") + "</div>" +
        '<div class="tools" style="margin-top:12px">' +
        '<button class="btn" id="fi-commit">Import the ticked as drafts</button></div>';

      $("fi-commit").onclick = function () {
        body.questions = Array.prototype.slice
          .call(document.querySelectorAll(".fi-pick:checked"))
          .map(function (c) { return c.value; });
        if (!body.questions.length) { setStatus("Nothing ticked."); return; }
        $("fi-commit").disabled = true;
        api("/faq/import", {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body)
        }).then(function (out) {
          setStatus(out.created + " imported as drafts — approve them to go live");
          loadFaq();
        }).catch(function (e) {
          $("fi-commit").disabled = false;
          setStatus(e.message);
        });
      };
    }).catch(function (e) {
      $("fi-out").innerHTML = '<div class="empty">' + esc(e.message) + "</div>";
    });
  };
}

/* The editor. Publishing is a separate button from saving, because they are
   different decisions: one is "I have written something", the other is "the
   bank stands behind these words to customers". A single Save that silently
   published would make the approval record meaningless. */
function faqForm(row, question, language, box) {
  var host = box || $("main");
  var html =
    '<div class="panel" id="faq-form"><h3>' +
      (row ? "Edit answer" : "New answer") + "</h3>" +
    '<label class="meta">Question, as a customer would type it</label>' +
    '<input id="fq-q" value="' + esc(question || "") + '">' +
    '<label class="meta">Answer, in the bank\'s own words</label>' +
    '<textarea id="fq-a" rows="5">' + esc(row ? row.answer : "") + "</textarea>" +
    '<div class="tools" style="margin-top:10px">' +
      '<select id="fq-l">' + LANGS.map(function (l) {
        return '<option value="' + l + '"' +
          (l === (row ? row.language : language) ? " selected" : "") + ">" + l + "</option>";
      }).join("") + "</select>" +
      '<button class="btn ghost sm" id="fq-save">Save as draft</button>' +
      '<button class="btn sm" id="fq-pub">Publish</button>' +
      (row ? '<button class="btn ghost sm" id="fq-del">Delete</button>' : "") +
    "</div>" +
    '<div class="note">A published answer is sent to customers exactly as ' +
    "written. Nothing rewrites it and no AI sees it.</div></div>";
  if (box) { box.innerHTML = html; } else { host.insertAdjacentHTML("afterbegin", html); }

  function send(status) {
    var body = {
      question: $("fq-q").value.trim(), answer: $("fq-a").value.trim(),
      language: $("fq-l").value, status: status
    };
    if (!body.question || !body.answer) { setStatus("A question and an answer, please."); return; }
    api("/faq" + (row ? "/" + row.id : ""), {
      method: row ? "PUT" : "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body)
    }).then(function () {
      setStatus(status === "published" ? "Published" : "Saved");
      loadFaq();
    }).catch(function (e) { setStatus(e.message); });
  }
  $("fq-save").onclick = function () { send("draft"); };
  $("fq-pub").onclick = function () { send("published"); };
  if ($("fq-del")) {
    $("fq-del").onclick = function () {
      if (!confirm("Delete this answer? The question goes back to the assistant.")) return;
      api("/faq/" + row.id, { method: "DELETE" })
        .then(function () { setStatus("Deleted"); loadFaq(); })
        .catch(function (e) { setStatus(e.message); });
    };
  }
}

/* One handler for every drilled figure.
 *
 * A destination is "page" or "page:key=value". The filter is applied to the
 * page's own state before it loads, so the list that opens is the one the
 * number counted rather than the page's default view — clicking "telegram: 8"
 * and landing on all channels would be a link that technically worked and
 * answered a different question.
 */
function wireDrills() {
  Array.prototype.forEach.call(document.querySelectorAll("[data-drill]"), function (el) {
    function go_() { drillTo(el.getAttribute("data-drill")); }
    el.onclick = go_;
    el.onkeydown = function (e) {
      if (e.key === "Enter" || e.key === " ") { e.preventDefault(); go_(); }
    };
  });
}

function drillTo(dest) {
  var parts = dest.split(":");
  var page = parts[0];
  state.convoFilter = null;
  if (parts[1]) {
    var kv = parts[1].split("=");
    if (page === "handoffs") state.hstatus = parts[1];
    else if (page === "convos") state.convoFilter = { key: kv[0], value: kv[1] };
  } else if (page === "handoffs") {
    state.hstatus = "open";
  }
  go(page);
}

function wire(sel, attr, fn) {
  Array.prototype.forEach.call(document.querySelectorAll(sel), function (el) {
    el.onclick = function () { fn(el.getAttribute("data-" + attr), el); };
  });
}

function showTranscript(conversationId, handoffId) {
  var box = $("tx-" + handoffId);
  if (box.innerHTML) { box.innerHTML = ""; return; }
  box.innerHTML = '<div class="empty">Loading…</div>';
  api("/conversations/" + conversationId + "/messages").then(function (msgs) {
    box.innerHTML = '<div style="margin-top:10px">' + msgs.map(function (m) {
      return '<div class="msgline ' + esc(m.role) + '">' + esc(m.text) + "</div>";
    }).join("") + "</div>";
  }).catch(function (e) { box.innerHTML = '<div class="empty">' + esc(e.message) + "</div>"; });
}

function closeHandoff(id) {
  var input = $("note-" + id);
  api("/handoffs/" + id + "/close", {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ resolution: input && input.value ? input.value : null })
  }).then(function () { setStatus("Escalation closed"); loadHandoffs(); refreshBadge(); })
    .catch(function (e) { setStatus(e.message); });
}

function reopenHandoff(id) {
  api("/handoffs/" + id + "/reopen", { method: "POST" })
    .then(function () { loadHandoffs(); refreshBadge(); })
    .catch(function (e) { setStatus(e.message); });
}

function exportHandoffs() {
  var rows = state.handoffRows || [];
  var lines = [["Opened", "Status", "Reason", "Name", "Phone", "Detail", "Resolution", "Closed"].join(",")];
  rows.forEach(function (h) {
    lines.push([h.created_at, h.status, h.reason, h.contact_name || "", h.contact_phone || "",
                h.detail || "", h.resolution || "", h.resolved_at || ""].map(csvCell).join(","));
  });
  download("escalations.csv", "﻿" + lines.join("\r\n"), "text/csv;charset=utf-8");
}

/* --------------------------------------------------------- conversations */
function loadConvos() {
  var f = state.convoFilter;
  api("/conversations" + (f ? "?" + f.key + "=" + encodeURIComponent(f.value) : ""))
    .then(function (rows) {
    // The filter is stated and removable. A list silently showing a subset is
    // how someone concludes there were only eight conversations all month.
    var head = f
      ? '<div class="tools"><span class="pill">' + esc(f.key) + ": " + esc(f.value) +
        '</span><button class="linky" id="clear-filter">Show all</button>' +
        '<div style="flex:1"></div><span class="meta">' + rows.length +
        " shown</span></div>"
      : "";
    var q = (state.cquery || "").toLowerCase();
    var shown = q ? rows.filter(function (c) {
      return ((c.preview || "") + " " + (c.channel || "") + " " +
              (c.language || "")).toLowerCase().indexOf(q) > -1;
    }) : rows;

    // The opening question, as the column that carries the row.
    //
    // This list used to show a channel, a timestamp and a language — three
    // facts that are the same on nearly every row — so a hundred
    // conversations were a hundred identical cards and the only way to find
    // one was to open them one at a time. What a conversation was ABOUT is
    // the thing a person is scanning for, and it was the one thing missing.
    var body = shown.length ? '<div class="rows">' + shown.map(function (c) {
      var w = waited(c.created_at);
      return '<div class="r' + (c.escalated ? " hot" : "") +
          '" data-msgs="' + esc(c.id) + '">' +
        '<span class="dot2"></span>' +
        '<span class="tag">' + esc(c.channel) + "</span>" +
        '<span class="what">' + esc(c.preview || "(no message)") + "</span>" +
        '<span class="who">' + esc(c.language || "—") +
          (c.turns ? " · " + c.turns + " turns" : "") + "</span>" +
        // No "cold" colouring here. An old conversation is history, not a
        // customer going unanswered — amber on it would borrow the meaning
        // the escalation list gives the same column and say the opposite.
        '<span class="age">' + esc(w[0]) + "</span>" +
        "</div>" +
        '<div class="detail" id="m-' + esc(c.id) + '" style="display:none"></div>';
    }).join("") + "</div>" : '<div class="empty">No conversations match.</div>';

    $("main").innerHTML = head +
      '<div class="listhead">' +
      '<input id="c-q" placeholder="Search what customers asked" value="' +
      esc(state.cquery || "") + '">' +
      "<span>" + (shown.length === rows.length
        ? rows.length + " conversations"
        : shown.length + " of " + rows.length) +
      // The red dot means it reached a person. Said once here rather than
      // relying on a colour nobody was told the meaning of.
      " · a red dot reached a person</span></div>" + body;
    var cbox = $("c-q");
    cbox.oninput = function () {
      state.cquery = cbox.value;
      var at = cbox.selectionStart;
      loadConvos();
      window.setTimeout(function () {
        var b = $("c-q");
        if (b) { b.focus(); b.setSelectionRange(at, at); }
      }, 0);
    };
    wire("[data-msgs]", "msgs", loadMsgs);
    if ($("clear-filter")) {
      $("clear-filter").onclick = function () { state.convoFilter = null; loadConvos(); };
    }
  }).catch(function (e) { $("main").innerHTML = '<div class="empty">' + esc(e.message) + "</div>"; });
}

function loadMsgs(id) {
  var box = $("m-" + id);
  var row = document.querySelector('[data-msgs="' + id + '"]');
  if (!box) return;
  if (box.style.display !== "none") {
    box.style.display = "none";
    box.innerHTML = "";
    if (row) row.classList.remove("open");
    return;
  }
  if (row) row.classList.add("open");
  box.style.display = "";
  box.innerHTML = '<div class="meta">Loading…</div>';
  api("/conversations/" + id + "/messages").then(function (msgs) {
    box.innerHTML = msgs.map(function (m) {
      return '<div class="msgline ' + esc(m.role) + '">' + esc(m.text) + "</div>";
    }).join("");
  }).catch(function (e) { box.innerHTML = '<div class="empty">' + esc(e.message) + "</div>"; });
}

/* -------------------------------------------------------- knowledge base */

var LANGS = ["en", "am", "om", "ti", "so"];
var LANG_NAME = {

function loadDocs() {

      // is one click rather than a copy-paste between two screens.

function docForm(doc, gap) {

       text that gets saved by accident, and this article is what the assistant

    (gap ? '<div class="gapnote"><strong>Asked ' + gap.count + " time" +
      (gap.count === 1 ? "" : "s") + ", in these words:</strong>" +

    }).join("") + "</select></div>" +

function saveDoc(id) {
  var body = {
    title: $("d-title").value, content: $("d-body").value,
    category: $("d-cat").value, language: $("d-lang").value
  };
  var opts = { method: id ? "PUT" : "POST", headers: { "Content-Type": "application/json" },
               body: JSON.stringify(body) };
  api("/documents" + (id ? "/" + id : ""), opts)
    .then(function () { setStatus("Saved"); loadDocs(); })
    .catch(function (e) { setStatus(e.message); });

function deleteDoc(id) {
  if (!confirm("Delete this article? The assistant will stop using it.")) return;
  api("/documents/" + id, { method: "DELETE" })
    .then(function () { setStatus("Deleted"); loadDocs(); })
    .catch(function (e) { setStatus(e.message); });
}

function bulkForm() {
  $("doc-form").innerHTML = '<div class="panel"><h3>Bulk import</h3>' +
    '<div class="meta" style="margin-bottom:10px">A JSON array of objects with title, content, and optionally category and language.</div>' +
    '<div class="field"><input type="file" id="bulk-file" accept=".json"></div>' +
    '<div class="field"><textarea id="bulk-json" placeholder=\'[{"title": "...", "content": "..."}]\'></textarea></div>' +
    '<div class="tools"><button class="btn" id="bulk-go">Import</button>' +
    '<button class="btn ghost" id="bulk-cancel">Cancel</button></div></div>';
  $("bulk-file").onchange = function (e) {
    var f = e.target.files[0];
    if (!f) return;
    var r = new FileReader();
    r.onload = function () { $("bulk-json").value = r.result; };
    r.readAsText(f);
  };
  $("bulk-cancel").onclick = function () { $("doc-form").innerHTML = ""; };
  $("bulk-go").onclick = function () {
    var parsed;
    try { parsed = JSON.parse($("bulk-json").value); }
    catch (err) { setStatus("That is not valid JSON: " + err.message); return; }
    api("/documents/bulk", { method: "POST", headers: { "Content-Type": "application/json" },
                             body: JSON.stringify({ documents: parsed }) })
      .then(function (res) { setStatus("Imported " + res.created + " articles"); loadDocs(); })
      .catch(function (e) { setStatus(e.message); });

}

/* ------------------------------------------------------------ gaps
 *
 * The page exists to answer one question — "what should we write next?" — and
 * to make acting on the answer a single click.
 *
 * A gap is a question a customer asked that this bank's published content did
 * not answer. Two kinds, kept apart because they need different work: nothing
 * was found at all, or the assistant fell back to general banking knowledge,
 * which is an answer the bank may well want to own in its own words with its
 * own fees and limits. The second kind is easy to overlook precisely because
 * the customer did get a reply.
 *
 * Ranked by how often it was asked, because writing one article that answers
 * twenty people beats writing twenty that answer one.
 */
var GAP_REASON = {
  unanswered_question: "No answer found",
  answered_from_general_knowledge: "Answered generically"
};

function loadGaps() {
  api("/content-gaps").then(function (rows) {
    var writable = can("documents.write");
    var h = '<div class="panel"><h3>What this page is for</h3>' +
      '<div class="meta">Every row is a question a customer asked that your published ' +
      "content did not answer, grouped by what was asked and ranked by how often. " +
      "Writing one article that answers twenty people beats writing twenty that answer " +
      "one, so work down from the top." +
      (writable ? " <strong>Write an article</strong> opens the editor with the question " +
        "already in the title." : "") + "</div></div>";

    if (!rows.length) {
      h += '<div class="panel"><div class="empty">Nothing here — every question so far ' +
        "was answerable from your own content.<br>This page fills itself as customers " +
        "ask things you have not published yet.</div></div>";
      $("main").innerHTML = h;
      return;
    }

    h += rows.map(function (g, i) {
      var langs = Object.keys(g.languages || {}).sort(function (a, b) {
        return g.languages[b] - g.languages[a];
      });
      var reasons = Object.keys(g.reasons || {});
      return '<div class="panel gap">' +
        '<div class="gaphead">' +
        '<div class="rank">' + g.count + "&times;</div>" +
        '<div style="flex:1;min-width:0">' +
        '<div class="gapq">' + esc(g.examples[0] || "(no wording recorded)") + "</div>" +
        '<div class="gapmeta">' +
          reasons.map(function (r) {
            return '<span class="pill ' + (r === "unanswered_question" ? "off" : "") + '">' +
              esc(GAP_REASON[r] || r) + " " + g.reasons[r] + "</span>";
          }).join("") +
          langs.map(function (l) {
            return '<span class="pill">' + esc(LANG_NAME[l] || l) + " " + g.languages[l] + "</span>";
          }).join("") +
          (g.open_count ? '<span class="pill open">' + g.open_count + " still open</span>" : "") +
          '<span class="meta">last asked ' + esc(ago(g.last_asked)) + "</span>" +
        "</div></div>" +
        (writable ? '<button class="btn sm" data-write="' + i + '">Write an article</button>' : "") +
        "</div>" +
        // The other wordings matter: they are how the same question gets asked,
        // and an article that only matches one phrasing answers one of them.
        (g.examples.length > 1
          ? '<div class="alsoasked"><span class="meta">Also asked as</span>' +
            g.examples.slice(1).map(function (e) {
              return "<div>" + esc(e) + "</div>";
            }).join("") + "</div>"
          : "") +
        "</div>";
    }).join("");

    $("main").innerHTML = h;
    state.gaps = rows;
    wire("[data-write]", "write", function (i) {
      var g = state.gaps[parseInt(i, 10)];
      state.draftFromGap = {
        title: g.examples[0] || "",
        examples: g.examples,
        count: g.count,
        language: Object.keys(g.languages || {})[0] || "en"
      };
      go("docs");
    });
  }).catch(function (e) { $("main").innerHTML = '<div class="empty">' + esc(e.message) + "</div>"; });
}

/* ------------------------------------------------------------ audit log
 *
 * The record an access review asks for. Distinct from the dashboard's activity
 * feed, which drops sign-ins and shows a dozen rows: that answers "what
 * changed lately", this answers "show me everything this person did" and drops
 * nothing.
 */
var AUDIT_PAGE = 50;

function loadAudit(page) {
  state.auditPage = page || 0;
  var q = "?limit=" + AUDIT_PAGE + "&offset=" + (state.auditPage * AUDIT_PAGE) +
    (state.auditAction ? "&action=" + encodeURIComponent(state.auditAction) : "") +
    (state.auditActor ? "&actor=" + encodeURIComponent(state.auditActor) : "");
  api("/audit" + q).then(function (d) {
    state.audit = d;
    var from = d.offset + 1, to = Math.min(d.offset + d.entries.length, d.total);

    var h = '<div class="tools">' +
      '<select id="a-action" style="width:auto"><option value="">All actions</option>' +
      d.actions.map(function (a) {
        return '<option value="' + esc(a) + '"' +
          (state.auditAction === a ? " selected" : "") + ">" +
          esc(ACTION_LABEL[a] || a.replace(/_/g, " ")) + "</option>";
      }).join("") + "</select>" +
      (state.auditActor
        ? '<span class="pill">one person</span><button class="linky" id="a-clear">Show everyone</button>'
        : "") +
      '<div style="flex:1"></div>' +
      // The total, not just the page. "50 entries" and "50 of 4,300" are
      // different answers and only one of them is honest.
      '<span class="meta">' + (d.total ? from + "–" + to + " of " + num(d.total) : "0") +
      " entries</span>" +
      '<button class="btn ghost sm" id="a-csv">Export CSV</button></div>';

    h += '<div class="panel">' + (d.entries.length
      ? "<table><thead><tr><th>When</th><th>Who</th><th>Action</th>" +
        "<th>On</th><th>Details</th></tr></thead><tbody>" +
        d.entries.map(function (e) {
          return "<tr><td class='meta' style='white-space:nowrap'>" +
            esc(new Date(e.at).toLocaleString()) + "</td>" +
            "<td>" + (e.actor.by_token
              ? '<span class="pill off">Admin token</span>'
              // The name IS the filter. A separate "only this person" link under
              // every row was thirty-one links down one column — an affordance
              // repeated until it becomes noise, which is how a table stops
              // being readable.
              : '<button class="whobtn" data-only="' + esc(e.id) + '" ' +
                'title="Show only this person">' + esc(e.actor.name) + "</button>" +
                (e.actor.email && e.actor.email !== e.actor.name
                  ? '<div class="meta">' + esc(e.actor.email) + "</div>" : "")) +
            "</td>" +
            "<td>" + esc(ACTION_LABEL[e.action] || e.action.replace(/_/g, " ")) + "</td>" +
            "<td class='meta'>" + esc(e.entity_type) + "</td>" +
            "<td class='meta'>" + esc(describeMeta(e.metadata)) + "</td></tr>";
        }).join("") + "</tbody></table>"
      : '<div class="empty">No entries match.</div>') + "</div>";

    var pages = Math.ceil(d.total / AUDIT_PAGE);
    if (pages > 1) {
      h += '<div class="tools" style="justify-content:center">' +
        '<button class="btn ghost sm" id="a-prev"' + (state.auditPage ? "" : " disabled") +
        ">Previous</button>" +
        '<span class="meta">Page ' + (state.auditPage + 1) + " of " + pages + "</span>" +
        '<button class="btn ghost sm" id="a-next"' +
        (state.auditPage + 1 < pages ? "" : " disabled") + ">Next</button></div>";
    }

    $("main").innerHTML = h;
    $("a-action").onchange = function () {
      state.auditAction = $("a-action").value || null;
      loadAudit(0);
    };
    if ($("a-clear")) {
      $("a-clear").onclick = function () { state.auditActor = null; loadAudit(0); };
    }
    if ($("a-prev")) $("a-prev").onclick = function () { loadAudit(state.auditPage - 1); };
    if ($("a-next")) $("a-next").onclick = function () { loadAudit(state.auditPage + 1); };
    $("a-csv").onclick = exportAudit;
    wire("[data-only]", "only", function (id) {
      var row = state.audit.entries.filter(function (e) { return String(e.id) === id; })[0];
      if (!row) return;
      // Filtered by the stored actor id, not the display name — two colleagues
      // can share a name and an audit filter must not merge them.
      state.auditActor = row.actor_id;
      loadAudit(0);
    });
  }).catch(function (e) { $("main").innerHTML = '<div class="empty">' + esc(e.message) + "</div>"; });
}

/* Metadata rendered as facts rather than as raw JSON. A reviewer reading
   {"sessions_revoked": 1} has to decode it; "1 session ended" they can read. */
function describeMeta(m) {
  var bits = [];
  if (m.email) bits.push(m.email);
  if (m.role) bits.push("role: " + m.role);
  if (m.title) bits.push(m.title);
  if (m.url) bits.push(m.url);
  if (m.chunks != null) bits.push(m.chunks + " chunks");
  if (m.count != null) bits.push(m.count + " documents");
  if (m.sessions_revoked) bits.push(m.sessions_revoked + " session(s) ended");
  if (m.primary_color) bits.push(m.primary_color);
  if (m.short_name) bits.push("brand: " + m.short_name);
  if (m.had_resolution != null) bits.push(m.had_resolution ? "with a note" : "no note");
  return bits.join(" · ");
}

function exportAudit() {
  var d = state.audit;
  if (!d) return;
  var lines = [["When", "Who", "Email", "Action", "Entity", "Entity id", "Details"].join(",")];
  d.entries.forEach(function (e) {
    lines.push([e.at, e.actor.name, e.actor.email || "", e.action,
                e.entity_type, e.entity_id, describeMeta(e.metadata)].map(csvCell).join(","));
  });
  // Names the page, because an export of page 2 of 87 that looks like the whole
  // log is how a reviewer reaches a wrong conclusion.
  download("audit-log-page-" + (state.auditPage + 1) + ".csv",
           "\ufeff" + lines.join("\r\n"), "text/csv;charset=utf-8");
}
