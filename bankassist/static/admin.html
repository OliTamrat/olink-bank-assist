<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bank Assist — Admin</title>
<style>
  * { box-sizing: border-box; margin: 0; }
  body { font-family: "Noto Sans Ethiopic", "Segoe UI", system-ui, sans-serif; background: #0b1220; color: #e2e8f0; min-height: 100vh; }
  header { padding: 16px 24px; border-bottom: 1px solid #1e293b; display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
  header h1 { font-size: 16px; font-weight: 700; }
  header input { background: #111a2c; border: 1px solid #273449; color: #e2e8f0; border-radius: 8px; padding: 8px 10px; font-size: 13px; }
  header button, .btn { background: #0f766e; border: none; color: #fff; border-radius: 8px; padding: 8px 14px; font-size: 13px; font-weight: 600; cursor: pointer; }
  .btn.secondary { background: #273449; }
  .btn.danger { background: #7f1d1d; }
  nav { display: flex; gap: 4px; padding: 12px 24px 0; }
  nav button { background: none; border: none; color: #94a3b8; padding: 8px 14px; font-size: 14px; cursor: pointer; border-bottom: 2px solid transparent; }
  nav button.active { color: #fff; border-bottom-color: #0f766e; }
  main { padding: 20px 24px; max-width: 1100px; }
  .card { background: #111a2c; border: 1px solid #1e293b; border-radius: 12px; padding: 16px; margin-bottom: 12px; }
  .card h3 { font-size: 14.5px; margin-bottom: 6px; }
  .meta { font-size: 12px; color: #64748b; margin-bottom: 8px; }
  .card pre { white-space: pre-wrap; font-family: inherit; font-size: 13px; color: #cbd5e1; max-height: 130px; overflow: hidden; }
  .row { display: flex; gap: 8px; margin-top: 10px; }
  form.doc input, form.doc textarea, form.doc select {
    width: 100%; background: #0b1220; border: 1px solid #273449; color: #e2e8f0;
    border-radius: 8px; padding: 9px 11px; font-size: 13.5px; margin-bottom: 10px; font-family: inherit;
  }
  form.doc textarea { min-height: 180px; resize: vertical; }
  .pill { display: inline-block; font-size: 11px; padding: 2px 9px; border-radius: 99px; background: #273449; margin-right: 6px; }
  .pill.open { background: #78350f; }
  .pill.closed { background: #14532d; }
  .msgline { padding: 8px 10px; border-radius: 8px; margin-bottom: 6px; font-size: 13.5px; white-space: pre-wrap; }
  .msgline.user { background: #1e3a5f; }
  .msgline.assistant { background: #16233c; }
  #status { font-size: 12px; color: #64748b; margin-left: auto; }
  .empty { color: #64748b; font-size: 13.5px; padding: 12px 0; }
.contact{margin:8px 0;font-size:13px}
.contact a{color:#2dd4bf;text-decoration:none}
.contact.none{color:#9aa0a6;font-style:italic}
/* Overview. Palette matches the rest of the panel — this is a dark theme,
   and light cards rendered the labels near-invisible. */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:18px}
.kpi{background:#111a2c;border:1px solid #1e293b;border-radius:12px;padding:14px 16px}
.kpi .v{font-size:30px;font-weight:600;line-height:1.15;color:#2dd4bf}
.kpi .v.muted{color:#64748b;font-weight:400;font-size:22px}
.kpi .k{font-size:12.5px;color:#94a3b8;margin-top:2px}
.kpi .sub{font-size:11.5px;color:#64748b;margin-top:6px}
.panel{background:#111a2c;border:1px solid #1e293b;border-radius:12px;padding:14px 16px;margin-bottom:14px}
.panel h3{margin:0 0 12px;font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;color:#94a3b8}
.bar{display:grid;grid-template-columns:180px 1fr 42px;gap:12px;align-items:center;margin:7px 0;font-size:13px;color:#cbd5e1}
.bar .track{background:#0b1220;border:1px solid #1e293b;border-radius:5px;height:10px;overflow:hidden}
/* display:block matters — a span is inline, so width and height are ignored
   and every bar renders as an empty track. */
.bar .fill{display:block;background:#2dd4bf;height:100%}
.bar .fill.warn{background:#f59e0b}
.bar .fill.bad{background:#ef4444}
.bar .n{text-align:right;color:#94a3b8;font-variant-numeric:tabular-nums}
.topic{display:grid;grid-template-columns:40px 1fr;gap:12px;align-items:baseline;margin:7px 0;font-size:13px;color:#cbd5e1}
.topic .n{text-align:right;color:#94a3b8;font-variant-numeric:tabular-nums}
.windowbar{margin-bottom:14px;font-size:12.5px;color:#94a3b8}
.windowbar button{margin-left:6px;background:#273449;border:none;color:#e2e8f0;border-radius:6px;padding:5px 11px;font-size:12px;cursor:pointer}
.windowbar button.on{background:#0f766e;color:#fff}
.note{font-size:12px;color:#64748b;margin-top:12px}
/* Handoff console */
.hstate{margin-bottom:14px;font-size:12.5px;color:#94a3b8}
.hstate button{margin-left:6px;background:#273449;border:none;color:#e2e8f0;border-radius:6px;padding:5px 11px;font-size:12px;cursor:pointer}
.hstate button.on{background:#0f766e;color:#fff}
.waiting{font-size:12px;color:#f59e0b}
.waiting.cold{color:#ef4444}
.resolution{margin:8px 0;font-size:13px;color:#cbd5e1;border-left:2px solid #0f766e;padding-left:10px}
.resolution .when{color:#64748b;font-size:11.5px}
.transcript{margin-top:10px;border-top:1px solid #1e293b;padding-top:10px}
.noteform{display:flex;gap:8px;margin-top:10px}
.noteform input{flex:1;background:#0b1220;border:1px solid #273449;color:#e2e8f0;border-radius:8px;padding:8px 10px;font-size:13px;font-family:inherit}
</style>
</head>
<body>
<header>
  <h1>Bank Assist Admin</h1>
  <input id="slug" placeholder="bank slug (e.g. demo)" size="14">
  <input id="token" placeholder="admin token" size="28" type="password">
  <button onclick="connect()">Connect</button>
  <span id="status"></span>
</header>
<nav>
  <button id="tab-overview" class="active" onclick="showTab('overview')">Overview</button>
  <button id="tab-docs" onclick="showTab('docs')">Knowledge Base</button>
  <button id="tab-convos" onclick="showTab('convos')">Conversations</button>
  <button id="tab-handoffs" onclick="showTab('handoffs')">Handoffs</button>
  <button id="tab-gaps" onclick="showTab('gaps')">Content Gaps</button>
</nav>
<main id="main"><div class="empty">Enter your bank slug and admin token, then Connect.</div></main>

<script>
var state = { slug: localStorage.getItem("ba_slug") || "", token: localStorage.getItem("ba_token") || "", tab: "overview", days: 30, hstatus: "open" };
document.getElementById("slug").value = state.slug;
document.getElementById("token").value = state.token;

function api(path, opts) {
  opts = opts || {};
  opts.headers = Object.assign({ "X-Admin-Token": state.token, "Content-Type": "application/json" }, opts.headers || {});
  return fetch("/admin/api/" + encodeURIComponent(state.slug) + path, opts).then(function (r) {
    if (r.status === 401) throw new Error("Invalid admin token");
    if (!r.ok && r.status !== 204) throw new Error("Request failed (" + r.status + ")");
    return r.status === 204 ? null : r.json();
  });
}
function setStatus(text) { document.getElementById("status").textContent = text; }
function connect() {
  state.slug = document.getElementById("slug").value.trim();
  state.token = document.getElementById("token").value.trim();
  localStorage.setItem("ba_slug", state.slug);
  localStorage.setItem("ba_token", state.token);
  showTab(state.tab);
}
function showTab(tab) {
  state.tab = tab;
  ["overview", "docs", "convos", "handoffs", "gaps"].forEach(function (t) {
    document.getElementById("tab-" + t).classList.toggle("active", t === tab);
  });
  if (!state.slug || !state.token) return;
  if (tab === "overview") loadOverview();
  if (tab === "docs") loadDocs();
  if (tab === "convos") loadConvos();
  if (tab === "handoffs") loadHandoffs();
  if (tab === "gaps") loadGaps();
}
function esc(s) { var d = document.createElement("div"); d.textContent = s == null ? "" : s; return d.innerHTML; }

// ------------------------------------------------ overview
var OUTCOME_LABEL = {
  answered:         ["Answered from your content", ""],
  general_guidance: ["General banking guidance",   "warn"],
  comparison:       ["Competitive question",       ""],
  account_blocked:  ["Account request declined",   ""],
  unanswered:       ["Nobody could answer",        "bad"],
  complaint:        ["Complaint",                  "bad"],
  greeting:         ["Greeting",                   ""],
  contact_captured: ["Contact details given",      ""]
};

function pct(x) { return x == null ? "\u2014" : Math.round(x * 1000) / 10 + "%"; }

function bars(rows, total, labeller) {
  if (!rows.length) return '<div class="empty">Nothing yet.</div>';
  return rows.map(function (r) {
    var l = labeller(r);
    var w = total ? Math.max(2, Math.round((r.count / total) * 100)) : 0;
    return '<div class="bar"><span>' + esc(l[0]) + '</span>' +
      '<span class="track"><span class="fill ' + l[1] + '" style="width:' + w + '%"></span></span>' +
      '<span class="n">' + r.count + "</span></div>";
  }).join("");
}

function setDays(d) { state.days = d; loadOverview(); }

function loadOverview() {
  api("/analytics?days=" + state.days).then(function (a) {
    setStatus(a.conversations + " conversations in window");
    var langTotal = a.languages.reduce(function (s, r) { return s + r.count; }, 0);

    var windowbar = '<div class="windowbar">Window: ' +
      [7, 30, 90, 0].map(function (d) {
        return '<button class="' + (state.days === d ? "on" : "") + '" onclick="setDays(' + d + ')">' +
          (d ? d + " days" : "All time") + "</button>";
      }).join("") + "</div>";

    // Rates are null until something has been asked. Showing 0% on a fresh
    // tenant would read as "the product answers nothing".
    var kpis = '<div class="kpis">' +
      '<div class="kpi"><div class="v' + (a.deflection_rate == null ? " muted" : "") + '">' + pct(a.deflection_rate) + '</div>' +
        '<div class="k">Handled without a person</div>' +
        '<div class="sub">' + a.resolved_without_a_person + " of " + a.substantive_questions + " questions</div></div>" +
      '<div class="kpi"><div class="v' + (a.own_content_rate == null ? " muted" : "") + '">' + pct(a.own_content_rate) + '</div>' +
        '<div class="k">Answered from your own content</div>' +
        '<div class="sub">' + a.answered_from_own_content + " questions</div></div>" +
      '<div class="kpi"><div class="v">' + a.conversations + '</div><div class="k">Conversations</div>' +
        '<div class="sub">' + a.substantive_questions + " questions asked</div></div>" +
      '<div class="kpi"><div class="v">' + a.handoffs.open + '</div><div class="k">Open handoffs</div>' +
        '<div class="sub">' + a.handoffs.open_reachable + " reachable, " + a.handoffs.open_unreachable + " with no contact</div></div>" +
      "</div>";

    // Only the outcomes that are actually questions. Greetings and the contact
    // exchange are real turns but they are not in the denominator above, and
    // charting them beside the others implies they are.
    var SUBSTANTIVE = ["answered", "general_guidance", "comparison",
                       "account_blocked", "unanswered", "complaint"];
    var qRows = a.outcomes.filter(function (r) { return SUBSTANTIVE.indexOf(r.outcome) > -1; });
    var otherRows = a.outcomes.filter(function (r) { return SUBSTANTIVE.indexOf(r.outcome) < 0; });

    var outcomes = '<div class="panel"><h3>What happened to each question</h3>' +
      bars(qRows, a.substantive_questions, function (r) {
        return OUTCOME_LABEL[r.outcome] || [r.outcome, ""];
      }) +
      (otherRows.length
        ? '<div class="note">Not counted as questions: ' +
          otherRows.map(function (r) {
            return (OUTCOME_LABEL[r.outcome] || [r.outcome])[0].toLowerCase() + " \u00d7" + r.count;
          }).join(", ") + ".</div>"
        : "") +
      (a.unclassified_turns
        ? '<div class="note">' + a.unclassified_turns + " earlier turns predate outcome tracking and are left out of every rate here.</div>"
        : "") +
      "</div>";

    var languages = '<div class="panel"><h3>Languages customers used</h3>' +
      bars(a.languages, langTotal, function (r) { return [r.name || r.language, ""]; }) + "</div>";

    var topics = '<div class="panel"><h3>Most asked</h3>' +
      (a.top_topics.length
        ? a.top_topics.map(function (t) {
            return '<div class="topic"><span class="n">' + t.count + '\u00d7</span>' +
              "<span>" + esc(t.example) + "</span></div>";
          }).join("")
        : '<div class="empty">Nothing yet.</div>') +
      '<div class="note">Phone numbers and email addresses are removed from this list.</div></div>';

    document.getElementById("main").innerHTML = windowbar + kpis + outcomes + languages + topics;
  }).catch(function (e) { setStatus(e.message); });
}

// ------------------------------------------------ documents
function docForm(doc) {
  doc = doc || { title: "", content: "", category: "general", language: "en" };
  return '<form class="doc card" onsubmit="return saveDoc(event, \'' + (doc.id || "") + '\')">' +
    '<input name="title" placeholder="Title" required value="' + esc(doc.title) + '">' +
    '<div class="row"><select name="category">' +
      ["general", "products", "how-to", "financial-education", "fees"].map(function (c) {
        return '<option' + (c === doc.category ? " selected" : "") + '>' + c + "</option>";
      }).join("") + "</select>" +
    '<select name="language">' +
      ["en", "am", "om", "ti", "so"].map(function (l) {
        return '<option' + (l === doc.language ? " selected" : "") + '>' + l + "</option>";
      }).join("") + "</select></div>" +
    '<textarea name="content" placeholder="Official content the assistant may quote. Separate topics with blank lines." required>' + esc(doc.content) + "</textarea>" +
    '<div class="row"><button class="btn" type="submit">Save</button>' +
    (doc.id ? '<button class="btn danger" type="button" onclick="deleteDoc(\'' + doc.id + '\')">Delete</button>' : "") +
    "</div></form>";
}
function bulkImportForm() {
  return '<div class="card"><h3>Bulk import</h3>' +
    '<div class="meta">Paste a JSON array of documents, or choose a .json file — each item needs title + content, category/language are optional (default general/en).</div>' +
    '<textarea id="bulk-json" placeholder=\'[{"title": "Savings Accounts", "content": "...", "category": "products", "language": "en"}]\'></textarea>' +
    '<div class="row"><input type="file" id="bulk-file" accept="application/json" onchange="bulkFileChosen(event)">' +
    '<button class="btn" type="button" onclick="submitBulkImport()">Import</button></div></div>';
}
function bulkFileChosen(e) {
  var file = e.target.files[0];
  if (!file) return;
  var reader = new FileReader();
  reader.onload = function () { document.getElementById("bulk-json").value = reader.result; };
  reader.readAsText(file);
}
function submitBulkImport() {
  var raw = document.getElementById("bulk-json").value.trim();
  var docs;
  try {
    docs = JSON.parse(raw);
    if (!Array.isArray(docs)) throw new Error("Expected a JSON array of documents");
  } catch (e) {
    setStatus("Invalid JSON: " + e.message);
    return;
  }
  api("/documents/bulk", { method: "POST", body: JSON.stringify({ documents: docs }) })
    .then(function (res) { setStatus("Imported " + res.created + " documents"); loadDocs(); })
    .catch(function (err) { setStatus(err.message); });
}
function loadDocs() {
  api("/documents").then(function (docs) {
    setStatus(docs.length + " documents");
    var html = bulkImportForm() + '<div class="card"><h3>Add document</h3>' + docForm(null) + "</div>";
    html += docs.map(function (d) {
      return '<div class="card"><h3>' + esc(d.title) + "</h3>" +
        '<div class="meta"><span class="pill">' + esc(d.category) + '</span><span class="pill">' + esc(d.language) + "</span> updated " + d.updated_at.slice(0, 16).replace("T", " ") + "</div>" +
        docForm(d) + "</div>";
    }).join("");
    document.getElementById("main").innerHTML = html || '<div class="empty">No documents yet.</div>';
  }).catch(function (e) { setStatus(e.message); });
}
function saveDoc(e, id) {
  e.preventDefault();
  var f = e.target;
  var body = JSON.stringify({ title: f.title.value, content: f.content.value, category: f.category.value, language: f.language.value });
  var req = id ? api("/documents/" + id, { method: "PUT", body: body }) : api("/documents", { method: "POST", body: body });
  req.then(function () { loadDocs(); }).catch(function (err) { setStatus(err.message); });
  return false;
}
function deleteDoc(id) {
  if (!confirm("Delete this document? The assistant will stop answering from it.")) return;
  api("/documents/" + id, { method: "DELETE" }).then(loadDocs).catch(function (e) { setStatus(e.message); });
}

// ------------------------------------------------ conversations
function loadConvos() {
  api("/conversations").then(function (rows) {
    setStatus(rows.length + " conversations");
    document.getElementById("main").innerHTML = rows.length ? rows.map(function (c) {
      return '<div class="card"><div class="meta"><span class="pill">' + esc(c.channel) + "</span>" +
        (c.language ? '<span class="pill">' + esc(c.language) + "</span>" : "") +
        c.created_at.slice(0, 16).replace("T", " ") + "</div>" +
        '<button class="btn secondary" onclick="loadMsgs(\'' + c.id + '\')">View messages</button>' +
        '<div id="m-' + c.id + '"></div></div>';
    }).join("") : '<div class="empty">No conversations yet.</div>';
  }).catch(function (e) { setStatus(e.message); });
}
function loadMsgs(id) {
  api("/conversations/" + id + "/messages").then(function (msgs) {
    document.getElementById("m-" + id).innerHTML = "<div style='margin-top:10px'>" + msgs.map(function (m) {
      return '<div class="msgline ' + m.role + '"><strong>' + m.role + (m.intent ? " · " + esc(m.intent) : "") + ":</strong> " + esc(m.text) + "</div>";
    }).join("") + "</div>";
  }).catch(function (e) { setStatus(e.message); });
}

// ------------------------------------------------ handoffs
function setHandoffStatus(v) { state.hstatus = v; loadHandoffs(); }

// How long someone has been waiting. The number that decides what to work on
// next, and it was nowhere on the row before.
function waited(iso) {
  var hrs = (Date.now() - new Date(iso).getTime()) / 3600000;
  if (hrs < 1) return ["just now", ""];
  if (hrs < 24) return [Math.round(hrs) + "h waiting", ""];
  var d = Math.round(hrs / 24);
  return [d + (d === 1 ? " day waiting" : " days waiting"), d >= 2 ? "cold" : ""];
}

function loadHandoffs() {
  var st = state.hstatus || "open";
  api("/handoffs?status=" + st).then(function (rows) {
    setStatus(rows.length + " " + st + " handoff" + (rows.length === 1 ? "" : "s"));

    var filters = '<div class="hstate">Showing:' +
      [["open", "Open"], ["closed", "Closed"], ["all", "All"]].map(function (o) {
        return '<button class="' + (st === o[0] ? "on" : "") + '" onclick="setHandoffStatus(\'' + o[0] + '\')">' + o[1] + "</button>";
      }).join("") + "</div>";

    var body = rows.length ? rows.map(function (h) {
      var w = h.status === "open" ? waited(h.created_at) : null;
      return '<div class="card" id="h-' + h.id + '">' +
        '<div class="meta"><span class="pill ' + h.status + '">' + esc(h.status) + '</span>' +
        '<span class="pill">' + esc(h.reason) + "</span>" +
        h.created_at.slice(0, 16).replace("T", " ") +
        (w ? ' &middot; <span class="waiting ' + w[1] + '">' + w[0] + "</span>" : "") + "</div>" +
        "<pre>" + esc(h.detail) + "</pre>" +
        // Who to call. A queue row that says a customer wants a callback but
        // not where to reach them is a to-do nobody can action.
        (h.contact_phone
          ? '<div class="contact">Contact: <strong>' + esc(h.contact_name || "Not given") + '</strong> &middot; <a href="' + (h.contact_phone.indexOf("@") > -1 ? "mailto:" : "tel:") + encodeURIComponent(h.contact_phone) + '">' + esc(h.contact_phone) + "</a></div>"
          : '<div class="contact none">No contact details — the customer did not leave a number.</div>') +
        (h.resolution
          ? '<div class="resolution">' + esc(h.resolution) +
            (h.resolved_at ? '<div class="when">closed ' + h.resolved_at.slice(0, 16).replace("T", " ") + "</div>" : "") + "</div>"
          : "") +
        '<div class="transcript" id="t-' + h.id + '"></div>' +
        '<div class="row">' +
          '<button class="btn secondary" onclick="showTranscript(\'' + h.conversation_id + '\',\'' + h.id + '\')">Show conversation</button>' +
          (h.status === "open" ? "" : '<button class="btn secondary" onclick="reopenHandoff(\'' + h.id + '\')">Reopen</button>') +
        "</div>" +
        (h.status === "open"
          ? '<div class="noteform"><input id="n-' + h.id + '" placeholder="What was done? (optional)">' +
            '<button class="btn" onclick="closeHandoff(\'' + h.id + '\')">Mark handled</button></div>'
          : "");
    }).join("") : '<div class="empty">Nothing here. When the assistant cannot answer or a customer complains, it appears in Open.</div>';

    document.getElementById("main").innerHTML = filters + body;
  }).catch(function (e) { setStatus(e.message); });
}

// An operator calling someone back needs to know what they actually asked.
// Without this the only way to find out was to hunt for the conversation in
// another tab by its id.
function showTranscript(conversationId, handoffId) {
  var box = document.getElementById("t-" + handoffId);
  if (box.innerHTML) { box.innerHTML = ""; return; }
  api("/conversations/" + conversationId + "/messages").then(function (msgs) {
    box.innerHTML = msgs.map(function (m) {
      return '<div class="msgline ' + esc(m.role) + '">' + esc(m.text) + "</div>";
    }).join("") || '<div class="empty">No messages.</div>';
  }).catch(function (e) { box.innerHTML = '<div class="empty">' + esc(e.message) + "</div>"; });
}

function reopenHandoff(id) {
  api("/handoffs/" + id + "/reopen", { method: "POST" }).then(loadHandoffs)
    .catch(function (e) { setStatus(e.message); });
}
// ------------------------------------------------ content gaps
// The handoff list is a pile; this is the work queue. Ranked by how many
// customers asked, so the bank writes the most-wanted content first.
function loadGaps() {
  api("/content-gaps").then(function (rows) {
    var asked = rows.reduce(function (n, g) { return n + g.count; }, 0);
    setStatus(rows.length + " distinct gaps across " + asked + " questions");
    document.getElementById("main").innerHTML = rows.length ? rows.map(function (g) {
      var generic = g.reasons["answered_from_general_knowledge"] || 0;
      var none = g.reasons["unanswered_question"] || 0;
      return '<div class="card">' +
        '<div class="meta">' +
          '<span class="pill">asked ' + g.count + '\u00d7</span>' +
          (none ? '<span class="pill open">' + none + ' unanswered</span>' : "") +
          (generic ? '<span class="pill">' + generic + ' answered generically</span>' : "") +
          g.last_asked.slice(0, 16).replace("T", " ") +
        "</div>" +
        "<h3>" + esc(g.examples[0] || g.signature) + "</h3>" +
        (g.examples.length > 1
          ? '<pre>also asked as: ' + g.examples.slice(1).map(esc).join(" | ") + "</pre>"
          : "") +
        "</div>";
    }).join("") : '<div class="empty">No content gaps yet. When customers ask something this bank has no content for, it is grouped and ranked here — the shortest path to knowing what to write next.</div>';
  }).catch(function (e) { setStatus(e.message); });
}

function closeHandoff(id) {
  var field = document.getElementById("n-" + id);
  var note = field ? field.value.trim() : "";
  api("/handoffs/" + id + "/close", {
    method: "POST",
    body: JSON.stringify({ resolution: note || null })
  }).then(loadHandoffs).catch(function (e) { setStatus(e.message); });
}

if (state.slug && state.token) showTab("docs");
</script>
