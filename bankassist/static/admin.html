/* ------------------------------------------------------------ channels
 *
 * Everything about where customers reach the assistant, in one place: the
 * catalogue, the traffic on each, and the control that switches each one on.
 * These used to be three separate things — a read-only table in Settings, an
 * embed snippet in a panel below it, and a Telegram token field below that —
 * which meant the page describing a channel was never the page that connected
 * it. */
function loadChannels() {
  api("/integrations").then(function (cfg) {
    state.channels = cfg.channels || [];
    renderNav();
    // Traffic is a separate question from configuration, and someone may hold
    // integrations.manage without conversations.read. Missing counts degrade
    // to no counts rather than to a broken page.
    if (!can("analytics.read")) return renderChannels(cfg, null);
    api("/analytics?days=" + state.days)
      .then(function (a) { renderChannels(cfg, a); })
      .catch(function () { renderChannels(cfg, null); });
  }).catch(function (e) {
    $("main").innerHTML = '<div class="empty">' + esc(e.message) + "</div>";
  });
}

function renderChannels(cfg, a) {
  var counts = {};
  if (a) a.channels.forEach(function (r) { counts[r.channel] = r.count; });
  var one = state.channel ? channelByKey(state.channel) : null;
  $("main").innerHTML = one
    ? channelDetail(one, cfg, counts[one.key] || 0, a)
    : channelOverview(cfg, counts, a);
  wireChannelForms(cfg);
}

function channelOverview(cfg, counts, a) {
  var live = state.channels.filter(function (c) { return c.status === "live"; }).length;
  return '<div class="panel"><h3>Where customers reach you</h3>' +
    '<div class="meta" style="margin-bottom:14px">' +
    "<strong>" + live + " of " + state.channels.length + "</strong> channels are live. " +
    "The assistant does not care where a message comes from, so a new channel is a " +
    "small adapter rather than a rebuild — Telegram is 41 lines. What takes time is " +
    "the account each platform requires, which is why that is listed rather than " +
    "hidden.</div>" +
    '<div class="chanlist rich">' + state.channels.map(function (c) {
      var st = CHANNEL_PILL[c.status] || ["", null, c.status];
      var n = counts[c.key] || 0;
      // Both the count and the status, unlike the dashboard's tighter list.
      // They can disagree — a channel can carry historic traffic and not be
      // connected right now — and on the page you come to in order to switch
      // something on, that disagreement is the whole point.
      return '<button class="chan' + (c.status === "live" ? "" : " idle") +
        ' clickable" data-channel="' + esc(c.key) + '">' +
        '<span class="dot" style="background:' + seriesColor(CHANNEL_SLOT[c.key]) + '"></span>' +
        '<span class="cname">' + esc(c.name) +
        '<div class="meta">' + esc(c.blurb) + "</div></span>" +
        (n ? '<span class="n">' + num(n) + "</span>" : '<span class="n"></span>') +
        '<span class="pill' + (st[0] ? " " + st[0] : "") + '">' + esc(A(st[1], st[2])) + "</span>" +
        "</button>";
    }).join("") + "</div>" +
    (a ? '<div class="note">Counts are conversations in the last ' + state.days +
      " days. Open a channel for what it needs and how to switch it on.</div>" : "") +
    "</div>";
}

function channelDetail(c, cfg, n, a) {
  var st = CHANNEL_PILL[c.status] || ["", null, c.status];
  var tg = cfg.telegram || {};
  // Hollow unless it is live. A filled dot reads as a status light, and three
  // of the identity hues in this palette are green-ish — WhatsApp's slot among
  // them — so a solid mark beside "Needs setup" says two opposite things.
  var h = '<div class="panel"><div style="display:flex;align-items:center;gap:10px;margin-bottom:10px">' +
    '<span class="dot' + (c.status === "live" ? "" : " hollow") +
    '" style="width:12px;height:12px;border-radius:50%;background:' +
    seriesColor(CHANNEL_SLOT[c.key]) + '"></span>' +
    '<h3 style="margin:0">' + esc(c.name) + "</h3>" +
    '<span class="pill' + (st[0] ? " " + st[0] : "") + '">' + esc(A(st[1], st[2])) + "</span></div>" +
    '<div class="meta">' + esc(c.blurb) + "</div>" +
    (a ? '<div class="oneline" style="margin-top:14px">' +
      (n ? "<b>" + num(n) + "</b> conversation" + (n === 1 ? "" : "s") +
           " in the last " + state.days + " days."
         : "No conversations on this channel in the last " + state.days + " days.") +
      "</div>" : "") +
    "</div>";

  h += '<div class="panel"><h3>What it needs</h3>' +
    (c.needs.length
      ? '<ul style="margin:0;padding-left:18px;line-height:1.7;color:var(--body)">' +
        c.needs.map(function (x) { return "<li>" + esc(x) + "</li>"; }).join("") + "</ul>"
      : '<div class="meta">Nothing. This channel is on by default.</div>') +
    (c.status === "planned"
      ? '<div class="note">The adapter itself is small. We build it once the account ' +
        "above exists, because there is no way to test it — or to be honest about it " +
        "being live — before then.</div>"
      : "") + "</div>";

  // The one control that actually switches this channel on, on the page that
  // describes it.
  if (c.key === "web" && cfg.embed) {
    h += '<div class="panel"><h3>Put the widget on your website</h3>' +
      '<div class="meta" style="margin-bottom:10px">Paste this once, before the closing ' +
      "&lt;/body&gt; tag. It adds a chat button in your own colour and loads nothing " +
      "until a visitor opens it.</div>" +
      '<div class="field"><textarea id="embed-snip" readonly ' +
      'style="min-height:64px;font-family:ui-monospace,monospace;font-size:12.5px">' +
      esc(cfg.embed) + "</textarea></div>" +
      '<button class="btn ghost sm" id="copy-embed">Copy</button></div>';
  } else if (c.key === "telegram") {
    h += '<div class="panel"><h3>Connect your bot</h3>' +
      '<div class="meta" style="margin-bottom:12px">Message @BotFather on Telegram, ' +
      "send /newbot, and paste the token it gives you." +
      (tg.connected ? " Entering a new token replaces the current bot." : "") + "</div>" +
      '<div class="field"><input id="tg-token" placeholder="Bot token from @BotFather" type="password"></div>' +
      '<button class="btn sm" id="tg-save">' + (tg.connected ? "Replace bot" : "Connect") +
      "</button></div>";
  }
  return h;
}

function wireChannelForms(cfg) {
  Array.prototype.forEach.call(document.querySelectorAll("[data-channel]"), function (el) {
    if (el.closest(".side")) return;                 // the rail wires its own
    el.onclick = function () {
      state.channel = el.getAttribute("data-channel");
      go("channels");
    };
  });
  var copy = $("copy-embed");
  if (copy) copy.onclick = function () {
    var box = $("embed-snip");
    box.select();
    // execCommand rather than the clipboard API: this panel is served over
    // plain http in local development, where navigator.clipboard does not
    // exist, and a copy button that silently does nothing is worse than none.
    try { document.execCommand("copy"); setStatus("Embed code copied", "ok"); }
    catch (e) { setStatus("Select the text and copy it manually.", "error"); }
  };
  var save = $("tg-save");
  if (save) save.onclick = function () {
    api("/telegram/connect", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ bot_token: $("tg-token").value.trim() }) })
      .then(function () { setStatus("Telegram connected", "ok"); loadChannels(); })
      .catch(function (e) { setStatus(e.message, "error"); });
  };
}

/* ------------------------------------------------------- live teller queue
 *
 * The page a teller sits on all day, so it is built for one thing: see who is
 * waiting and take them, without reading. Waiting time is the headline on
 * every row because it is the only number that decides which one to take next.
 *
 * Polled rather than pushed. A websocket would be better and is not worth its
 * failure modes yet — a poll that misses a beat shows a stale queue for four
 * seconds, where a dropped socket shows an empty one indefinitely and looks
 * like nobody needs help.
 */
var TELLER_POLL_MS = 4000;
var tellerTimer = null;

function stopTellerPolling() {
  if (tellerTimer) { clearInterval(tellerTimer); tellerTimer = null; }
}

/* Waiting time, in the shape a person reads at a glance. Seconds up to a
   minute, because the difference between 8s and 50s is the difference between
   "take it now" and "take it now". */
function waitedSeconds(sec) {
  if (sec == null) return "";
  if (sec < 60) return sec + "s";
  var m = Math.floor(sec / 60);
  return m < 60 ? m + "m " + (sec % 60) + "s" : Math.floor(m / 60) + "h " + (m % 60) + "m";
}

/* This teller's own numbers — reuses bars(), the same small breakdown the
 * Dashboard's "What happened" panel draws, rather than a donut: this page's
 * job is the live queue, not a report, and the manager-facing deep dive
 * already lives on the Team page. */
function tellerSelfCard(mine) {
  var states = mine.states || {};
  var rows = Object.keys(states).map(function (s) { return { state: s, count: states[s] }; });
  return '<div class="panel"><h3>' + esc(A("your_performance")) + "</h3>" +
    (mine.count
      ? bars(rows, mine.count, function (r) {
          return [A(CALL_STATE_LABEL_KEY[r.state], r.state), callStateClass(r.state), null];
        }) +
        '<div class="note">' + esc(A("avg_wait_before_answering")) + " " +
        esc(waitedSeconds(mine.avg_wait_seconds)) + "</div>"
      : '<div class="empty">' + esc(A("no_calls_yet_window")) + "</div>") +
    "</div>";
}

// Whether the tenant offers live sessions at all, and whether customers can
// see the button right now. Read once per visit rather than on every 4s poll:
// it changes only when somebody toggles it, and re-reading it fifteen times a
// minute per teller would be a request per teller for a value nobody touched.
var tellerSettings = null;
// Refresh the settings strip about every 40s, not on every 4s poll: it changes
// only when someone toggles it or the last teller leaves, and re-reading it
// fifteen times a minute per teller is a request per teller for a value nobody
// touched.
var TELLER_SETTINGS_EVERY = 10;

// A teller's own call count for the "Your performance" card at the bottom of
// this page. Same throttle as the settings strip and for the same reason —
// how many calls you've taken today does not need second-by-second freshness,
// and the server already scopes this to exactly one row (see
// /teller-performance), so there is nothing here worth polling harder for.
var tellerPerf = null;

function loadTellerQueue() {
  stopTellerPolling();
  renderTellerQueue(null);
  var ticks = 0;

  // Read alongside the queue now that presence no longer depends on this
  // page. It used to have to come after the first queue poll, because that
  // poll was what recorded the teller as present — asking "is anyone
  // watching?" first greeted them with "nobody is watching" while they sat
  // looking at it. The shell's heartbeat has already fired by the time any
  // page renders, so the ordering constraint is gone.
  var lastRows = null;
  var settings = function () {
    // The queue still renders if this fails. A settings read going down must
    // not take the page away from a teller with customers waiting on it.
    api("/teller/settings")
      .then(function (s) {
        tellerSettings = s;
        // Repaint on arrival rather than waiting for the next 4s poll. The
        // Live sessions strip and the language pills are both driven by this
        // response, so without it the page's whole top half is missing for
        // the first few seconds of every visit — long enough to read as
        // "this bank has no live sessions".
        if (state.page === "teller" && lastRows !== null) renderTellerQueue(lastRows);
      })
      .catch(function () {});
    if (can("teller.serve")) {
      api("/teller-performance")
        .then(function (p) {
          tellerPerf = p;
          if (state.page === "teller" && lastRows !== null) renderTellerQueue(lastRows);
        })
        .catch(function () {});
    }
  };

  var draw = function () {
    api("/teller/queue").then(function (rows) {
      if (ticks % TELLER_SETTINGS_EVERY === 0) settings();
      ticks += 1;
      lastRows = rows;
      renderTellerQueue(rows);
    }).catch(function (e) {
      stopTellerPolling();
      $("main").innerHTML = '<div class="empty">' + esc(e.message) + "</div>";
    });
  };
  draw();
  tellerTimer = setInterval(function () {
    // Stop the moment the operator navigates away, otherwise every page they
    // visit is quietly polling this one behind it.
    if (state.page !== "teller") { stopTellerPolling(); return; }
    draw();
  }, TELLER_POLL_MS);
}

function renderTellerQueue(rows) {
  if (rows === null) { $("main").innerHTML = '<div class="empty">Loading…</div>'; return; }
  var canServe = can("teller.serve");
  var waiting = rows.filter(function (r) { return r.state === "queued"; });
  var live = rows.filter(function (r) { return r.state === "active"; });

  // Whether customers can reach a person, and — when they cannot — the one
  // fact that fixes it. Three distinct causes, and lumping them into "not
  // available" is what left a bank switched on, staffed, and silent with
  // nothing on screen naming which of the three was wrong.
  var h = "";
  if (tellerSettings) {
    var on = tellerSettings.enabled;
    var live_ = tellerSettings.available;
    var iAmOn = tellerSettings.on_duty;
    // `chanlist rich` rather than a bare row: this line carries a sentence of
    // explanation, and the plain row ellipsises it — the truncated half is
    // the half that says what to do about it.
    h += '<div class="panel"><h3>' + esc(A("live_sessions")) + "</h3>" +
      '<div class="chanlist rich"><div class="chan q">' +
      '<span class="dot" style="background:var(' +
        (live_ ? "--ok" : on ? "--warn" : "--faint") + ')"></span>' +
      '<span class="cname">' +
        esc(!on ? A("switched_off_for_bank")
             : live_ ? (canServe && !iAmOn
                          ? A("customers_reach_colleague")
                          : A("customers_can_reach_teller"))
                     : A("switched_on_nobody_on_duty")) +
      '<div class="meta">' +
        esc(!on
          ? A("no_teller_button")
          : canServe
            ? (iAmOn ? A("on_duty_explainer") : A("off_duty_explainer"))
            : A("colleague_must_be_on_duty")) +
      "</div></span>" +
      (can("integrations.manage")
        ? '<button class="btn sm" id="teller-toggle">' +
          esc(A(on ? "switch_off" : "switch_on")) + "</button>"
        : "") +
      "</div></div>";

    // Which languages this teller speaks. Their own to set — whether you can
    // hold a conversation in Afaan Oromoo is a fact about you, and routing a
    // customer to somebody because a manager ticked a box produces a call
    // where neither party can proceed.
    if (canServe && tellerSettings.all_languages) {
      var mine = tellerSettings.languages || [];
      h += '<div class="meta" style="margin-top:14px">' +
        esc(A("i_can_converse_in")) + "</div>" +
        '<div class="tools" style="margin-top:8px" id="lang-pills">' +
        tellerSettings.all_languages.map(function (l) {
          var picked = mine.indexOf(l.code) !== -1;
          return '<button class="btn sm' + (picked ? "" : " ghost") +
            '" data-lang="' + esc(l.code) + '">' + esc(l.name) + "</button>";
        }).join("") + "</div>" +
        '<div class="note">' +
        esc(A(mine.length ? "languages_picked_note" : "languages_none_note")) + "</div>";
    }
    h += "</div>";
  }

  h += '<div class="row row-half">' +
    '<div class="panel"><h3>' + esc(A("waiting")) + "</h3>" +
    (waiting.length
      ? '<div class="chanlist">' + waiting.map(function (r) {
          return '<div class="chan q">' +
            '<span class="dot" style="background:var(--warn)"></span>' +
            '<span class="cname">' + esc(LANG_NAME[r.language] || A("language_unknown")) +
            // Only flagged when it does NOT match, and only once the teller
            // has declared something. A green tick on every matching row is
            // noise; the row worth a second look is the one you may not be
            // able to talk to.
            (r.speaks === false
              ? ' <span class="pill">' + esc(A("not_your_language")) + "</span>" : "") +
            '<div class="meta">' + esc(A(r.media === "video" ? "media_video" : "media_audio")) +
            " · " + esc(A(r.scope === "verified" ? "identified" : "not_yet_identified")) +
            "</div></span>" +
            '<span class="n">' + esc(waitedSeconds(r.waited_seconds)) + "</span>" +
            (canServe
              ? '<button class="btn sm" data-claim="' + esc(r.id) + '">' +
                esc(A("take")) + "</button>"
              : "") +
            "</div>";
        }).join("") + "</div>"
      : '<div class="empty">' + esc(A("no_one_waiting")) + "</div>") +
    (waiting.length
      // The note has to match what the list is actually doing. With languages
      // declared it is no longer plain oldest-first, and leaving that claim up
      // would have a teller reading the order as a bug.
      ? '<div class="note">' + (
          esc((tellerSettings && (tellerSettings.languages || []).length)
            ? A("languages_first_note") : A("oldest_first"))
        ) + "</div>"
      : "") +
    "</div>" +
    '<div class="panel"><h3>' + esc(A("in_progress")) + "</h3>" +
    (live.length
      ? '<div class="chanlist">' + live.map(function (r) {
          return '<div class="chan q">' +
            '<span class="dot" style="background:var(--ok)"></span>' +
            '<span class="cname">' +
            esc(A(r.scope === "verified" ? "identified" : "not_yet_identified")) +
            '<div class="meta">' + esc(A(r.media === "video" ? "media_video" : "media_audio")) +
            (r.verified_ref ? " · Fayda ••••" + esc(r.verified_ref) : "") +
            "</div></span>" +
            '<span class="n">' + esc(waitedSeconds(r.waited_seconds)) +
            " " + esc(A("wait_suffix")) + "</span>" +
            "</div>";
        }).join("") + "</div>"
      : '<div class="empty">' + esc(A("no_session_in_progress")) + "</div>") +
    "</div></div>";

  // The boundary, on the page rather than in a training deck. A teller who
  // has to remember what they may not do will eventually not remember.
  h += '<div class="panel"><h3>' + esc(A("what_session_covers")) + "</h3>" +
    '<div class="meta">' + esc(A("session_scope_body")) + "</div>" +
    '<div class="note" style="color:var(--bad)">' +
    esc(A("never_money_movement")) + "</div></div>";

  // Own numbers only — never a colleague's, by the same server-side scoping
  // the Team page's manager donut relies on (see /teller-performance). A
  // compact row rather than a donut: this page's job is the live queue, and
  // a big chart competing for space with it would work against that.
  if (canServe && tellerPerf && tellerPerf.tellers.length) {
    h += tellerSelfCard(tellerPerf.tellers[0]);
  }

  $("main").innerHTML = h;
  var toggle = $("teller-toggle");
  if (toggle) {
    toggle.onclick = function () {
      toggle.disabled = true;
      // api() hands opts straight to fetch — it does not serialise a body, so
      // passing an object here would POST the string "[object Object]".
      api("/teller/settings", {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ enabled: !tellerSettings.enabled })
      })
        .then(function (s) {
          tellerSettings = s;
          setStatus(A(s.enabled ? "live_sessions_on" : "live_sessions_off"), "ok");
          renderTellerQueue(rows);
        })
        .catch(function (e) { toggle.disabled = false; setStatus(e.message, "error"); });
    };
  }
  Array.prototype.forEach.call(document.querySelectorAll("[data-lang]"), function (b) {
    b.onclick = function () {
      var code = b.getAttribute("data-lang");
      var mine = (tellerSettings.languages || []).slice();
      var at = mine.indexOf(code);
      if (at === -1) { mine.push(code); } else { mine.splice(at, 1); }
      b.disabled = true;
      api("/teller/languages", {
        method: "PUT", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ languages: mine })
      }).then(function (res) {
        tellerSettings.languages = res.languages;
        setStatus(A("languages_updated"), "ok");
        // Redraw from the server's answer, not the optimistic local copy —
        // it normalises order and drops duplicates, and a list that disagrees
        // with what routing uses is worse than no list.
        loadTellerQueue();
      }).catch(function (e) { b.disabled = false; setStatus(e.message, "error"); });
    };
  });
  Array.prototype.forEach.call(document.querySelectorAll("[data-claim]"), function (b) {
    b.onclick = function () {
      b.disabled = true;   // a double-tap would 409, and the second looks broken
      api("/teller/sessions/" + b.getAttribute("data-claim") + "/claim",
          { method: "POST" })
        // Straight into the call. Claiming and then having to find a second
        // button would leave a customer who has already waited listening to
        // silence while the teller hunts for the way in.
        .then(function (s) { setStatus(A("session_taken"), "ok"); openCall(s); })
        .catch(function (e) { b.disabled = false; setStatus(e.message, "error"); loadTellerQueue(); });
    };
  });
}

/* ------------------------------------------------------ the teller's call */
/* The staff half of a tier-3 session. Deliberately shows three things at
   once — the customer, what they already asked the assistant, and the
   verification bar — because a teller who has to switch tabs to read the
   transcript ends up asking the customer to repeat themselves, and one who
   has to remember the ID checks does them from memory. */

var callRoom = null;      // the LiveKit Room, while connected
var callJoined = false;   // have we actually been in the room?
var callSession = null;   // the TellerSession we are serving
var callSdk = null;       // in-flight SDK load, shared

var CICON = {
  mic:    '<path d="M12 2a3 3 0 0 1 3 3v6a3 3 0 0 1-6 0V5a3 3 0 0 1 3-3z"/><path d="M19 10v1a7 7 0 0 1-14 0v-1M12 19v3"/>',
  micoff: '<path d="M15 9V5a3 3 0 0 0-5.9-.7M9 9v2a3 3 0 0 0 5 2.2"/><path d="M19 10v1a7 7 0 0 1-11 5.7M5 10v1a7 7 0 0 0 2 4.9M12 19v3"/><path d="M2 2l20 20"/>',
  cam:    '<path d="M23 7l-7 5 7 5z"/><rect x="1" y="5" width="15" height="14" rx="2"/>',
  camoff: '<path d="M16 16v2a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h2m5 0h4a2 2 0 0 1 2 2v2l6-4v10"/><path d="M2 2l20 20"/>',
  hang:   '<path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8.1 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2z"/><path d="M23 1L1 23"/>'
};
function cicon(n) {
  return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" ' +
    'stroke-linecap="round" stroke-linejoin="round">' + CICON[n] + "</svg>";
}

function loadCallSdk() {
  if (window.LivekitClient) return Promise.resolve(window.LivekitClient);
  if (callSdk) return callSdk;
  callSdk = new Promise(function (resolve, reject) {
    var s = document.createElement("script");
    s.src = "/vendor/livekit-client.umd.js";
    s.onload = function () {
      window.LivekitClient ? resolve(window.LivekitClient) : reject(new Error("sdk"));
    };
    s.onerror = function () { callSdk = null; reject(new Error("sdk")); };
    document.head.appendChild(s);
  });
  return callSdk;
}

function callMsg(text) { $("callMsg").textContent = text; }

function openCall(session) {
  callSession = session;
  callJoined = false;
  $("callroom").classList.add("open");
  // A person glyph, not initials. We do not know who this is — that is the
  // entire point of the verification bar below — and an avatar reading "EN"
  // (the language code, sliced) implied we did.
  $("callAv").innerHTML = icon("team", 34);
  // The language, where the teller needs it: before they speak. Greeting an
  // Amharic speaker in English is the first thing that goes wrong on a call,
  // and the conversation already knows which it is.
  $("callLang").textContent =
    (LANG_NAME[session.language] || A("language_unknown")) +
    " · " + A(session.media === "video" ? "media_video" : "media_audio");
  callMsg(A("connecting"));
  paintCallControls();
  renderVerify();
  startCallChat();
  loadApprovedAnswers(session.language);

  Promise.all([
    loadCallSdk(),
    api("/teller/sessions/" + session.id + "/token")
  ]).then(function (both) {
    var LK = both[0], grant = both[1];
    var r = new LK.Room({ adaptiveStream: true, dynacast: true });
    callRoom = r;

    r.on(LK.RoomEvent.TrackSubscribed, function (track) {
      if (track.kind === LK.Track.Kind.Video) {
        var host = document.querySelector(".callroom .video");
        var old = host.querySelector("video.remote");
        if (old) old.remove();
        var v = track.attach();
        v.className = "remote";
        v.setAttribute("playsinline", "");
        $("callWaiting").style.display = "none";
        host.insertBefore(v, host.firstChild);
        // The customer's camera has come on — often for the sixty seconds
        // they are holding their Fayda ID up. Offer the freeze, because an ID
        // at arm's length on a moving phone is not readable in motion.
        showFreeze(true);
      } else {
        var a = track.attach();
        a.style.display = "none";
        document.body.appendChild(a);
        // Audio-only is the normal case outside Addis, not a degraded one —
        // so this says connected rather than leaving "Connecting…" up.
        callMsg(A("connected_audio_only"));
      }
    });
    r.on(LK.RoomEvent.TrackUnsubscribed, function (t) {
      t.detach();
      if (t.kind === LK.Track.Kind.Video) { clearFreeze(); showFreeze(false); }
    });
    r.on(LK.RoomEvent.ParticipantDisconnected, function () {
      callMsg(A("customer_left_call"));
      var v = document.querySelector(".callroom video.remote");
      if (v) v.remove();
      $("callWaiting").style.display = "";
    });
    // Guarded on having joined: a FAILED connect fires this too, and tearing
    // the panel down then would hide the error that says what went wrong.
    r.on(LK.RoomEvent.Disconnected, function () {
      if (callJoined) closeCall();
    });

    return r.connect(grant.url, grant.token).then(function () {
      callJoined = true;
      callMsg(A("waiting_for_customer"));
      return r.localParticipant.setMicrophoneEnabled(true).then(function () {
        // Camera only on a video session. A teller's camera coming on during
        // an audio call is a surprise for both of them.
        return session.media === "video"
          ? r.localParticipant.setCameraEnabled(true) : null;
      });
    }).then(function () {
      var pub = r.localParticipant.getTrackPublication(LK.Track.Source.Camera);
      if (pub && pub.track) {
        var holder = $("callSelf");
        holder.innerHTML = "";
        var v = pub.track.attach();
        v.setAttribute("playsinline", "");
        holder.appendChild(v);
        holder.style.display = "block";
      }
      paintCallControls();
    });
  }).catch(function (err) {
    var name = err && err.name;
    if (name === "NotAllowedError" || name === "SecurityError") {
      callMsg(A("mic_blocked"));
    } else {
      callMsg(A("couldnt_connect") + ((err && err.message) || A("unknown_error")));
    }
  });
}

/* The conversation, live. Everything the customer already told the assistant
   plus everything either side types now, in one thread and in one order.

   Polled rather than pushed over LiveKit's data channel — that channel is
   switched off in the token on purpose, so no words pass between a customer
   and a bank employee outside the record. */
var chatPoll = null;

/* The bank's approved wording, searchable while the teller is talking.
 *
 * No teller carries a hundred and sixty answers in their head. Today the
 * bank's own approved text sits one table away from somebody improvising a
 * fee from memory, which is how a call becomes a complaint — and it is the
 * same text the bot serves, so the human and the machine giving different
 * answers to the same question is a bank's worst outcome from both at once.
 *
 * Fetched ONCE when the call opens and filtered in the browser. A teller
 * mid-sentence must not wait on a network round trip, and the connection this
 * is used on is the one that drops. A hundred and sixty short rows is nothing
 * to hold.
 *
 * Published only, and the server does that filtering — see list_faq. A draft
 * is half-written wording and reading it aloud is exactly what draft status
 * exists to prevent.
 */
var approvedAnswers = [];

function loadApprovedAnswers(language) {
  approvedAnswers = [];
  renderAnswers("");
  api("/faq?status=published").then(function (rows) {
    // The customer's language first, then everything else. A teller serving
    // an Amharic speaker wants the Amharic wording at the top, but must still
    // be able to reach the English one — plenty of answers exist in only one
    // language while the translations are still in review.
    approvedAnswers = rows.sort(function (a, b) {
      var am = (a.language === language) ? 0 : 1;
      var bm = (b.language === language) ? 0 : 1;
      if (am !== bm) return am - bm;
      return b.served - a.served;
    });
    renderAnswers($("ansQ") ? $("ansQ").value : "");
  }).catch(function () {
    // A failure here must never interrupt a live call. The teller loses a
    // convenience, not the customer.
    var list = $("ansList");
    if (list) {
      list.innerHTML = '<div class="ansEmpty">' +
        esc(A("approved_answers_unavailable")) + "</div>";
    }
  });
}

function renderAnswers(query) {
  var list = $("ansList");
  if (!list) return;
  var q = (query || "").trim().toLowerCase();
  // Plain substring over question and answer. Rules, not a model: this runs
  // on every keystroke while somebody is speaking, it has to be instant, and
  // a teller mistyping and seeing nothing is easier to recover from than a
  // clever match putting the wrong fee in front of them.
  var hits = approvedAnswers.filter(function (f) {
    if (!q) return true;
    return (f.question + " " + f.answer).toLowerCase().indexOf(q) !== -1;
  }).slice(0, 40);

  if (!approvedAnswers.length) {
    list.innerHTML = '<div class="ansEmpty">' + esc(A("no_approved_answers")) + "</div>";
    return;
  }
  if (!hits.length) {
    list.innerHTML = '<div class="ansEmpty">' +
      esc(A("nothing_matches")) + " “" + esc(query) + "”.</div>";
    return;
  }
  list.innerHTML = hits.map(function (f) {
    return '<div class="ansItem" data-ans="' + esc(f.id) + '">' +
      "<b>" + esc(f.question) + "</b>" +
      "<span>" + esc(f.answer) + "</span></div>";
  }).join("");

  Array.prototype.forEach.call(list.querySelectorAll("[data-ans]"), function (node) {
    node.onclick = function () {
      var row = approvedAnswers.filter(function (f) {
        return f.id === node.getAttribute("data-ans");
      })[0];
      if (!row) return;
      // Fills the composer; never sends. The teller reads it, adapts it to
      // what was actually asked, and takes responsibility for what goes out.
      // Auto-sending would make this a bot with a person watching, which is
      // the opposite of what a customer asked for when they asked for a human.
      var say = $("callSay");
      say.value = row.answer;
      say.focus();
    };
  });
}

function startCallChat() {
  drawThread();
  watchSession();
  stopCallChat();
  chatPoll = setInterval(function () {
    if (!callSession) { stopCallChat(); return; }
    drawThread();
    watchSession();
  }, 3000);
}

/* Has this session ended underneath us?
 *
 * LiveKit's participant-left event is the fast path and it is best-effort: a
 * phone that loses signal, gets backgrounded or is simply switched off never
 * produces a clean disconnect, and the browser waits out a timeout it cannot
 * see. Reported from the field — the customer hung up and this screen stayed
 * in the call, showing a live session with nobody on the other end.
 *
 * So the database is the authority and this asks it every three seconds, on
 * the poll that is already running. Cheap, and it cannot miss.
 */
function watchSession() {
  if (!callSession) return;
  var id = callSession.id;
  api("/teller/sessions/" + id).then(function (s) {
    if (!callSession || callSession.id !== id) return;   // already moved on
    if (s.state === "ended" || s.state === "abandoned" || s.state === "failed") {
      callMsg(A("customer_left_call"));
      // Closed rather than left open with a notice: a finished session on
      // screen is one a teller can keep typing into, and every message after
      // this point goes to somebody who is not there.
      setStatus(A("customer_ended_call"));
      closeCall();
    }
  }).catch(function () {
    // A dropped poll is not an ended call. Retried on the next tick.
  });
}
function stopCallChat() {
  if (chatPoll) { clearInterval(chatPoll); chatPoll = null; }
}

function drawThread() {
  var box = $("callTranscript");
  if (!box || !callSession) return;
  api("/teller/sessions/" + callSession.id + "/messages").then(function (rows) {
    // Hold position if the teller has scrolled up to re-read something —
    // yanking them to the bottom every three seconds makes the panel unusable
    // exactly when they are hunting for a detail.
    var atBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 40;
    if (!rows.length) {
      box.innerHTML = '<div class="empty">' + esc(A("no_messages_yet")) + "</div>"; return;
    }
    // Where the customer asked for a person. This thread deliberately carries
    // the WHOLE conversation, not just the call, so without a mark a teller
    // cannot tell which lines they are joining and which the assistant handled
    // ten minutes — or ten days — earlier.
    var askedAt = callSession.requested_at
      ? new Date(callSession.requested_at).getTime() : null;
    var marked = false;
    box.innerHTML = withDaySeparators(rows, function (m, at) {
      var cls = m.role === "user" ? "user" : m.role === "teller" ? "teller" : "";
      var label = m.role === "teller"
        ? '<div class="rolelbl mine">' + esc(A("you_label")) + "</div>"
        : m.role === "assistant"
          ? '<div class="rolelbl">' + esc(A("assistant_label")) + "</div>" : "";
      var mark = "";
      if (askedAt && !marked && at && new Date(at).getTime() >= askedAt) {
        marked = true;
        mark = '<div class="daysep"><span>' + esc(A("call_started")) + "</span></div>";
      }
      // `text`, not `content` — the endpoint returns {role, text, at}.
      // Getting this wrong renders empty bubbles, which reads as a customer
      // who typed nothing rather than as a bug.
      return mark + label + '<div class="msg2 ' + cls + '" title="' + esc(stampOf(at)) + '">' +
        '<span class="mx">' + esc(m.text) + "</span>" +
        (at ? '<span class="mt">' + esc(clockOf(at)) + "</span>" : "") + "</div>";
    });
    if (atBottom) box.scrollTop = box.scrollHeight;
  }).catch(function () {
    // A failed poll must not take the call down — the teller can still talk.
    if (!box.innerHTML) {
      box.innerHTML = '<div class="empty">' + esc(A("conversation_unavailable")) + "</div>";
    }
  });
}

$("callComposer").onsubmit = function (e) {
  e.preventDefault();
  var input = $("callSay");
  var text = input.value.trim();
  if (!text || !callSession) return;
  input.value = "";
  api("/teller/sessions/" + callSession.id + "/messages", {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ text: text })
  }).then(drawThread).catch(function (err) {
    // Restore it rather than lose it — a teller retyping a reference number
    // because a send failed silently is the worst version of this.
    input.value = text;
    setStatus(err.message, "error");
  });
};

/* The verification bar. The bar itself lives in verification.py — this only
   collects what the teller says they checked. The server refuses anything
   short of a document AND an account question, so a teller ticking one box
   gets a 422 rather than a verified session. */
function renderVerify() {
  var box = $("callVerify");
  if (!callSession) { box.innerHTML = ""; return; }
  if (callSession.scope === "verified") {
    box.innerHTML = '<div class="verified">' + icon("audit", 15) +
      esc(A("identity_confirmed")) +
      (callSession.verified_ref ? " · Fayda ••••" + esc(callSession.verified_ref) : "") +
      "</div>" +
      '<div class="scope">' + esc(A("verified_scope")) + "</div>";
    return;
  }
  box.innerHTML =
    // Identity first, either way, then the account question. Grouped and
    // labelled as two legs rather than presented as a flat list of three
    // ticks, because the rule the server enforces IS two legs — and a teller
    // reading a flat list has no way to tell which combination will be
    // accepted until it is refused.
    '<div class="vleg">' + esc(A("establish_who_they_are")) + "</div>" +
    '<label><input type="checkbox" data-chk="id_document">' +
      "<span>" + esc(A("chk_id_document")) + "</span></label>" +
    '<label><input type="checkbox" data-chk="fayda_matched">' +
      "<span>" + esc(A("chk_fayda_matched")) +
      " <em>(" + esc(A("chk_fayda_matched_note")) + ")</em></span></label>" +
    '<label><input type="checkbox" data-chk="id_photo_matches">' +
      "<span>" + esc(A("chk_id_photo")) +
      " <em>(" + esc(A("chk_video_only")) + ")</em></span></label>" +
    '<div class="vleg">' + esc(A("confirm_account_theirs")) + "</div>" +
    '<label><input type="checkbox" data-chk="account_detail">' +
      "<span>" + esc(A("account_question_answered")) + "</span></label>" +
    '<input type="text" id="vFayda" placeholder="' + esc(A("fayda_number")) +
      '" autocomplete="off">' +
    '<button class="btn sm" id="vGo">' + esc(A("confirm_identity")) + "</button>" +
    '<div class="scope">' + esc(A("unverified_scope")) + "</div>";

  // Ticking "the number matches" without the number is refused by the server,
  // and finding that out after pressing the button — mid-call, with a
  // customer waiting — is the wrong moment. The field says what it needs the
  // instant the box is ticked.
  var faydaBox = box.querySelector('[data-chk="fayda_matched"]');
  var syncFayda = function () {
    $("vFayda").placeholder = A(
      faydaBox.checked ? "fayda_number_required" : "fayda_number_optional");
  };
  faydaBox.addEventListener("change", syncFayda);
  syncFayda();

  $("vGo").onclick = function () {
    var checks = [];
    Array.prototype.forEach.call(box.querySelectorAll("[data-chk]"), function (c) {
      if (c.checked) checks.push(c.getAttribute("data-chk"));
    });
    var fayda = $("vFayda").value.trim();
    $("vGo").disabled = true;
    api("/teller/sessions/" + callSession.id + "/verify", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ checks: checks, fayda_number: fayda || null })
    }).then(function (s) {
      callSession = s;
      setStatus(A("identity_confirmed"), "ok");
      renderVerify();
    }).catch(function (e) {
      $("vGo").disabled = false;
      // The server's own words. It names which check is missing, and
      // paraphrasing it here would drift from the rule being enforced.
      setStatus(e.message, "error");
    });
  };
}

/* ------------------------------------------------------- reading an ID
 *
 * The customer can turn their camera on for a minute to hold up their Fayda
 * ID, including on an audio-only call. A card at arm's length on a handheld
 * phone is not readable while it moves, so the teller can freeze what is
 * already on their screen.
 *
 * Drawn into a canvas in THIS browser. It is not uploaded, not posted
 * anywhere, and not stored — it cannot be, because nothing sends it. That is
 * the same rule the product is sold on: the ID is shown, never kept. A
 * server-side upload would have turned us into the holder of a library of
 * national identity documents in exchange for nothing at all, since the
 * bank's own system is the system of record and the teller is looking at the
 * account there anyway.
 *
 * It clears itself when the customer's camera goes off, so a still of
 * somebody's ID cannot sit on a shared branch screen after the moment has
 * passed.
 */
function clearFreeze() {
  var c = $("callFrozen");
  var ctx = c.getContext("2d");
  if (ctx) ctx.clearRect(0, 0, c.width, c.height);
  c.width = c.height = 0;          // drops the pixel buffer, not just the view
  c.style.display = "none";
  $("callFreeze").textContent = "Freeze frame";
}

function showFreeze(on) {
  $("callFreeze").style.display = on ? "" : "none";
}

function toggleFreeze() {
  var c = $("callFrozen");
  if (c.style.display !== "none") { clearFreeze(); return; }
  var v = document.querySelector(".callroom video.remote");
  if (!v || !v.videoWidth) return;
  c.width = v.videoWidth;
  c.height = v.videoHeight;
  c.getContext("2d").drawImage(v, 0, 0, c.width, c.height);
  c.style.display = "";
  $("callFreeze").textContent = A("back_to_live");
}

function paintCallControls() {
  var hasCam = !!callSession && callSession.media === "video";
  var micOn = true, camOn = hasCam;
  if (callRoom) {
    micOn = callRoom.localParticipant.isMicrophoneEnabled;
    camOn = callRoom.localParticipant.isCameraEnabled;
  }
  var mic = $("cMic");
  mic.innerHTML = cicon(micOn ? "mic" : "micoff");
  mic.classList.toggle("off", !micOn);
  mic.title = A(micOn ? "mute" : "unmute");
  var cam = $("cCam");
  cam.style.display = hasCam ? "grid" : "none";
  cam.innerHTML = cicon(camOn ? "cam" : "camoff");
  cam.classList.toggle("off", !camOn);
  $("cHang").innerHTML = cicon("hang");
}

// Wired once at load rather than per call: the node is in the page markup and
// outlives any single session, so re-binding on every open would stack
// handlers and re-render the list once per call ever taken.
(function wireAnswerSearch() {
  var box = document.getElementById("ansQ");
  if (box) box.addEventListener("input", function () { renderAnswers(box.value); });
})();

function closeCall() {
  if (callRoom) { try { callRoom.disconnect(); } catch (e) {} callRoom = null; }
  stopCallChat();
  callJoined = false;
  callSession = null;
  $("callroom").classList.remove("open");
  var v = document.querySelector(".callroom video.remote");
  if (v) v.remove();
  $("callWaiting").style.display = "";
  $("callSelf").style.display = "none";
  $("callSelf").innerHTML = "";
  // A still of somebody's national ID must not outlive the call it was taken
  // in — branch screens are shared, and the next person to sit down is not
  // the person who was verified.
  clearFreeze();
  showFreeze(false);
  if (state.page === "teller") loadTellerQueue();
}

/* Ending the session, with what it was about. The resolution is the only
   record of WHY someone called — the session row otherwise says a person
   waited four minutes and spoke for six, which answers nothing. */
function hangUpCall() {
  if (!callSession) { closeCall(); return; }
  var id = callSession.id;
  showEndCallModal(function (note) {
    // A cancelled dialog is "I did not mean to hang up", not "end with no
    // note" — the two are one keystroke apart and only one is recoverable.
    if (note === null) return;
    api("/teller/sessions/" + id + "/end", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ resolution: note || null })
    }).then(function () { setStatus(A("session_ended"), "ok"); })
      .catch(function (e) { setStatus(e.message, "error"); })
      .then(closeCall, closeCall);
  });
}

/* A themed dialog for the one free-text prompt this panel needs, in place of
 * the browser's native prompt() — reported live as the one thing on this
 * page that doesn't look like it belongs to it, because it isn't: no theme,
 * no dark background, floating outside the panel's own visual language.
 * Built directly rather than as a generic component — this is the only text
 * prompt in the whole admin panel, so there is nothing else to share it with.
 * `done` receives the typed text, or null if cancelled — same contract
 * prompt() had, so the caller above needed no other change. */
function showEndCallModal(done) {
  var host = document.createElement("div");
  host.className = "modal-overlay";
  host.innerHTML =
    '<div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="endcall-title">' +
    '<h3 id="endcall-title">' + esc(A("session_summary_prompt")) + "</h3>" +
    '<textarea id="endcall-note" style="min-height:100px"></textarea>' +
    '<div class="tools" style="margin-top:14px;justify-content:flex-end">' +
    '<button class="btn ghost" id="endcall-cancel">' + esc(A("cancel")) + "</button>" +
    '<button class="btn" id="endcall-submit">' + esc(A("end_session")) + "</button>" +
    "</div></div>";
  document.body.appendChild(host);

  var textarea = host.querySelector("#endcall-note");
  textarea.focus();

  function finish(value) {
    document.body.removeChild(host);
    document.removeEventListener("keydown", onKey);
    done(value);
  }
  function onKey(e) {
    if (e.key === "Escape") finish(null);
    // Cmd/Ctrl+Enter submits without reaching for the mouse mid-call.
    if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) finish(textarea.value);
  }
  document.addEventListener("keydown", onKey);
  host.querySelector("#endcall-cancel").onclick = function () { finish(null); };
  host.querySelector("#endcall-submit").onclick = function () { finish(textarea.value); };
  // The dim backdrop cancels, same as Escape — only when the click lands on
  // the backdrop itself, not the card, since the card sits inside it.
  host.onclick = function (e) { if (e.target === host) finish(null); };
}

$("cMic").onclick = function () {
  if (!callRoom) return;
  callRoom.localParticipant
    .setMicrophoneEnabled(!callRoom.localParticipant.isMicrophoneEnabled)
    .then(paintCallControls);
};
$("cCam").onclick = function () {
  if (!callRoom) return;
  callRoom.localParticipant
    .setCameraEnabled(!callRoom.localParticipant.isCameraEnabled)
    .then(paintCallControls);
};
$("cHang").onclick = hangUpCall;
$("callFreeze").onclick = toggleFreeze;

// A teller closing the tab mid-call must not leave the customer talking to a
// participant who is gone.
window.addEventListener("pagehide", function () {
  if (callRoom) { try { callRoom.disconnect(); } catch (e) {} }
});

/* ------------------------------------------------------------ settings */
function loadSettings() {
  renderSettings({ handoff_webhook: {}, telegram: {} });
  api("/integrations").then(renderSettings).catch(function () {});
}

function renderSettings(cfg) {
  var hw = cfg.handoff_webhook || {}, br = cfg.branding || {};
  // Channels, the embed snippet and the Telegram token used to live here.
  // They are on the Channels page now — a setting is a preference, and where
  // your customers can reach you is not one.
  $("main").innerHTML =
    '<div class="panel"><h3>' + esc(A("branding")) + "</h3>" +
    '<div class="meta" style="margin-bottom:12px">' + esc(A("branding_help")) + "</div>" +
    '<div class="field"><label>' + esc(A("brand_name")) + "</label>" +
    '<input id="br-short" value="' + esc(br.short_name || "") + '" placeholder="' +
      esc(br.legal_name || "") + '"></div>' +
    '<div class="meta" style="margin-bottom:12px">' +
    esc(A("brand_name_help", null, { legal: br.legal_name || "" })) + "</div>" +
    '<div class="grid2"><div class="field"><label>' + esc(A("brand_colour")) + "</label>" +
    '<div style="display:flex;gap:8px;align-items:center">' +
    '<input type="color" id="br-color" value="' + esc(br.primary_color || "#0f766e") +
      '" style="width:52px;padding:3px;flex:none">' +
    '<input id="br-hex" value="' + esc(br.primary_color || "") + '" placeholder="#722282"></div></div>' +
    '<div class="field"><label>' + esc(A("logo_url")) + "</label>" +
    '<input id="br-logo" value="' + esc(br.logo_url || "") + '" placeholder="https://your-bank.et/logo.png"></div>' +
    "</div>" +
    '<div class="meta" style="margin-bottom:12px">' + esc(A("seeded_colours_help")) + "</div>" +
    '<button class="btn sm" id="br-save">' + esc(A("save_branding")) + "</button></div>" +
    '<div class="panel"><h3>' + esc(A("escalation_webhook")) + "</h3>" +
    '<div style="margin-bottom:10px"><span class="pill ' + (hw.connected ? "on" : "off") + '">' +
      esc(A(hw.connected ? "connected" : "not_connected")) + "</span></div>" +
    '<div class="meta" style="margin-bottom:12px">' + esc(A("webhook_help")) + "</div>" +
    '<div class="field"><input id="hw-url" placeholder="https://your-system.example/hooks/olink" value="' +
      esc(hw.url || "") + '"></div>' +
    (hw.has_secret ? '<div class="meta" style="margin-bottom:10px">' +
      esc(A("signing_secret_set")) + "</div>" : "") +
    '<button class="btn sm" id="hw-save">' + esc(A("save")) + "</button></div>" +
    (state.me ? '<div class="panel"><h3>' + esc(A("your_password")) + "</h3>" +
      '<div class="grid2"><div class="field"><label>' + esc(A("current_password")) +
        '</label><input id="pw-old" type="password"></div>' +
      '<div class="field"><label>' + esc(A("new_password_12")) +
        '</label><input id="pw-new" type="password"></div></div>' +
      '<div class="meta" style="margin-bottom:12px">' + esc(A("password_change_help")) + "</div>" +
      '<button class="btn sm" id="pw-save">' + esc(A("change_password")) + "</button></div>" : "");

  $("hw-save").onclick = function () {
    api("/handoff-webhook", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ url: $("hw-url").value.trim() || null }) })
      .then(function (r) {
        setStatus(A(r.connected ? "webhook_connected" : "webhook_disconnected"), "ok");
        loadSettings();
      })
      .catch(function (e) { setStatus(e.message, "error"); });
  };
  // Keep the swatch and the hex box showing the same value, whichever is used.
  $("br-color").oninput = function () { $("br-hex").value = $("br-color").value; };
  $("br-hex").oninput = function () {
    if (/^#(?:[0-9a-fA-F]{3}|[0-9a-fA-F]{6})$/.test($("br-hex").value)) {
      $("br-color").value = $("br-hex").value;
    }
  };
  $("br-save").onclick = function () {
    api("/branding", { method: "PUT", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        primary_color: $("br-hex").value.trim() || $("br-color").value,
        logo_url: $("br-logo").value.trim() || null,
        short_name: $("br-short").value.trim() || null
      }) })
      .then(function () { setStatus(A("branding_saved"), "ok"); applyBrand(state.slug); loadSettings(); })
      .catch(function (e) { setStatus(e.message, "error"); });
  };
  if ($("pw-save")) {
    $("pw-save").onclick = function () {
      api("/me/password", { method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ current_password: $("pw-old").value, new_password: $("pw-new").value }) })
        .then(function () { setStatus(A("password_changed"), "ok"); $("pw-old").value = ""; $("pw-new").value = ""; })
        .catch(function (e) { setStatus(e.message, "error"); });
    };
  }
}

/* ------------------------------------------------------------ theme
   Dark is the default because that is what was asked for and what the rest of
   the Olink products use. The choice is remembered per browser, and print
   always uses the light palette regardless — see the print block. */
function applyTheme(name) {
  if (name === "light") document.documentElement.setAttribute("data-theme", "light");
  else document.documentElement.removeAttribute("data-theme");
  localStorage.setItem("ba_theme", name);
  var g = $("theme-glyph");
  if (g) g.textContent = name === "light" ? "☀" : "☾";
}

function applyRail(mode) {
  if (mode === "mini") document.documentElement.setAttribute("data-rail", "mini");
  else document.documentElement.removeAttribute("data-rail");
  localStorage.setItem("ba_rail", mode);
  var g = $("rail-glyph");
  if (g) g.textContent = mode === "mini" ? "››" : "‹‹";
  var lbl = $("rail-label");
  if (lbl) lbl.textContent = A(mode === "mini" ? "expand" : "collapse");
}

/* ------------------------------------------------------------ boot */
applyTheme(localStorage.getItem("ba_theme") || "dark");
applyRail(localStorage.getItem("ba_rail") || "full");
$("rail-toggle").onclick = function () {
  applyRail(localStorage.getItem("ba_rail") === "mini" ? "full" : "mini");
};
$("theme-toggle").onclick = function () {
  applyTheme(localStorage.getItem("ba_theme") === "light" ? "dark" : "light");
};

/* Reload whatever is on screen, without a full page load that would drop the
   filters and the scroll position someone is working in. */
$("refresh").innerHTML = icon("refresh", 16);
$("refresh").onclick = function () {
  if (!state.page) return;
  var svg = $("refresh").firstChild;
  if (svg && svg.classList) svg.classList.add("spin");
  refreshBadge();
  go(state.page);
  // Long enough that the spin registers as an action taken. Without it a fast
  // response looks like a dead button.
  setTimeout(function () { if (svg && svg.classList) svg.classList.remove("spin"); }, 550);
};
$("queue-btn").onclick = function () {
  if (!can("handoffs.read")) return;
  state.hstatus = "open";
  go("handoffs");
};
// Once a minute is the resolution the stamp is rounded to, so anything faster
// would repaint the same string.
setInterval(renderStamp, 60000);
$("slug").value = state.slug;
$("signin-btn").onclick = signInWithPassword;
$("token-btn").onclick = signInWithToken;
$("signout").onclick = signOut;
$("to-token").onclick = function () { $("pw-mode").classList.add("hidden"); $("token-mode").classList.remove("hidden"); gateError(""); };
$("to-pw").onclick = function () { $("token-mode").classList.add("hidden"); $("pw-mode").classList.remove("hidden"); gateError(""); };
$("slug").onchange = function () { applyBrand($("slug").value.trim()); };
["password", "email"].forEach(function (id) {
  $(id).onkeydown = function (e) { if (e.key === "Enter") signInWithPassword(); };
});
$("token").onkeydown = function (e) { if (e.key === "Enter") signInWithToken(); };
if (state.slug) applyBrand(state.slug);

/* A session cookie may already be valid from a previous visit, so try to
   resume before showing the sign-in screen. Failure is the normal case and is
   silent — it just means signing in. */
if (state.slug) {
  fetch("/admin/api/" + encodeURIComponent(state.slug) + "/me", { credentials: "same-origin" })
    .then(function (r) { return r.ok ? r.json() : null; })
    .then(function (me) { if (me) { state.me = me; enterApp(); } })
    .catch(function () {});
}
