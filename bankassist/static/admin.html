      "content did not answer, grouped by what was asked and ranked by how often. " +
      "Writing one article that answers twenty people beats writing twenty that answer " +
      "one, so work down from the top." +
      (writable ? " <strong>Write an article</strong> opens the editor with the question " +
        "already in the title." : "") + "</div></div>";

    if (!rows.length) {
      h += '<div class="panel"><div class="empty">Nothing here — every question so far ' +
        "was answerable from your own content.<br>This page fills itself as customers " +
        "ask things you have not published yet.</div></div>";
      $("main").innerHTML = h;
      return;
    }

    h += rows.map(function (g, i) {
      var langs = Object.keys(g.languages || {}).sort(function (a, b) {
        return g.languages[b] - g.languages[a];
      });
      var reasons = Object.keys(g.reasons || {});
      return '<div class="panel gap">' +
        '<div class="gaphead">' +
        '<div class="rank">' + g.count + "&times;</div>" +
        '<div style="flex:1;min-width:0">' +
        '<div class="gapq">' + esc(g.examples[0] || "(no wording recorded)") + "</div>" +
        '<div class="gapmeta">' +
          reasons.map(function (r) {
            return '<span class="pill ' + (r === "unanswered_question" ? "off" : "") + '">' +
              esc(GAP_REASON[r] || r) + " " + g.reasons[r] + "</span>";
          }).join("") +
          langs.map(function (l) {
            return '<span class="pill">' + esc(LANG_NAME[l] || l) + " " + g.languages[l] + "</span>";
          }).join("") +
          (g.open_count ? '<span class="pill open">' + g.open_count + " still open</span>" : "") +
          '<span class="meta">last asked ' + esc(ago(g.last_asked)) + "</span>" +
        "</div></div>" +
        (writable ? '<button class="btn sm" data-write="' + i + '">Write an article</button>' : "") +
        "</div>" +
        // The other wordings matter: they are how the same question gets asked,
        // and an article that only matches one phrasing answers one of them.
        (g.examples.length > 1
          ? '<div class="alsoasked"><span class="meta">Also asked as</span>' +
            g.examples.slice(1).map(function (e) {
              return "<div>" + esc(e) + "</div>";
            }).join("") + "</div>"
          : "") +
        "</div>";
    }).join("");

    $("main").innerHTML = h;
    state.gaps = rows;
    wire("[data-write]", "write", function (i) {
      var g = state.gaps[parseInt(i, 10)];
      state.draftFromGap = {
        title: g.examples[0] || "",
        examples: g.examples,
        count: g.count,
        language: Object.keys(g.languages || {})[0] || "en"
      };
      go("docs");
    });
  }).catch(function (e) { $("main").innerHTML = '<div class="empty">' + esc(e.message) + "</div>"; });
}

/* ------------------------------------------------------------ audit log
 *
 * The record an access review asks for. Distinct from the dashboard's activity
 * feed, which drops sign-ins and shows a dozen rows: that answers "what
 * changed lately", this answers "show me everything this person did" and drops
 * nothing.
 */
var AUDIT_PAGE = 50;

function loadAudit(page) {
  state.auditPage = page || 0;
  var q = "?limit=" + AUDIT_PAGE + "&offset=" + (state.auditPage * AUDIT_PAGE) +
    (state.auditAction ? "&action=" + encodeURIComponent(state.auditAction) : "") +
    (state.auditActor ? "&actor=" + encodeURIComponent(state.auditActor) : "");
  api("/audit" + q).then(function (d) {
    state.audit = d;
    var from = d.offset + 1, to = Math.min(d.offset + d.entries.length, d.total);

    var h = '<div class="tools">' +
      '<select id="a-action" style="width:auto"><option value="">All actions</option>' +
      d.actions.map(function (a) {
        return '<option value="' + esc(a) + '"' +
          (state.auditAction === a ? " selected" : "") + ">" +
          esc(ACTION_LABEL[a] || a.replace(/_/g, " ")) + "</option>";
      }).join("") + "</select>" +
      (state.auditActor
        ? '<span class="pill">one person</span><button class="linky" id="a-clear">Show everyone</button>'
        : "") +
      '<div style="flex:1"></div>' +
      // The total, not just the page. "50 entries" and "50 of 4,300" are
      // different answers and only one of them is honest.
      '<span class="meta">' + (d.total ? from + "–" + to + " of " + num(d.total) : "0") +
      " entries</span>" +
      '<button class="btn ghost sm" id="a-csv">Export CSV</button></div>';

    h += '<div class="panel">' + (d.entries.length
      ? "<table><thead><tr><th>When</th><th>Who</th><th>Action</th>" +
        "<th>On</th><th>Details</th></tr></thead><tbody>" +
        d.entries.map(function (e) {
          return "<tr><td class='meta' style='white-space:nowrap'>" +
            esc(new Date(e.at).toLocaleString()) + "</td>" +
            "<td>" + (e.actor.by_token
              ? '<span class="pill off">Admin token</span>'
              // The name IS the filter. A separate "only this person" link under
              // every row was thirty-one links down one column — an affordance
              // repeated until it becomes noise, which is how a table stops
              // being readable.
              : '<button class="whobtn" data-only="' + esc(e.id) + '" ' +
                'title="Show only this person">' + esc(e.actor.name) + "</button>" +
                (e.actor.email && e.actor.email !== e.actor.name
                  ? '<div class="meta">' + esc(e.actor.email) + "</div>" : "")) +
            "</td>" +
            "<td>" + esc(ACTION_LABEL[e.action] || e.action.replace(/_/g, " ")) + "</td>" +
            "<td class='meta'>" + esc(e.entity_type) + "</td>" +
            "<td class='meta'>" + esc(describeMeta(e.metadata)) + "</td></tr>";
        }).join("") + "</tbody></table>"
      : '<div class="empty">No entries match.</div>') + "</div>";

    var pages = Math.ceil(d.total / AUDIT_PAGE);
    if (pages > 1) {
      h += '<div class="tools" style="justify-content:center">' +
        '<button class="btn ghost sm" id="a-prev"' + (state.auditPage ? "" : " disabled") +
        ">Previous</button>" +
        '<span class="meta">Page ' + (state.auditPage + 1) + " of " + pages + "</span>" +
        '<button class="btn ghost sm" id="a-next"' +
        (state.auditPage + 1 < pages ? "" : " disabled") + ">Next</button></div>";
    }

    $("main").innerHTML = h;
    $("a-action").onchange = function () {
      state.auditAction = $("a-action").value || null;
      loadAudit(0);
    };
    if ($("a-clear")) {
      $("a-clear").onclick = function () { state.auditActor = null; loadAudit(0); };
    }
    if ($("a-prev")) $("a-prev").onclick = function () { loadAudit(state.auditPage - 1); };
    if ($("a-next")) $("a-next").onclick = function () { loadAudit(state.auditPage + 1); };
    $("a-csv").onclick = exportAudit;
    wire("[data-only]", "only", function (id) {
      var row = state.audit.entries.filter(function (e) { return String(e.id) === id; })[0];
      if (!row) return;
      // Filtered by the stored actor id, not the display name — two colleagues
      // can share a name and an audit filter must not merge them.
      state.auditActor = row.actor_id;
      loadAudit(0);
    });
  }).catch(function (e) { $("main").innerHTML = '<div class="empty">' + esc(e.message) + "</div>"; });
}

/* Metadata rendered as facts rather than as raw JSON. A reviewer reading
   {"sessions_revoked": 1} has to decode it; "1 session ended" they can read. */
function describeMeta(m) {
  var bits = [];
  if (m.email) bits.push(m.email);
  if (m.role) bits.push("role: " + m.role);
  if (m.title) bits.push(m.title);
  if (m.url) bits.push(m.url);
  if (m.chunks != null) bits.push(m.chunks + " chunks");
  if (m.count != null) bits.push(m.count + " documents");
  if (m.sessions_revoked) bits.push(m.sessions_revoked + " session(s) ended");
  if (m.primary_color) bits.push(m.primary_color);
  if (m.short_name) bits.push("brand: " + m.short_name);
  if (m.had_resolution != null) bits.push(m.had_resolution ? "with a note" : "no note");
  return bits.join(" · ");
}

function exportAudit() {
  var d = state.audit;
  if (!d) return;
  var lines = [["When", "Who", "Email", "Action", "Entity", "Entity id", "Details"].join(",")];
  d.entries.forEach(function (e) {
    lines.push([e.at, e.actor.name, e.actor.email || "", e.action,
                e.entity_type, e.entity_id, describeMeta(e.metadata)].map(csvCell).join(","));
  });
  // Names the page, because an export of page 2 of 87 that looks like the whole
  // log is how a reviewer reaches a wrong conclusion.
  download("audit-log-page-" + (state.auditPage + 1) + ".csv",
           "\ufeff" + lines.join("\r\n"), "text/csv;charset=utf-8");
}

/* ------------------------------------------------------------ team */
function loadTeam() {
  Promise.all([api("/users"), api("/roles")]).then(function (res) {
    var users = res[0], rolesList = res[1];
    var h = '<div class="tools"><button class="btn sm" id="new-user">Add person</button>' +
      '<div style="flex:1"></div><span class="meta">' + users.length + " account" +
      (users.length === 1 ? "" : "s") + "</span></div><div id=\"user-form\"></div>";

    h += '<div class="panel"><table><thead><tr>' +
      "<th>Person</th><th>Role</th><th>Status</th><th>Last signed in</th>" +
      '<th style="text-align:right">Actions</th></tr></thead><tbody>' +
      users.map(function (u) {
        return "<tr><td class='title'>" + esc(u.display_name || u.email) +
          (u.display_name ? '<div class="meta">' + esc(u.email) + "</div>" : "") +
          (u.is_you ? '<div class="meta">that’s you</div>' : "") + "</td>" +
          '<td><span class="pill">' + esc(u.role) + "</span></td>" +
          '<td><span class="pill ' + (u.is_active ? "on" : "off") + '">' +
            (u.is_active ? "Active" : "Disabled") + "</span></td>" +
          '<td class="meta">' + (u.last_login_at ? new Date(u.last_login_at).toLocaleString() : "never") + "</td>" +
          '<td><div class="rowacts">' + (u.is_you
            ? '<span class="meta">—</span>'
            : '<button class="btn ghost sm" data-active="' + esc(u.id) + '" data-to="' +
              (u.is_active ? "0" : "1") + '">' + (u.is_active ? "Disable" : "Restore") + "</button>") +
          "</div></td></tr>";
      }).join("") + "</tbody></table></div>";

    /* The permission matrix, generated from the rows require() actually
       checks. A matrix kept in a document drifts from the system; this one
       cannot, because it is the system. */
    h += '<div class="panel"><h3>What each role can do</h3>' +
      rolesList.map(function (r) {
        return '<div style="margin-bottom:14px"><strong>' + esc(r.name) + "</strong>" +
          (r.is_builtin ? ' <span class="pill">built-in</span>' : "") +
          (r.description ? '<div class="meta" style="margin:3px 0 7px">' + esc(r.description) + "</div>" : "") +
          "<div>" + r.permissions.map(function (p) {
            return '<span class="perm">' + esc(p) + "</span>"; }).join("") + "</div></div>";
      }).join("") + "</div>";

    $("main").innerHTML = h;
    state.roleNames = rolesList.map(function (r) { return r.name; });
    $("new-user").onclick = userForm;
    wire("[data-active]", "active", function (id, el) {
      setUserActive(id, el.getAttribute("data-to") === "1");
    });
  }).catch(function (e) { $("main").innerHTML = '<div class="empty">' + esc(e.message) + "</div>"; });
}

  $("user-form").innerHTML = '<div class="panel"><h3>Add a person</h3>' +
    '<div class="grid2"><div class="field"><label>Email</label><input id="u-email" type="email"></div>' +
    '<div class="field"><label>Name (optional)</label><input id="u-name"></div></div>' +
    '<div class="grid2"><div class="field"><label>Role</label><select id="u-role">' +
    (state.roleNames || []).map(function (r) { return "<option>" + esc(r) + "</option>"; }).join("") +
    "</select></div>" +

    '<div class="meta" style="margin-bottom:12px">At least 12 characters. Until invitation emails are set up, ' +
    'this password has to be given to them directly — which is why it is shown here rather than hidden.</div>' +
    '<div class="tools"><button class="btn" id="u-save">Create</button>' +
    '<button class="btn ghost" id="u-cancel">Cancel</button></div></div>';

  $("u-save").onclick = function () {
    api("/users", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        email: $("u-email").value.trim(), display_name: $("u-name").value.trim() || null,

function setUserActive(id, active) {
  if (!active && !confirm("Disable this account? They will be signed out immediately.")) return;
  api("/users/" + id + "/active", { method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ is_active: active }) })
    .then(function (r) {
      setStatus(active ? "Account restored" : "Account disabled, " + r.sessions_revoked + " session(s) ended");
      loadTeam();
    }).catch(function (e) { setStatus(e.message); });
}

      catch (e) { setStatus("Select the text and copy it manually."); }

        .catch(function (e) { setStatus(e.message); });
    };
  }
}

/* ------------------------------------------------------------ theme
   Dark is the default because that is what was asked for and what the rest of
   the Olink products use. The choice is remembered per browser, and print
   always uses the light palette regardless — see the print block. */
function applyTheme(name) {
  if (name === "light") document.documentElement.setAttribute("data-theme", "light");
  else document.documentElement.removeAttribute("data-theme");
  localStorage.setItem("ba_theme", name);
  var g = $("theme-glyph");
  if (g) g.textContent = name === "light" ? "☀" : "☾";
}

function applyRail(mode) {
  if (mode === "mini") document.documentElement.setAttribute("data-rail", "mini");
  else document.documentElement.removeAttribute("data-rail");
  localStorage.setItem("ba_rail", mode);
  var g = $("rail-glyph");
  if (g) g.textContent = mode === "mini" ? "››" : "‹‹";
}

/* ------------------------------------------------------------ boot */

applyRail(localStorage.getItem("ba_rail") || "full");
$("rail-toggle").onclick = function () {
  applyRail(localStorage.getItem("ba_rail") === "mini" ? "full" : "mini");
};
$("theme-toggle").onclick = function () {
  applyTheme(localStorage.getItem("ba_theme") === "light" ? "dark" : "light");
};

  $(id).onkeydown = function (e) { if (e.key === "Enter") signInWithPassword(); };
});
$("token").onkeydown = function (e) { if (e.key === "Enter") signInWithToken(); };
if (state.slug) applyBrand(state.slug);

/* A session cookie may already be valid from a previous visit, so try to
   resume before showing the sign-in screen. Failure is the normal case and is
   silent — it just means signing in. */
if (state.slug) {
  fetch("/admin/api/" + encodeURIComponent(state.slug) + "/me", { credentials: "same-origin" })
    .then(function (r) { return r.ok ? r.json() : null; })
    .then(function (me) { if (me) { state.me = me; enterApp(); } })
    .catch(function () {});
}
</script>
</body>
</html>
