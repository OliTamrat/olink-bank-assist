<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bank Assist</title>
<style>
  :root { --brand: #0f766e; }
  * { box-sizing: border-box; margin: 0; }
  body {
    font-family: "Noto Sans Ethiopic", "Segoe UI", system-ui, sans-serif;
    background: #f1f5f9; height: 100vh; display: flex; flex-direction: column;
  }
  header {
    background: var(--brand); color: #fff; padding: 14px 18px;
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
  }
  header .name { font-weight: 700; font-size: 16px; }
  header .sub { font-size: 11px; opacity: .85; }
  header select {
    border: none; border-radius: 8px; padding: 6px 8px; font-size: 13px;
    background: rgba(255,255,255,.92); color: #111;
  }
  #chat { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: 82%; padding: 10px 14px; border-radius: 14px; font-size: 14.5px;
         line-height: 1.45; white-space: pre-wrap; word-break: break-word; }
  .user { align-self: flex-end; background: var(--brand); color: #fff; border-bottom-right-radius: 4px; }
  .bot  { align-self: flex-start; background: #fff; color: #0f172a; border: 1px solid #e2e8f0;
          border-bottom-left-radius: 4px; box-shadow: 0 1px 2px rgba(0,0,0,.04); }
  .srcs { align-self: flex-start; font-size: 11.5px; color: #64748b; margin: -4px 0 0 6px; }
  .typing { align-self: flex-start; color: #94a3b8; font-size: 13px; padding: 4px 8px; }
  form { display: flex; gap: 8px; padding: 12px 14px; background: #fff; border-top: 1px solid #e2e8f0; }
  input[type=text] {
    flex: 1; border: 1px solid #cbd5e1; border-radius: 10px; padding: 11px 14px;
    font-size: 14.5px; font-family: inherit; outline-color: var(--brand);
  }
  button {
    background: var(--brand); color: #fff; border: none; border-radius: 10px;
    padding: 0 20px; font-size: 14.5px; font-weight: 600; cursor: pointer;
  }
  button:disabled { opacity: .5; cursor: default; }
  .notice { text-align: center; font-size: 11px; color: #94a3b8; padding: 4px 10px 8px; background:#fff; }
  .disclaimer {
    text-align: center; font-size: 11.5px; font-weight: 600; color: #7c2d12;
    background: #fef3c7; padding: 7px 12px; border-bottom: 1px solid #fde68a; display: none;
  }
</style>
</head>
<body>
<div class="disclaimer" id="disclaimer"></div>
<header>
  <div>
    <div class="name" id="bankName">…</div>
    <div class="sub" id="assistLabel">Virtual assistant</div>
  </div>
  <select id="lang" title="Language"></select>
</header>
<div id="chat"></div>
<form id="form">
  <input id="input" type="text" autocomplete="off" placeholder="Ask about accounts, transfers, loans…">
  <button id="send" type="submit">Send</button>
</form>
<div class="notice">Answers come from the bank's official information. General education only — not personal investment advice.</div>
<script>
(function () {
  var params = new URLSearchParams(location.search);
  var slug = params.get("bank") || "demo";
  var api = location.origin;
  var conversationId = null;
  var chat = document.getElementById("chat");
  var input = document.getElementById("input");
  var send = document.getElementById("send");
  var langSel = document.getElementById("lang");

  function addMsg(text, cls) {
    var el = document.createElement("div");
    el.className = "msg " + cls;
    el.textContent = text;
    chat.appendChild(el);
    chat.scrollTop = chat.scrollHeight;
    return el;
  }
  function addSources(sources) {
    if (!sources || !sources.length) return;
    var el = document.createElement("div");
    el.className = "srcs";
    el.textContent = "Source: " + sources.map(function (s) { return s.title; }).join(" · ");
    chat.appendChild(el);
    chat.scrollTop = chat.scrollHeight;
  }

  fetch(api + "/banks/" + encodeURIComponent(slug) + "/public")
    .then(function (r) { if (!r.ok) throw new Error("bank"); return r.json(); })
    .then(function (cfg) {
      document.getElementById("bankName").textContent = cfg.name;
      document.title = cfg.name + " — Assistant";
      document.documentElement.style.setProperty("--brand", cfg.primary_color);
      if (cfg.disclaimer) {
        var d = document.getElementById("disclaimer");
        d.textContent = cfg.disclaimer;
        d.style.display = "block";
      }
      var auto = document.createElement("option");
      auto.value = ""; auto.textContent = "Auto";
      langSel.appendChild(auto);
      cfg.languages.forEach(function (l) {
        var o = document.createElement("option");
        o.value = l.code; o.textContent = l.name;
        langSel.appendChild(o);
      });
      addMsg("Selam! Ask me anything about " + cfg.name + " — accounts, transfers, loans, saving. ሰላም! በአማርኛም መጠየቅ ይችላሉ።", "bot");
    })
    .catch(function () {
      document.getElementById("bankName").textContent = "Bank not found";
      input.disabled = true; send.disabled = true;
    });

  document.getElementById("form").addEventListener("submit", function (e) {
    e.preventDefault();
    var text = input.value.trim();
    if (!text) return;
    addMsg(text, "user");
    input.value = "";
    send.disabled = true;
    var typing = document.createElement("div");
    typing.className = "typing"; typing.textContent = "…";
    chat.appendChild(typing);

    var body = { message: text, conversation_id: conversationId };
    if (langSel.value) body.language = langSel.value;

    fetch(api + "/chat/" + encodeURIComponent(slug), {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body)
    })
      .then(function (r) { if (!r.ok) throw new Error("chat"); return r.json(); })
      .then(function (data) {
        conversationId = data.conversation_id;
        typing.remove();
        addMsg(data.reply, "bot");
        addSources(data.sources);
      })
      .catch(function () {
        typing.remove();
        addMsg("Sorry — something went wrong. Please try again.", "bot");
      })
      .finally(function () { send.disabled = false; input.focus(); });
  });
})();
</script>
</body>
</html>
