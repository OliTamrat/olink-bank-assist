<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bank Assist</title>
<style>
  /* The brand hue is injected per tenant from the bank's primary_color, so
     everything else stays neutral — an arbitrary brand color (CBE's deep
     maroon, Dashen's blue) has to look deliberate against this shell. */
  :root {
    --brand: #0f766e;
    --bg: #fbfbfd;
    --surface: #ffffff;
    --surface-2: #f4f5f8;
    --line: #e5e7ec;
    --text: #14161a;
    --text-2: #5b6270;
    --text-3: #8b93a1;
    --radius: 16px;
    --shadow: 0 1px 2px rgba(16,18,24,.04), 0 8px 24px -12px rgba(16,18,24,.10);
    /* Accent for small glyphs/numerals. A tenant brand can be very dark
       (CBE's maroon), which disappears against the dark shell — so dark mode
       lifts it toward white rather than using --brand raw. */
    --accent: var(--brand);
    --on-brand: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --accent: color-mix(in srgb, var(--brand) 45%, #ffffff);
      --bg: #0c0d10;
      --surface: #141619;
      --surface-2: #1b1e23;
      --line: #262a31;
      --text: #f2f3f5;
      --text-2: #a3aab8;
      --text-3: #6f7787;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px -12px rgba(0,0,0,.6);
    }
  }

  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; max-width: 100%; overflow-x: hidden; }
  body {
    font-family: "Noto Sans Ethiopic", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    background: var(--bg); color: var(--text);
    display: flex; flex-direction: column;
    -webkit-font-smoothing: antialiased;
  }

  /* ---------------------------------------------------------- header */
  /* The header is the tenant's brand real-estate. An earlier pass made the
     whole shell neutral with the brand reduced to small accents, and three
     tenants became near-indistinguishable — the opposite of what a
     white-label product is sold on. --on-brand is computed from the brand's
     luminance in JS so a light brand colour gets dark text instead of
     unreadable white. */
  header {
    display: flex; align-items: center; gap: 12px;
    padding: 14px 18px;
    background: var(--brand);
    color: var(--on-brand);
    position: relative; z-index: 2;
  }
  .mark {
    width: 40px; height: 40px; border-radius: 12px; flex: none;
    background: color-mix(in srgb, var(--on-brand) 16%, transparent);
    border: 1px solid color-mix(in srgb, var(--on-brand) 26%, transparent);
    display: grid; place-items: center; overflow: hidden;
    color: var(--on-brand); font-weight: 700; font-size: 15px;
    letter-spacing: -.02em;
  }
  /* A tenant-supplied logo replaces the initials when one is configured.

     The tile stops being a square once there is one in it — see the longer
     note in admin.html. Banks send both compact marks and full lockups under
     the same field, and squeezing a 4:1 lockup into a 40px square letterboxes
     it into a strip with bars above and below. Width follows the image at a
     fixed height instead, so the plate hugs the artwork exactly.

     White rather than the translucent wash the initials use: this sits on the
     bank's own brand colour, and a logo drawn for paper disappears into it. */
  .mark img { width: 100%; height: 100%; object-fit: contain; }
  /* No padding: a logo with its own background turns any inset into a visible
     white frame, which is the letterboxing complaint in a different shape. */
  /* Two maxima on the image, container hugging it — see the longer note in
     admin.html for why a percentage height and object-fit both fail here.

     `border: 0`, not a transparent border: the white plate paints under the
     border box, so a see-through border renders as a 1px white ring around
     the artwork on the bank's own brand colour. */
  /* The white ground lives on the IMAGE, not on the tile behind it.

     Painting it on the container stacks two rounded shapes: the background
     antialiases white-to-transparent around the corner while the clipped
     image antialiases artwork-to-transparent, and wherever the image's alpha
     is below 1 the white shows through as a hairline arc. One element
     painting both the ground and the content clips once and has no seam.

     The ground still does its job — invisible behind an opaque logo, a full
     white field behind a transparent one drawn for paper. */
  /* The white ground is INSET by 1px behind the image, not painted on the
     same box.

     A rounded box that paints white and then draws the logo over it composites
     twice at every partially-covered corner pixel — the result is white*a*(1-a),
     a visible hairline arc that peaks at 25% white. Isolated by probe: the
     artifact needs the background and the radius together, and drops either one
     and it vanishes. Since neither is expendable, the ground moves off the
     image's own edge instead. An opaque logo hides it completely; a
     transparent one drawn for paper still gets a full white field. */
  .mark.haslogo {
    position: relative; width: auto; height: auto; max-width: 156px;
    padding: 0; border: 0; background: none; display: block; overflow: visible;
  }
  .mark.haslogo::before {
    content: ""; position: absolute; inset: 1px;
    background: #fff; border-radius: 7px;
  }
  .mark.haslogo img {
    position: relative; display: block; width: auto; height: auto;
    max-width: 156px; max-height: 36px; border-radius: 8px;
  }
  /* A lockup already says the bank's name; the header would print it twice. */
  header[data-logo="wide"] .who .name { display: none; }
  .who { min-width: 0; flex: 1; }
  /* Wrap to two lines rather than truncate — on a prospect demo the bank's
     own name is the one string that must never read "Commercial Bank of…". */
  .who .name {
    font-weight: 650; font-size: 15px; letter-spacing: -.01em; line-height: 1.25;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .who .sub {
    font-size: 11.5px; color: color-mix(in srgb, var(--on-brand) 78%, transparent);
    display: flex; align-items: center; gap: 5px; margin-top: 2px;
  }
  .live {
    width: 6px; height: 6px; border-radius: 50%; flex: none;
    background: #4ade80;
    animation: pulse 2.4s ease-out infinite;
  }
  @keyframes pulse {
    0%   { box-shadow: 0 0 0 0 rgba(74,222,128,.5); }
    70%  { box-shadow: 0 0 0 6px rgba(74,222,128,0); }
    100% { box-shadow: 0 0 0 0 rgba(74,222,128,0); }
  }
  select#lang {
    border: 1px solid color-mix(in srgb, var(--on-brand) 30%, transparent);
    border-radius: 9px; flex: none;
    max-width: 118px; padding: 7px 8px; font-size: 12px; font-family: inherit;
    background: color-mix(in srgb, var(--on-brand) 14%, transparent);
    color: var(--on-brand);
    cursor: pointer; outline-color: var(--on-brand);
  }
  /* Native dropdown lists render on the OS surface, not the brand field. */
  select#lang option { background: var(--surface); color: var(--text); }

  .disclaimer {
    font-size: 11.5px; line-height: 1.45; font-weight: 550;
    color: #92400e; background: #fffbeb;
    border-bottom: 1px solid #fde68a;
    padding: 8px 18px; display: none;
  }
  @media (prefers-color-scheme: dark) {
    .disclaimer { color: #fcd34d; background: #231b09; border-bottom-color: #3f2f0a; }
  }

  /* ---------------------------------------------------------- chat */
  #chat {
    background:
      linear-gradient(color-mix(in srgb, var(--brand) 7%, transparent), transparent 220px);
    flex: 1; overflow-y: auto; padding: 22px 18px 8px;
    display: flex; flex-direction: column; gap: 4px;
    scroll-behavior: smooth;
  }

  .turn { display: flex; flex-direction: column; margin-bottom: 14px; }
  .turn.user { align-items: flex-end; }

  .bubble {
    max-width: 88%; min-width: 0; overflow-wrap: anywhere; padding: 11px 15px;
    font-size: 14.5px; line-height: 1.55;
    white-space: pre-wrap; word-break: break-word;
    animation: rise .28s cubic-bezier(.2,.7,.3,1) both;
  }
  @keyframes rise { from { opacity: 0; transform: translateY(6px); } }
  .user .bubble {
    background: var(--brand); color: #fff;
    border-radius: 16px 16px 5px 16px;
  }
  .bot .bubble {
    background: var(--surface); color: var(--text);
    border: 1px solid var(--line);
    border-radius: 16px 16px 16px 5px;
    box-shadow: var(--shadow);
  }

  /* Assistant row: small spark mark beside the reply so the AI turn reads
     as a distinct actor rather than just "the other bubble color". */
  .botrow { display: flex; gap: 9px; align-items: flex-start; max-width: 100%; min-width: 0; }
  .spark {
    width: 26px; height: 26px; border-radius: 8px; flex: none; margin-top: 2px;
    background: color-mix(in srgb, var(--accent) 13%, var(--surface));
    border: 1px solid color-mix(in srgb, var(--accent) 26%, var(--line));
    display: grid; place-items: center;
  }
  .spark svg { width: 14px; height: 14px; }

  /* ------------------------------------------------- capability meta */
  /* These chips are the point of the redesign: the API already returns
     detected language, classified intent, and source attribution on every
     turn. Surfacing them is what makes the intelligence legible. */
  .meta {
    display: flex; flex-wrap: wrap; gap: 6px;
    margin: 7px 0 0 35px;
    animation: rise .3s .06s cubic-bezier(.2,.7,.3,1) both;
  }
  .chip {
    display: inline-flex; align-items: center; gap: 4.5px;
    font-size: 11px; font-weight: 550; letter-spacing: .01em;
    padding: 3.5px 8px; border-radius: 999px;
    background: var(--surface-2); color: var(--text-2);
    border: 1px solid var(--line);
  }
  .chip svg { width: 11px; height: 11px; opacity: .75; }
  .chip.guard { color: #b45309; background: #fffbeb; border-color: #fde68a; }
  .chip.human { color: #1d4ed8; background: #eff6ff; border-color: #bfdbfe; }
  @media (prefers-color-scheme: dark) {
    .chip.guard { color: #fbbf24; background: #241b08; border-color: #3f2f0a; }
    .chip.human { color: #93c5fd; background: #101a2e; border-color: #1e3a5f; }
  }
  .chip.src { cursor: pointer; }
  .chip.src:hover { border-color: color-mix(in srgb, var(--brand) 40%, var(--line)); color: var(--text); }

  /* ------------------------------------------------- source cards */
  .cites { margin: 8px 0 0 35px; display: none; flex-direction: column; gap: 6px; min-width: 0; }
  .cites.open { display: flex; }
  .cite {
    display: flex; gap: 9px; align-items: flex-start;
    padding: 9px 11px; border-radius: 11px;
    background: var(--surface); border: 1px solid var(--line);
    font-size: 12.5px; color: var(--text-2); line-height: 1.4;
    animation: rise .24s cubic-bezier(.2,.7,.3,1) both;
  }
  .cite .n {
    width: 17px; height: 17px; border-radius: 5px; flex: none;
    background: color-mix(in srgb, var(--accent) 16%, transparent);
    color: var(--accent); font-size: 10px; font-weight: 700;
    display: grid; place-items: center; margin-top: 1px;
  }
  .cite .t { color: var(--text); font-weight: 550; }
  .cite span { min-width: 0; overflow-wrap: anywhere; }

  /* ------------------------------------------------- suggestions */
  .suggest {
    display: flex; flex-wrap: wrap; gap: 7px;
    margin: 4px 0 2px 35px;
    animation: rise .3s .12s cubic-bezier(.2,.7,.3,1) both;
  }
  .sg {
    font-family: inherit; font-size: 12.5px; font-weight: 500;
    max-width: 100%; text-align: left; overflow-wrap: anywhere;
    padding: 8px 13px; border-radius: 999px; cursor: pointer;
    background: var(--surface); color: var(--text);
    border: 1px solid var(--line);
    transition: border-color .15s, transform .15s, background .15s;
  }
  .sg:hover {
    border-color: color-mix(in srgb, var(--brand) 45%, var(--line));
    background: color-mix(in srgb, var(--brand) 5%, var(--surface));
    transform: translateY(-1px);
  }

  /* ------------------------------------------------- thinking */
  .think {
    display: flex; align-items: center; gap: 9px;
    margin-bottom: 14px;
    animation: rise .2s both;
  }
  .think .label {
    font-size: 12.5px; color: var(--text-3);
    background: linear-gradient(90deg, var(--text-3) 20%, var(--text) 45%, var(--text-3) 70%);
    background-size: 220% 100%;
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: shimmer 1.7s linear infinite;
  }
  @keyframes shimmer { to { background-position: -220% 0; } }

  /* ------------------------------------------------- composer */
  .composer { padding: 10px 14px calc(10px + env(safe-area-inset-bottom)); background: var(--surface); border-top: 1px solid var(--line); }
  form { display: flex; gap: 9px; align-items: flex-end; }
  .field {
    flex: 1; display: flex; align-items: center;
    background: var(--surface-2); border: 1px solid var(--line);
    border-radius: 14px; padding: 3px 4px 3px 14px;
    transition: border-color .15s, box-shadow .15s;
  }
  .field:focus-within {
    border-color: color-mix(in srgb, var(--brand) 55%, var(--line));
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--brand) 12%, transparent);
  }
  input[type=text] {
    flex: 1; min-width: 0; border: 0; background: none; outline: none;
    padding: 11px 0; font-family: inherit; color: var(--text);
    /* Must stay >= 16px. iOS Safari auto-zooms a focused input below that,
       and the zoom widens the layout viewport — which is what made the
       whole chat pan side to side once the keyboard opened. */
    font-size: 16px;
  }
  input[type=text]::placeholder { color: var(--text-3); }
  button#send {
    width: 38px; height: 38px; flex: none; border: 0; border-radius: 11px;
    background: var(--brand); color: #fff; cursor: pointer;
    display: grid; place-items: center;
    transition: opacity .15s, transform .15s;
  }
  button#send:hover:not(:disabled) { transform: scale(1.05); }
  button#send:disabled { opacity: .35; cursor: default; }
  button#send svg { width: 17px; height: 17px; }

  .notice {
    text-align: center; font-size: 10.5px; line-height: 1.4;
    color: var(--text-3); padding: 8px 16px 0;
  }

  /* ------------------------------------------------- talk to a teller */
  /* Offered in the thread, at the turn where a person would actually have
     helped, rather than parked in the header where it competes with the
     assistant on every message. The bank is paying for the assistant to
     deflect; a permanent "skip the bot" button undercuts that. */
  .teller-offer {
    display: flex; align-items: center; gap: 10px;
    margin: 2px 0 14px 35px; padding: 11px 13px;
    background: var(--surface); border: 1px solid var(--line);
    border-radius: 13px; box-shadow: var(--shadow);
    animation: rise .3s .1s cubic-bezier(.2,.7,.3,1) both;
  }
  .teller-offer .ico {
    width: 30px; height: 30px; border-radius: 9px; flex: none;
    background: color-mix(in srgb, var(--accent) 13%, var(--surface));
    border: 1px solid color-mix(in srgb, var(--accent) 26%, var(--line));
    color: var(--accent); display: grid; place-items: center;
  }
  .teller-offer .ico svg { width: 15px; height: 15px; }
  .teller-offer .txt { flex: 1; min-width: 0; }
  .teller-offer .txt b { display: block; font-size: 13px; font-weight: 600; }
  .teller-offer .txt span { font-size: 11.5px; color: var(--text-2); }
  .teller-offer button {
    font-family: inherit; font-size: 12.5px; font-weight: 600; flex: none;
    padding: 8px 14px; border-radius: 10px; cursor: pointer; border: 0;
    background: var(--brand); color: #fff;
    transition: transform .15s, opacity .15s;
  }
  .teller-offer button:hover { transform: translateY(-1px); }

  /* The sheet. Covers the chat rather than replacing it, so closing it puts
     the customer back exactly where they were mid-conversation. */
  .sheet {
    position: fixed; inset: 0; z-index: 20;
    display: none; align-items: flex-end; justify-content: center;
    background: rgba(10,12,16,.5);
    animation: fade .2s both;
  }
  .sheet.open { display: flex; }
  @keyframes fade { from { opacity: 0; } }
  .sheet .panel {
    width: 100%; max-width: 460px; max-height: 92%; overflow-y: auto;
    background: var(--surface); color: var(--text);
    border-radius: 20px 20px 0 0;
    padding: 20px 20px calc(20px + env(safe-area-inset-bottom));
    animation: slideup .28s cubic-bezier(.2,.7,.3,1) both;
  }
  @keyframes slideup { from { transform: translateY(18px); opacity: 0; } }
  .sheet h2 { font-size: 17px; font-weight: 650; letter-spacing: -.01em; }
  .sheet .lede { font-size: 13px; color: var(--text-2); line-height: 1.5; margin-top: 6px; }

  /* What the person on the call can and cannot do, side by side and equally
     prominent. The "cannot" half is not a disclaimer to be buried — someone
     who queues ten minutes to ask for a transfer and is refused live has had
     a worse experience than being told instantly. */
  .can { margin-top: 15px; display: flex; flex-direction: column; gap: 7px; }
  .can .row {
    display: flex; gap: 9px; align-items: flex-start;
    font-size: 13px; line-height: 1.45;
  }
  .can .row svg { width: 15px; height: 15px; flex: none; margin-top: 2px; }
  .can .row.yes svg { color: #16a34a; }
  .can .row.no  svg { color: #b45309; }
  .can .row.no  { color: var(--text-2); }
  @media (prefers-color-scheme: dark) {
    .can .row.yes svg { color: #4ade80; }
    .can .row.no  svg { color: #fbbf24; }
  }
  .can .hd {
    font-size: 11px; font-weight: 650; letter-spacing: .05em;
    text-transform: uppercase; color: var(--text-3); margin-top: 4px;
  }

  .sheet .actions { display: flex; gap: 9px; margin-top: 18px; }
  .sheet .actions button {
    flex: 1; font-family: inherit; font-size: 14px; font-weight: 600;
    padding: 13px; border-radius: 12px; cursor: pointer;
    transition: transform .15s, opacity .15s;
  }
  .sheet .actions button:hover:not(:disabled) { transform: translateY(-1px); }
  .sheet .actions button:disabled { opacity: .5; cursor: default; }
  .btn-primary { border: 0; background: var(--brand); color: #fff; }
  .btn-quiet {
    background: var(--surface-2); color: var(--text); border: 1px solid var(--line);
  }

  /* Media choice. Audio first and preselected — outside Addis it is the
     common case, and defaulting to video quietly makes the product worse for
     the customers with the weakest connections. */
  .media { display: flex; gap: 9px; margin-top: 15px; }
  .media label {
    flex: 1; display: flex; align-items: center; gap: 8px; cursor: pointer;
    padding: 11px 12px; border-radius: 12px; font-size: 13px; font-weight: 550;
    background: var(--surface-2); border: 1px solid var(--line);
    transition: border-color .15s, background .15s;
  }
  /* An inline <svg> with only a viewBox has no intrinsic size, so it fills its
     flex line — these rendered at 109px before this rule. Every other icon in
     the widget is sized by its own container's rule; this one needs its own. */
  .media label svg { width: 16px; height: 16px; flex: none; opacity: .8; }
  .media label:has(input:checked) {
    border-color: color-mix(in srgb, var(--brand) 55%, var(--line));
    background: color-mix(in srgb, var(--brand) 8%, var(--surface));
  }
  .media label:has(input:checked) svg { opacity: 1; color: var(--accent); }
  .media input { accent-color: var(--brand); }

  /* Waiting. The number is the whole point — someone told they are third will
     wait; someone shown a spinner leaves. */
  .queue { text-align: center; padding: 10px 0 4px; }
  .queue .pos {
    font-size: 40px; font-weight: 300; letter-spacing: -.03em; line-height: 1.1;
    color: var(--accent);
  }
  .queue .posl { font-size: 13.5px; color: var(--text-2); margin-top: 4px; }
  .queue .timer {
    font-size: 12px; color: var(--text-3); margin-top: 10px;
    font-variant-numeric: tabular-nums;
  }
  .ring {
    width: 26px; height: 26px; margin: 0 auto 12px; border-radius: 50%;
    border: 2.5px solid color-mix(in srgb, var(--accent) 22%, transparent);
    border-top-color: var(--accent);
    animation: spin .9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  @media (prefers-reduced-motion: reduce) {
    .ring { animation: none; }
    .bubble, .meta, .suggest, .teller-offer, .sheet, .sheet .panel { animation: none; }
  }

  @media (max-width: 420px) {
    .bubble { max-width: 92%; font-size: 14px; }
    .meta, .cites, .suggest, .teller-offer { margin-left: 0; }
  }
</style>
</head>
<body>

<div class="disclaimer" id="disclaimer"></div>

<header>
  <div class="mark" id="mark">·</div>
  <div class="who">
    <div class="name" id="bankName">Connecting…</div>
    <div class="sub"><span class="live"></span><span id="assistLabel">AI Assistant</span></div>
  </div>
  <select id="lang" title="Language"></select>
</header>

<div id="chat"></div>

<div class="composer">
  <form id="form">
    <div class="field">
      <input id="input" type="text" autocomplete="off" placeholder="Ask about accounts, transfers, loans…">
    </div>
    <button id="send" type="submit" title="Send" aria-label="Send">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
    </button>
  </form>
  <div class="notice">Answers are drawn from this bank's official information and cited. General education only — not personal investment advice.</div>
</div>

<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
  <div class="panel" id="sheetPanel"></div>
</div>

<script>
(function () {
  var params = new URLSearchParams(location.search);
  var slug = params.get("bank") || "demo";
  var api = location.origin;
  var conversationId = null;
  var chat = document.getElementById("chat");
  var input = document.getElementById("input");
  var send = document.getElementById("send");
  // Swapped in while the assistant is waiting for a name and number, so the
  // request is visible in the box the customer is about to type into.
  var DEFAULT_PROMPT = input.getAttribute("placeholder");
  var CONTACT_PROMPT = "Your name and phone number…";
  var langSel = document.getElementById("lang");
  var bankName = "";

  var LANGS = { en: "English", am: "አማርኛ", om: "Afaan Oromoo", ti: "ትግርኛ", so: "Soomaali" };

  // Intent -> what the bank's evaluator should understand happened. These
  // mirror classifier.py's taxonomy; the point is to make a refusal read as
  // a deliberate policy control rather than the bot failing to answer.
  var INTENTS = {
    question:          { label: "Product guidance", icon: "book" },
    greeting:          null,
    comparison:        { label: "Competitive query", icon: "chart" },
    investment_advice: { label: "Advice guardrail", icon: "shield", cls: "guard" },
    account_specific:  { label: "Account-data guardrail", icon: "lock", cls: "guard" },
    complaint:         { label: "Complaint", icon: "flag", cls: "guard" }
  };

  // Outcome -> label, checked before INTENTS. Intent describes what was
  // *asked*; several turns are not answering a question at all, and were
  // inheriting "Product guidance" from the placeholder intent as a result — a
  // chip claiming the bank's own product information was given when it wasn't.
  // In front of a bank evaluating a product whose whole pitch is "it tells you
  // when it doesn't know", that is the worst chip to be wrong about.
  //
  // A key present with a null value SUPPRESSES the chip, which is why this is
  // a hasOwnProperty lookup rather than `||`. Only outcomes that intent gets
  // wrong belong here; everything else falls through to the intent chip.
  var OUTCOMES = {
    // Stored a phone number. Not guidance of any kind.
    contact_captured: { label: "Contact saved", icon: "user", cls: "human" },
    // Found nothing and routed to a person. Admitting the gap is the point;
    // "Product guidance" claimed the opposite of what happened.
    unanswered:       { label: "Knowledge gap", icon: "book", cls: "guard" },
    // Already carries its own "General guidance" chip below. A second chip
    // reading "Product guidance" both duplicates it and contradicts it, since
    // this answer is explicitly NOT the bank's published content.
    general_guidance: null
  };

  var ICONS = {
    book:   '<path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>',
    chart:  '<path d="M3 3v18h18"/><path d="M18 17V9M13 17V5M8 17v-3"/>',
    shield: '<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>',
    lock:   '<rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>',
    flag:   '<path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/><path d="M4 22v-7"/>',
    globe:  '<circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15 15 0 0 1 0 20 15 15 0 0 1 0-20z"/>',
    doc:    '<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/>',
    user:   '<path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>',
    spark:  '<path d="M12 3l1.9 5.4L19 10l-5.1 1.6L12 17l-1.9-5.4L5 10l5.1-1.6z"/>',
    head:   '<path d="M3 14v-2a9 9 0 0 1 18 0v2"/><path d="M21 15a2 2 0 0 1-2 2h-1v-5h1a2 2 0 0 1 2 2zM3 15a2 2 0 0 0 2 2h1v-5H5a2 2 0 0 0-2 2z"/><path d="M18 17v1a3 3 0 0 1-3 3h-3"/>',
    cam:    '<path d="M23 7l-7 5 7 5z"/><rect x="1" y="5" width="15" height="14" rx="2"/>',
    mic:    '<rect x="9" y="2" width="6" height="11" rx="3"/><path d="M5 10v1a7 7 0 0 0 14 0v-1M12 18v4"/>',
    check:  '<path d="M20 6L9 17l-5-5"/>',
    cross:  '<path d="M18 6L6 18M6 6l12 12"/>'
  };

  // Server-side capability keys (teller.py) -> what to tell the customer.
  // A key with no entry is skipped rather than printed raw: a new capability
  // shipped on the API should not surface as "dispute_intake" in a bank's
  // customer-facing widget before anyone has written the sentence for it.
  var CAPABILITY = {
    general_guidance: "Explain products, fees and eligibility",
    own_records:      "Look up your own application or account records",
    document_capture: "Take a copy of your ID or a completed form",
    dispute_intake:   "File a complaint or dispute on your behalf"
  };

  // What no session can do, at any level of verification. Shown up front and
  // as prominently as the "can" list, not tucked into small print.
  //
  // This is a product boundary, not a limitation being apologised for: the
  // assistant never touches money, so a compromised session cannot move any.
  // A customer who queues ten minutes to ask for a transfer and is refused
  // live has had a far worse experience than one told before they waited.
  var CANNOT = [
    "Move money — deposits, withdrawals or transfers",
    "Change your PIN, password or security details"
  ];

  function svg(name, extra) {
    return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" ' +
           'stroke-linecap="round" stroke-linejoin="round"' + (extra || "") + '>' + ICONS[name] + '</svg>';
  }
  // Pick readable header text for an arbitrary tenant brand colour. Uses
  // WCAG relative luminance rather than a naive average, so mid-tone brands
  // land on the right side. A tenant is free to set a pale primary_color;
  // the header must stay legible without anyone hand-tuning it.
  function onBrand(hex) {
    var m = /^#?([0-9a-f]{3}|[0-9a-f]{6})$/i.exec(String(hex || "").trim());
    if (!m) return "#ffffff";
    var h = m[1];
    if (h.length === 3) h = h[0]+h[0]+h[1]+h[1]+h[2]+h[2];
    var c = [0,2,4].map(function (i) {
      var v = parseInt(h.substr(i,2),16) / 255;
      return v <= 0.03928 ? v/12.92 : Math.pow((v+0.055)/1.055, 2.4);
    });
    var L = 0.2126*c[0] + 0.7152*c[1] + 0.0722*c[2];
    // Contrast vs white is (1.05)/(L+0.05); vs black it's (L+0.05)/0.05.
    return (1.05 / (L + 0.05)) >= ((L + 0.05) / 0.05) ? "#ffffff" : "#101114";
  }

  function el(tag, cls, html) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (html != null) e.innerHTML = html;
    return e;
  }
  function scroll() { chat.scrollTop = chat.scrollHeight; }

  function initials(name) {
    var clean = String(name).replace(/[^A-Za-zሀ-፿ ]/g, "").trim();
    // A name that is already a mark is its own initials. Reducing "CBE" to the
    // first letter of its only word renders the country's largest bank as "C".
    if (/^[A-Z]{2,4}$/.test(clean)) return clean;
    return clean.split(/\s+/).filter(Boolean).slice(0, 2)
      .map(function (w) { return w[0]; }).join("").toUpperCase() || "AI";
  }

  function addUser(text) {
    var turn = el("div", "turn user");
    var b = el("div", "bubble");
    b.textContent = text;
    turn.appendChild(b);
    chat.appendChild(turn);
    scroll();
  }

  // `done` fires when the text has finished revealing — not when the request
  // returned. Anything appended below the reply has to wait for that, or it
  // sits under a half-written sentence looking like it interrupted.
  function addBot(text, reveal, done) {
    var turn = el("div", "turn bot");
    var row = el("div", "botrow");
    var sp = el("div", "spark", svg("spark", ' style="fill:currentColor;stroke:none" class="brandfill"'));
    sp.firstChild.style.color = getComputedStyle(document.documentElement).getPropertyValue("--accent");
    var b = el("div", "bubble");
    row.appendChild(sp); row.appendChild(b);
    turn.appendChild(row);
    chat.appendChild(turn);

    if (!reveal) { b.textContent = text; scroll(); if (done) done(); return turn; }

    // Progressive reveal. The response arrives complete from a single POST —
    // this is a presentation choice, not true token streaming. It reads as
    // live generation, which is what a prospect expects from an AI product.
    var words = text.split(/(\s+)/), i = 0;
    (function step() {
      if (i >= words.length) { scroll(); if (done) done(); return; }
      b.textContent += words[i++];
      scroll();
      setTimeout(step, words[i - 1] && words[i - 1].trim() ? 16 : 8);
    })();
    return turn;
  }

  function addMeta(turn, data) {
    var chips = [];

    // Language auto-detection — invisible before this redesign, and the
    // single most persuasive capability for an Ethiopian bank.
    if (data.language && LANGS[data.language]) {
      chips.push('<span class="chip">' + svg("globe") + LANGS[data.language] + '</span>');
    }
    var it = Object.prototype.hasOwnProperty.call(OUTCOMES, data.outcome)
      ? OUTCOMES[data.outcome]
      : INTENTS[data.intent];
    if (it) {
      chips.push('<span class="chip ' + (it.cls || "") + '">' + svg(it.icon) + it.label + '</span>');
    }
    if (data.general_knowledge) {
      chips.push('<span class="chip guard">' + svg("book") + 'General guidance</span>');
    }
    if (data.handoff_created) {
      chips.push('<span class="chip human">' + svg("user") + 'Routed to a person</span>');
    }
    var n = (data.sources || []).length;
    if (n) {
      chips.push('<span class="chip src" data-toggle="1">' + svg("doc") + n + ' source' + (n > 1 ? "s" : "") + '</span>');
    }
    if (!chips.length) return;

    var meta = el("div", "meta", chips.join(""));
    turn.appendChild(meta);

    if (n) {
      var cites = el("div", "cites");
      (data.sources || []).forEach(function (s, idx) {
        cites.appendChild(el("div", "cite",
          '<span class="n">' + (idx + 1) + '</span><span><span class="t">' +
          String(s.title).replace(/[<>&]/g, "") + '</span><br>Official ' + bankName + ' information</span>'));
      });
      turn.appendChild(cites);
      var tog = meta.querySelector('[data-toggle]');
      tog.addEventListener("click", function () { cites.classList.toggle("open"); scroll(); });
    }
    scroll();
  }

  function addSuggestions(list) {
    var wrap = el("div", "suggest");
    list.forEach(function (q) {
      var b = el("button", "sg");
      b.type = "button";
      b.textContent = q;
      b.addEventListener("click", function () { wrap.remove(); ask(q); });
      wrap.appendChild(b);
    });
    chat.appendChild(wrap);
    scroll();
  }

  function thinking() {
    var t = el("div", "think",
      '<div class="spark">' + svg("spark", ' style="fill:currentColor;stroke:none"') + '</div>' +
      '<span class="label">Searching official information…</span>');
    t.querySelector(".spark svg").style.color = getComputedStyle(document.documentElement).getPropertyValue("--accent");
    chat.appendChild(t);
    scroll();
    return t;
  }

  // ------------------------------------------------------------ boot
  fetch(api + "/banks/" + encodeURIComponent(slug) + "/public")
    .then(function (r) { if (!r.ok) throw new Error("bank"); return r.json(); })
    .then(function (cfg) {
      bankName = cfg.name;
      document.getElementById("bankName").textContent = cfg.name;
      document.title = cfg.name + " — AI Assistant";
      if (cfg.primary_color) {
        document.documentElement.style.setProperty("--brand", cfg.primary_color);
      }
      document.documentElement.style.setProperty("--on-brand", onBrand(cfg.primary_color));

      var mark = document.getElementById("mark");
      if (cfg.logo_url) {
        // Optional per-tenant logo. Falls back to initials if it fails to
        // load, so a broken URL never leaves an empty tile in the header.
        var img = document.createElement("img");
        img.alt = cfg.name;
        img.onerror = function () {
          mark.classList.remove("haslogo");
          mark.textContent = initials(cfg.name);
        };
        // Measured rather than guessed: only the image knows whether the bank
        // sent a compact mark or a full lockup, and the two need different
        // layouts. Set on the header so the CSS can also drop the name beside
        // a logo that already contains one.
        img.onload = function () {
          if (!img.naturalHeight) return;
          var head = mark.closest("header") || mark;
          head.setAttribute(
            "data-logo", img.naturalWidth / img.naturalHeight >= 2 ? "wide" : "mark"
          );
        };
        img.src = cfg.logo_url;
        mark.textContent = "";
        mark.classList.add("haslogo");
        mark.appendChild(img);
      } else {
        mark.textContent = initials(cfg.name);
      }

      if (cfg.disclaimer) {
        var d = document.getElementById("disclaimer");
        d.textContent = cfg.disclaimer;
        d.style.display = "block";
      }

      // Both halves: the tenant has the feature on AND somebody is watching
      // the queue. The server decides; the widget never infers availability
      // from the feature merely existing, because a button that queues a
      // customer behind nobody is worse than no button.
      tellerAvailable = !!cfg.teller_available;

      var auto = el("option"); auto.value = ""; auto.textContent = "Auto";
      langSel.appendChild(auto);
      (cfg.languages || []).forEach(function (l) {
        var o = el("option"); o.value = l.code; o.textContent = l.name;
        langSel.appendChild(o);
      });

      addBot("Selam! I'm " + cfg.name + "'s AI assistant. Ask me about accounts, transfers, loans or saving — in English or አማርኛ, I'll follow your language automatically.", false);
      addSuggestions([
        "How do I open an account?",
        "What do I need for a loan?",
        "ሰላም፣ የሞባይል ባንኪንግ እንዴት እጠቀማለሁ?"
      ]);
    })
    .catch(function () {
      document.getElementById("bankName").textContent = "Bank not found";
      document.getElementById("assistLabel").textContent = "Check the ?bank= slug";
      input.disabled = true; send.disabled = true;
    });

  // ------------------------------------------------------------ ask
  function ask(text) {
    // Chips are an affordance for the current moment, not conversation
    // history — a stale set left pinned above the thread reads as clutter
    // and invites taps that no longer relate to what's on screen.
    Array.prototype.forEach.call(
      chat.querySelectorAll(".suggest"), function (n) { n.remove(); });
    addUser(text);
    input.value = "";
    send.disabled = true;
    var t = thinking();

    var body = { message: text, conversation_id: conversationId };
    if (langSel.value) body.language = langSel.value;

    fetch(api + "/chat/" + encodeURIComponent(slug), {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body)
    })
      // Carry the status through. Throwing a bare Error made a rate limit, a
      // server fault and a dropped connection produce one identical sentence,
      // so a failure seen in the wild could not be told apart from any other —
      // and the customer got no idea whether retrying was worth it.
      .then(function (r) {
        if (!r.ok) { var e = new Error("chat"); e.status = r.status; throw e; }
        return r.json();
      })
      .then(function (data) {
        conversationId = data.conversation_id;
        t.remove();
        var turn = addBot(data.reply, true, function () {
          // After the reply has finished writing itself, not before — see
          // addBot. The offer is a response to what the assistant just said,
          // and appearing mid-sentence makes it read as an interruption.
          if (shouldOfferTeller(data)) offerTeller();
        });
        addMeta(turn, data);
        // Offered when retrieval found nothing confident. Tapping one asks
        // about that topic, so a customer whose phrasing missed the
        // knowledge base gets a way forward instead of a dead end.
        if (data.suggestions && data.suggestions.length) {
          addSuggestions(data.suggestions.map(function (sg) { return sg.title; }));
        }
        // The reply just asked how to reach this customer. Say so in the box
        // they are about to type into. The ask now closes the message text,
        // but these chips are still the loudest thing on screen, so the
        // placeholder is what keeps the ask from being tapped straight past.
        input.placeholder = data.awaiting_contact ? CONTACT_PROMPT : DEFAULT_PROMPT;
      })
      .catch(function (err) {
        t.remove();
        var status = err && err.status;
        var msg;
        if (status === 429) {
          msg = "That was a lot of messages at once — please wait a moment and try again.";
        } else if (status === 404) {
          msg = "This assistant is not available. Please check the link you used.";
        } else if (status) {
          // The code is the only thing that tells a 500 from a 503 after the
          // fact, and a screenshot is usually all the evidence there is.
          msg = "Sorry — the assistant is temporarily unavailable (error " + status +
                "). Please try again in a moment.";
        } else {
          msg = "Sorry — I couldn't reach the assistant. Please check your connection and try again.";
        }
        addBot(msg, false);
      })
      .finally(function () { send.disabled = false; input.focus(); });
  }

  // ------------------------------------------------------- talk to a teller
  //
  // The escape hatch from the assistant to a person, for the cases the
  // assistant is designed NOT to handle: anything about this customer's own
  // account, complaints, and the gaps where the knowledge base has nothing.
  //
  // Deliberately not a permanent header button. The bank is paying for the
  // assistant to deflect volume, and a standing "skip the bot" control on
  // every screen is how a deflection product becomes a queue product. It is
  // offered at the turn where a person would genuinely have helped, which is
  // also the moment the customer is most likely to accept it.

  var tellerAvailable = false;   // set from /public — enabled AND someone on
  var session = null;            // the live session, once requested
  var pollTimer = null;
  var tickTimer = null;
  var sheet = document.getElementById("sheet");
  var sheetPanel = document.getElementById("sheetPanel");

  function mmss(sec) {
    var m = Math.floor(sec / 60), s = sec % 60;
    return m + ":" + (s < 10 ? "0" : "") + s;
  }

  // Offer a person after a turn the assistant could not carry. Which turns
  // those are is decided by what the API already reports, not by guessing at
  // the text: an explicit handoff, an admitted knowledge gap, and the two
  // guardrails that exist precisely because a human is the right answer.
  function shouldOfferTeller(data) {
    return tellerAvailable && !session && (
      data.handoff_created ||
      data.outcome === "unanswered" ||
      data.intent === "account_specific" ||
      data.intent === "complaint"
    );
  }

  function offerTeller() {
    var card = el("div", "teller-offer",
      '<div class="ico">' + svg("head") + '</div>' +
      '<div class="txt"><b>Speak to a ' + bankName + ' teller</b>' +
      '<span>Available now — audio or video</span></div>' +
      '<button type="button">Connect</button>');
    card.querySelector("button").addEventListener("click", function () {
      card.remove();
      openPreflight();
    });
    chat.appendChild(card);
    scroll();
  }

  function openSheet(html) {
    sheetPanel.innerHTML = html;
    sheet.classList.add("open");
  }
  function closeSheet() {
    sheet.classList.remove("open");
  }

  // What the teller will and will not be able to do — BEFORE the customer
  // commits to waiting. Both tiers are shown, because the second one explains
  // why they are about to be asked for an ID: arriving at that request with no
  // warning reads as an interrogation rather than a verification step.
  function openPreflight() {
    var yes = ["general_guidance"].map(function (k) {
      return '<div class="row yes">' + svg("check") + '<span>' + CAPABILITY[k] + '</span></div>';
    }).join("");
    var more = ["own_records", "document_capture", "dispute_intake"].map(function (k) {
      return '<div class="row yes">' + svg("check") + '<span>' + CAPABILITY[k] + '</span></div>';
    }).join("");
    var no = CANNOT.map(function (label) {
      return '<div class="row no">' + svg("cross") + '<span>' + label + '</span></div>';
    }).join("");

    openSheet(
      '<h2 id="sheetTitle">Speak to a teller</h2>' +
      '<p class="lede">A ' + bankName + ' teller will join you on a call. ' +
      'They will ask to see your Fayda ID and check a detail on your account ' +
      'before discussing anything specific to you.</p>' +
      '<div class="can">' +
        '<div class="hd">Straight away</div>' + yes +
        '<div class="hd">Once they have checked your ID</div>' + more +
        '<div class="hd">Not on this call, ever</div>' + no +
      '</div>' +
      '<div class="media">' +
        '<label>' + svg("mic") + '<input type="radio" name="media" value="audio" checked hidden>Audio</label>' +
        '<label>' + svg("cam") + '<input type="radio" name="media" value="video" hidden>Video</label>' +
      '</div>' +
      '<div class="actions">' +
        '<button type="button" class="btn-quiet" id="tCancel">Not now</button>' +
        '<button type="button" class="btn-primary" id="tGo">Join the queue</button>' +
      '</div>'
    );
    // The radios are visually hidden but still the source of truth, so the
    // label's :has(input:checked) styling and the value read here cannot
    // disagree with each other.
    Array.prototype.forEach.call(sheetPanel.querySelectorAll(".media label"),
      function (lab) {
        lab.addEventListener("click", function () {
          lab.querySelector("input").checked = true;
        });
      });
    document.getElementById("tCancel").addEventListener("click", closeSheet);
    document.getElementById("tGo").addEventListener("click", function (e) {
      e.target.disabled = true;
      var picked = sheetPanel.querySelector('input[name=media]:checked');
      requestSession(picked ? picked.value : "audio");
    });
  }

  function requestSession(media) {
    fetch(api + "/chat/" + encodeURIComponent(slug) + "/teller-session", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ conversation_id: conversationId, media: media })
    })
      .then(function (r) {
        if (!r.ok) { var e = new Error("session"); e.status = r.status; throw e; }
        return r.json();
      })
      .then(function (data) {
        session = data;
        // The clock starts here, in the client. The customer-facing session
        // payload deliberately carries no timestamps — it is served to anyone
        // holding the id — so the elapsed time on screen is time since this
        // browser asked, which is also the number the customer cares about.
        session.waited_from = Date.now();
        renderQueue();
        startPolling();
      })
      .catch(function (err) {
        // 409 is the tenant having the feature switched off between the page
        // loading and the tap. Named separately because it is the one failure
        // where retrying is pointless and the customer should be sent back to
        // the assistant rather than left tapping.
        var msg = (err && err.status === 409)
          ? "Live teller sessions aren't available right now."
          : "Sorry — we couldn't reach a teller. Please try again in a moment.";
        closeSheet();
        addBot(msg, false);
      });
  }

  function renderQueue() {
    if (!session) return;
    if (session.state === "queued") {
      var ahead = session.ahead;
      var pos = (ahead == null) ? "" :
        '<div class="pos">' + (ahead + 1) + '</div>' +
        // Not "a teller is joining" — being first in the queue is not the same
        // as someone having picked up, and copy that implies an imminent
        // answer is a promise nothing here can keep.
        '<div class="posl">' + (ahead === 0
          ? "You're first in the queue"
          : "in the queue, " + ahead + " ahead of you") + '</div>';
      openSheet(
        '<h2 id="sheetTitle">Waiting for a teller</h2>' +
        '<div class="queue"><div class="ring"></div>' + pos +
        '<div class="timer" id="tTimer">0:00</div></div>' +
        '<div class="actions">' +
          '<button type="button" class="btn-quiet" id="tLeave">Leave the queue</button>' +
        '</div>'
      );
      document.getElementById("tLeave").addEventListener("click", leaveQueue);
      startTicking();
      return;
    }
    if (session.state === "active") {
      stopTicking();
      // The media layer mounts here. Until it does, this state is only
      // reachable on a tenant with `teller_enabled` switched on by hand —
      // which is exactly why that flag defaults to off.
      openSheet(
        '<h2 id="sheetTitle">A teller has joined</h2>' +
        '<p class="lede">' + bankName + ' has picked up your request and is ' +
        'connecting to you now. Please have your Fayda ID to hand.</p>' +
        '<div class="actions">' +
          '<button type="button" class="btn-quiet" id="tClose">Close</button>' +
        '</div>'
      );
      document.getElementById("tClose").addEventListener("click", closeSheet);
      return;
    }
    // Terminal. The session is over however it ended; drop it so the customer
    // can ask for another one rather than being stuck against a dead record.
    stopPolling();
    stopTicking();
    closeSheet();
    session = null;
  }

  function startTicking() {
    stopTicking();
    tickTimer = setInterval(function () {
      var t = document.getElementById("tTimer");
      if (!t || !session) return stopTicking();
      t.textContent = mmss(
        Math.round((Date.now() - session.waited_from) / 1000));
    }, 1000);
  }
  function stopTicking() {
    if (tickTimer) { clearInterval(tickTimer); tickTimer = null; }
  }

  function startPolling() {
    stopPolling();
    pollTimer = setInterval(poll, 3000);
  }
  function stopPolling() {
    if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
  }

  function poll() {
    if (!session) return stopPolling();
    var from = session.waited_from;
    fetch(api + "/chat/" + encodeURIComponent(slug) + "/teller-session/" + session.id)
      .then(function (r) {
        if (!r.ok) { var e = new Error("poll"); e.status = r.status; throw e; }
        return r.json();
      })
      .then(function (data) {
        if (!session) return;
        var changed = data.state !== session.state || data.ahead !== session.ahead;
        session = data;
        session.waited_from = from;
        // Only re-render when something the customer can see has changed.
        // Rebuilding the panel every three seconds would restart the spinner
        // and steal focus from the Leave button mid-tap.
        if (changed) renderQueue();
      })
      .catch(function (err) {
        // A 404 means the session is genuinely gone — stop, rather than poll a
        // record that will never exist again.
        //
        // Everything else is treated as a blip and retried. A dropped poll is
        // not an ended session, and tearing the panel down on one failed
        // request would eject a customer from a queue they are still in.
        if (err && err.status === 404) {
          stopPolling(); stopTicking(); closeSheet();
          session = null;
        }
      });
  }

  function leaveQueue() {
    if (!session) return closeSheet();
    var id = session.id;
    stopPolling(); stopTicking();
    session = null;
    closeSheet();
    fetch(api + "/chat/" + encodeURIComponent(slug) + "/teller-session/" + id,
      { method: "DELETE" }).catch(function () {});
    // No "say teller to try again" — nothing listens for that word, and copy
    // that promises a command which does not exist is worse than none. Leaving
    // clears `session`, so the next turn a person would genuinely have helped
    // with offers the queue again on its own.
    addBot("You've left the queue. I'm here if there's anything else I can help with.", false);
  }

  // Closing the tab is the commonest way a queue is abandoned, and a session
  // nobody cancels sits in the teller's queue as a customer who is not there.
  // `keepalive` is what lets the request outlive the page; sendBeacon cannot
  // be used because it only issues POST.
  window.addEventListener("pagehide", function () {
    if (!session || session.state !== "queued") return;
    fetch(api + "/chat/" + encodeURIComponent(slug) + "/teller-session/" + session.id,
      { method: "DELETE", keepalive: true }).catch(function () {});
  });

  document.getElementById("form").addEventListener("submit", function (e) {
    e.preventDefault();
    var text = input.value.trim();
    if (text) ask(text);
  });
})();
</script>
</body>
</html>
